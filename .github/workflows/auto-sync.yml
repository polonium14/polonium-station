name: Automatyczna synchronizacja z głównym repozytorium

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dodajemy remote public
        run: git remote add public https://github.com/polonium14/polonium-station.git
      - name: Pobieramy zmiany z głównego repozytorium
        run: git fetch public master
      - name: Mergujemy zmiany z głównego repozytorium
        run: git merge public/master --allow-unrelated-histories -m "Merge public by runner:${{GITHUB.run_id}}}" || true
      - name: Sprawdzamy czy są jakieś zmiany
        run: git diff --exit-code || echo "Są zmiany"
      - name: Push changes
        run: git push origin testing || (echo "Nie udało się wypchnąć zmian" && exit 1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
