name: Close PRs on master

on:
  pull_request_target:
    types: [ opened, ready_for_review ]

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{(github.head_ref == 'master' || github.head_ref == 'main' || github.head_ref == 'develop' || github.head_ref == 'stable' || github.head_ref == 'staging')
        && github.event.pull_request.head.repo.fork && github.actor != 'Polonium-bot' && github.actor != 'PJBot' && github.actor != 'github-actions[bot]' && github.actor != 'github-actions'}}

    steps:
    - uses: superbrothers/close-pull-request@v3
      with:
        comment: "Dziękujemy za wkład! Wygląda na to, że utworzyłeś pull request z gałęzi master lub innej głównej gałęzi rozwojowej. Tego [należy unikać](https://jmeridth.com/posts/do-not-issue-pull-requests-from-your-master-branch/), dlatego ten pull request został automatycznie zamknięty.\n\nSugerujemy zapoznać się z [naszą dokumentacją dotyczącą gita](https://docs.spacestation14.com/en/general-development/setup/git-for-the-ss14-developer.html).\n\nMożesz przenieść obecną pracę na inną gałąź, korzystając z [tych poleceń](https://ohshitgit.com/#accidental-commit-master). Następnie utwórz ponownie pull request z nowej gałęzi."

    # If you prefer to just comment on the pr and not close it, uncomment the below and comment the above

    # - uses: actions/github-script@v7
    #   with:
    #     script: |
    #       github.rest.issues.createComment({
    #         issue_number: ${{ github.event.number }},
    #         owner: context.repo.owner,
    #         repo: context.repo.repo,
    #         body: "Dziękujemy za wkład! Wygląda na to, że utworzyłeś pull request z gałęzi master lub innej głównej gałęzi rozwojowej. Tego [należy unikać](https://jmeridth.com/posts/do-not-issue-pull-requests-from-your-master-branch/).\n\nMożesz przenieść obecną pracę na inną gałąź, korzystając z [tych poleceń](https://ohshitgit.com/#accidental-commit-master). Następnie utwórz ponownie pull request z nowej gałęzi.\n\nTen pull request nie zostanie zamknięty automatycznie, ale maintainer może go zamknąć z tego powodu."})
