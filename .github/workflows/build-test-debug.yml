name: Build & Test Debug

on:
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.actor) }}

env: # Polonium: prevent dotnet from sending telemetry
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    if: >-
      !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.actor) &&
      (github.event_name != 'pull_request' || (
        !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.event.pull_request.user.login) &&
        github.event.pull_request.draft == false
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Master
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        cache: true # Polonium
        cache-dependency-path: |
          **/*.csproj
          nuget.config
          RobustToolbox/nuget.config

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run Content.Tests
      shell: pwsh
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Run Content.IntegrationTests
      shell: pwsh
      run: |
        $env:DOTNET_gcServer=1
        # Polonium: cap the managed heap at 12 GB (hex bytes). Server GC grows the heap up to the cap before it
        # collects hard, so the cap plus native memory must fit the 16 GB runner: with 14 GB the suite reached
        # ~15 GB RSS and swapped into the 30 minute timeout. Measured locally in a 15 GB cgroup without swap:
        # 14 GB cap gets OOM-killed, 12 GB passes with a 13.9 GB peak in ~9 minutes.
        $env:DOTNET_GCHeapHardLimit="0x300000000"
        # Polonium: EventSchedulerTest (81 cases, each a full connected round on Saltern) was ~31% of the
        # suite's time and its biggest memory spike, pushing runs past the 30 minute timeout. It runs
        # nightly and on demand in test-event-scheduler.yml instead: it carries [SlowTest] and skips itself unless
        # POLONIUM_SLOW_TESTS=1. Test filters can't do this (see SlowTestAttribute).
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive NUnit3 test results.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results
        path: test_results/*
        retention-days: 7
        compression-level: 9
  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
