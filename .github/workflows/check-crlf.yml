name: CRLF Check

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true  # We only care about latest.

jobs:
  build:
    name: CRLF Check
    if: >-
      github.actor != 'Polonium-bot' && github.actor != 'PJBot' &&
      github.actor != 'github-actions[bot]' && github.actor != 'github-actions' &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'Polonium-bot' &&
         github.event.pull_request.user.login != 'PJBot' &&
         github.event.pull_request.user.login != 'github-actions[bot]' &&
         github.event.pull_request.user.login != 'github-actions')) &&
      (github.event_name != 'push' ||
        (github.event.pusher.name != 'Polonium-bot' &&
         github.event.pusher.name != 'PJBot' &&
         github.event.pusher.name != 'github-actions[bot]' &&
         github.event.pusher.name != 'github-actions')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check for CRLF
      run: Tools/check_crlf.py
