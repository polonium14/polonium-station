name: "Labels: Branch staging"

on:
  pull_request_target:
    types:
      - opened
    branches:
      - 'staging'

jobs:
  add_label:
    if: github.actor != 'Polonium-bot' && github.actor != 'PJBot' && github.actor != 'github-actions[bot]' && github.actor != 'github-actions'
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@v1.1.3
      with:
        labels: "Gałąź: Staging"
