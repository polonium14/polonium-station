# git -> Crowdin
name: Crowdin Upload

on:
  push:
    branches: [ master ]
    paths:
      - 'Resources/Locale/**'
      - 'crowdin.yml'
      - '.github/workflows/crowdin-upload.yml'
  workflow_dispatch:
    inputs:
      approve_base:
        description: 'Commit, od którego zatwierdzić na Crowdinie zmienione klucze pl-PL (puste: bez zatwierdzania)'
        required: false
        default: ''

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  upload:
    name: Upload to Crowdin
    if: >-
      github.repository == 'polonium14/polonium-station' &&
      (github.event_name == 'workflow_dispatch' || (
        !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.actor) &&
        !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.event.pusher.name) &&
        !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.event.head_commit.author.name) &&
        !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.event.head_commit.author.username) &&
        !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.event.head_commit.committer.name) &&
        !contains(fromJSON('["Polonium-bot","PJBot","github-actions[bot]","github-actions"]'), github.event.head_commit.committer.username)
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r Tools/crowdinCI/requirements.txt

      - name: Pick files to upload
        id: files
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          UPLOAD_STEP: Upload sources and pl-PL
        run: |
          mode=full
          if [ "$EVENT" = push ]; then
            # The newest run whose upload step succeeded. The steps after it may have failed.
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/crowdin-upload.yml/runs?branch=master&status=completed&per_page=30" \
                --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' |
              while read -r id sha; do
                step=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                  --jq '.jobs[].steps[] | select(.name == env.UPLOAD_STEP) | .conclusion')
                if [ "$step" = success ]; then echo "$sha"; break; fi
              done)
            echo "Last upload: ${base:-not found}"
            if [ -n "$base" ] && git fetch --no-tags --depth=1 origin "$base"; then
              mode=$(python Tools/crowdinCI/changed_config.py --base "$base" --output crowdin.changed.yml)
            fi
          fi
          echo "Mode: $mode"
          case "$mode" in
            changed) echo "config=crowdin.changed.yml" >> "$GITHUB_OUTPUT" ;;
            full) echo "config=crowdin.yml" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload sources and pl-PL
        if: steps.files.outputs.config != ''
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: false
          download_sources: false
          upload_language: pl
          auto_approve_imported: false
          import_eq_suggestions: false
          crowdin_branch_name: master
          config: ${{ steps.files.outputs.config }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Pick revision to approve from
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_BASE: ${{ inputs.approve_base }}
        run: |
          base=""
          if [ "$EVENT" = push ]; then
            case "$MESSAGE" in
              "New Crowdin updates"*|*"/l10n_master"*) echo "Crowdin sync merge, nothing to approve" ;;
              *) base="$BEFORE" ;;
            esac
            [ "$base" = 0000000000000000000000000000000000000000 ] && base=""
          else
            base="$INPUT_BASE"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Approve changed pl-PL keys
        if: steps.range.outputs.base != ''
        env:
          BASE: ${{ steps.range.outputs.base }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python Tools/crowdinCI/approve_changed.py --base "$BASE" --head HEAD
