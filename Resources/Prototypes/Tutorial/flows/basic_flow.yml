# a whole egg gives the microwave nothing - it reads drainable solutions only, and an intact
# shell is not one. this step is the difference between a burger and a silent failure
- type: tutorialStep
  id: TutorialLinearR13Crack
  instruction: tutorial-step-r13-crack
  bubbleText: tutorial-bubble-r13-crack
  navigationAnchor: room13_table_big
  keybindHint: tutorial-hint-crack
  stuckSkipSeconds: 300
  highlightAnchors:
  - room13_table_big
  speak:
  - tutorial-holopad-r13-crack
  - tutorial-holopad-r13-crack-2
  # dough is quantized, so an overpour leaves water or flour sitting in the beaker. the recipe
  # does not care - the microwave checks "at least", never "exactly" - but the trainee reads the
  # beaker on the way past and should not have to wonder whether the leftovers ruined anything
  onEnter:
  - !type:DrainPrototypeSolutionAction
    prototype: LargeBeakerTutorial
    solution: beaker
    reagent: Water
  - !type:DrainPrototypeSolutionAction
    prototype: LargeBeakerTutorial
    solution: beaker
    reagent: Flour
  completion: !type:DrainableReagentNearbyCondition
    reagent: Egg
    amount: 12
    range: 8

- type: tutorialStep
  id: TutorialLinearR13Load
  instruction: tutorial-step-r13-load
  bubbleText: tutorial-bubble-r13-load
  navigationAnchor: room13_microwave
  keybindHint: tutorial-hint-microwave-in
  stuckSkipSeconds: 420
  highlightAnchors:
  - room13_microwave
  speak:
  - tutorial-holopad-r13-load
  - tutorial-holopad-r13-load-2
  # raw meat turns into a steak at 335K, and the microwave heats its contents on every run
  # whether or not a recipe matched. one impatient five second run and the burger is impossible,
  # so hand out fresh meat instead of leaving them stuck in front of two steaks
  watchers:
  - !type:ConditionWatcher
    condition: !type:PrototypeNearAnchorCondition
      prototype: FoodMeatCooked
      anchorId: room13_microwave
      range: 4
    quip:
    - tutorial-holopad-quip-meat-cooked
    - tutorial-holopad-quip-meat-cooked-2
    actions:
    - !type:SpawnAtAnchorAction
      anchorId: room13_table_big
      prototype: FoodMeat
      tutorialNpc: false
      preventDeath: false
    - !type:SpawnAtAnchorAction
      anchorId: room13_table_big
      prototype: FoodMeat
      tutorialNpc: false
      preventDeath: false
  # a run without a matching recipe still heats everything inside, and eggs set at 344K. the
  # recipe wants raw egg, so without this the beaker is useless and the kitchen is a dead end
  - !type:ConditionWatcher
    once: false
    condition: !type:AllCondition
      conditions:
      - !type:PrototypeSolutionContainsCondition
        prototype: LargeBeakerTutorial
        solution: beaker
        reagent: EggCooked
        amount: 1
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: LargeBeakerTutorial
          anchorId: room13_microwave
          inside: true
    quip:
    - tutorial-holopad-quip-eggs-cooked
    - tutorial-holopad-quip-eggs-cooked-2
    actions:
    - !type:SetFlagAction
      flag: eggs-cooked
    - !type:DrainPrototypeSolutionAction
      prototype: LargeBeakerTutorial
      solution: beaker
      reagent: EggCooked
    - !type:SpawnAtAnchorAction
      anchorId: room13_table_big
      prototype: FoodEgg
      tutorialNpc: false
      preventDeath: false
    - !type:SpawnAtAnchorAction
      anchorId: room13_table_big
      prototype: FoodEgg
      tutorialNpc: false
      preventDeath: false
  # someone who ran ahead and already cooked it should not be asked to load an empty microwave
  completion: !type:AnyCondition
    conditions:
    - !type:PrototypeNearAnchorCondition
      prototype: FoodBurgerSuper
      range: 10
    - !type:AllCondition
      conditions:
      - !type:PrototypeNearAnchorCondition
        prototype: FoodBreadBun
        anchorId: room13_microwave
        inside: true
      - !type:PrototypeNearAnchorCondition
        prototype: FoodMeat
        anchorId: room13_microwave
        inside: true
        count: 2
      - !type:PrototypeNearAnchorCondition
        prototype: FoodCheeseSlice
        anchorId: room13_microwave
        inside: true
      - !type:PrototypeNearAnchorCondition
        prototype: FoodTomato
        anchorId: room13_microwave
        inside: true
        count: 2
      - !type:PrototypeNearAnchorCondition
        prototype: FoodCondimentPacketSalt
        anchorId: room13_microwave
        inside: true
      - !type:PrototypeNearAnchorCondition
        prototype: FoodCondimentPacketPepper
        anchorId: room13_microwave
        inside: true
      - !type:DrainableReagentNearbyCondition
        anchorId: room13_microwave
        inside: true
        reagent: Egg
        amount: 12

- type: tutorialStep
  id: TutorialLinearR13Burger
  instruction: tutorial-step-r13-burger
  bubbleText: tutorial-bubble-r13-burger
  navigationAnchor: room13_microwave
  keybindHint: tutorial-hint-microwave-run
  stuckSkipSeconds: 420
  highlightAnchors:
  - room13_microwave
  speak:
  - tutorial-holopad-r13-burger
  - tutorial-holopad-r13-burger-2
  watchers:
  # nothing below says a word until the drum has emptied itself, which only happens when a run
  # ends. while the trainee is still loading, a verdict on what is missing is just noise.
  #
  # the four are mutually exclusive, so exactly one verdict comes out of a failed run
  - !type:ConditionWatcher
    condition: !type:AllCondition
      conditions:
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodBreadBun
          anchorId: room13_microwave
          inside: true
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodBurgerSuper
          range: 10
      - !type:PrototypeNearAnchorCondition
        prototype: FoodMeatCooked
        anchorId: room13_microwave
        range: 4
    quip:
    - tutorial-holopad-quip-meat-cooked
    - tutorial-holopad-quip-meat-cooked-2
    actions:
    - !type:SpawnAtAnchorAction
      anchorId: room13_table_big
      prototype: FoodMeat
      tutorialNpc: false
      preventDeath: false
    - !type:SpawnAtAnchorAction
      anchorId: room13_table_big
      prototype: FoodMeat
      tutorialNpc: false
      preventDeath: false
  # the eggs live in the beaker, so this is a question about what the beaker is holding rather
  # than about anything you can see in the drum
  - !type:ConditionWatcher
    condition: !type:AllCondition
      conditions:
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodBreadBun
          anchorId: room13_microwave
          inside: true
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodBurgerSuper
          range: 10
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodMeatCooked
          anchorId: room13_microwave
          range: 4
      - !type:NotCondition
        condition: !type:DrainableReagentNearbyCondition
          anchorId: room13_microwave
          range: 4
          reagent: Egg
          amount: 12
      - !type:NotCondition
        condition: !type:FlagCondition
          flag: eggs-cooked
      - !type:NotCondition
        condition: !type:PrototypeSolutionContainsCondition
          prototype: LargeBeakerTutorial
          solution: beaker
          reagent: EggCooked
          amount: 1
    quip:
    - tutorial-holopad-quip-eggs-short
  # same as while loading: a failed run sets the eggs.
  # a run without a matching recipe still heats everything inside, and eggs set at 344K. the
  # recipe wants raw egg, so without this the beaker is useless and the kitchen is a dead end
  - !type:ConditionWatcher
    once: false
    condition: !type:AllCondition
      conditions:
      - !type:PrototypeSolutionContainsCondition
        prototype: LargeBeakerTutorial
        solution: beaker
        reagent: EggCooked
        amount: 1
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: LargeBeakerTutorial
          anchorId: room13_microwave
          inside: true
    quip:
    - tutorial-holopad-quip-eggs-cooked
    - tutorial-holopad-quip-eggs-cooked-2
    actions:
    - !type:SetFlagAction
      flag: eggs-cooked
    - !type:DrainPrototypeSolutionAction
      prototype: LargeBeakerTutorial
      solution: beaker
      reagent: EggCooked
    - !type:SpawnAtAnchorAction
      anchorId: room13_table_big
      prototype: FoodEgg
      tutorialNpc: false
      preventDeath: false
    - !type:SpawnAtAnchorAction
      anchorId: room13_table_big
      prototype: FoodEgg
      tutorialNpc: false
      preventDeath: false
  - !type:ConditionWatcher
    condition: !type:AllCondition
      conditions:
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodBreadBun
          anchorId: room13_microwave
          inside: true
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodBurgerSuper
          range: 10
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodMeatCooked
          anchorId: room13_microwave
          range: 4
      - !type:DrainableReagentNearbyCondition
        anchorId: room13_microwave
        range: 4
        reagent: Egg
        amount: 12
      - !type:NotCondition
        condition: !type:AllCondition
          conditions:
          - !type:PrototypeNearAnchorCondition
            prototype: FoodBreadBun
            anchorId: room13_microwave
            range: 4
          - !type:PrototypeNearAnchorCondition
            prototype: FoodMeat
            anchorId: room13_microwave
            range: 4
            count: 2
          - !type:PrototypeNearAnchorCondition
            prototype: FoodCheeseSlice
            anchorId: room13_microwave
            range: 4
          - !type:PrototypeNearAnchorCondition
            prototype: FoodTomato
            anchorId: room13_microwave
            range: 4
            count: 2
          - !type:PrototypeNearAnchorCondition
            prototype: FoodCondimentPacketSalt
            anchorId: room13_microwave
            range: 4
          - !type:PrototypeNearAnchorCondition
            prototype: FoodCondimentPacketPepper
            anchorId: room13_microwave
            range: 4
    quip:
    - tutorial-holopad-quip-solids-short
    - tutorial-holopad-quip-solids-short-2
  # everything was in there and it still did not work, so the timer is the only thing left
  - !type:ConditionWatcher
    condition: !type:AllCondition
      conditions:
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodBreadBun
          anchorId: room13_microwave
          inside: true
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodBurgerSuper
          range: 10
      - !type:NotCondition
        condition: !type:PrototypeNearAnchorCondition
          prototype: FoodMeatCooked
          anchorId: room13_microwave
          range: 4
      - !type:DrainableReagentNearbyCondition
        anchorId: room13_microwave
        range: 4
        reagent: Egg
        amount: 12
      - !type:AllCondition
        conditions:
        - !type:PrototypeNearAnchorCondition
          prototype: FoodBreadBun
          anchorId: room13_microwave
          range: 4
        - !type:PrototypeNearAnchorCondition
          prototype: FoodMeat
          anchorId: room13_microwave
          range: 4
          count: 2
        - !type:PrototypeNearAnchorCondition
          prototype: FoodCheeseSlice
          anchorId: room13_microwave
          range: 4
        - !type:PrototypeNearAnchorCondition
          prototype: FoodTomato
          anchorId: room13_microwave
          range: 4
          count: 2
        - !type:PrototypeNearAnchorCondition
          prototype: FoodCondimentPacketSalt
          anchorId: room13_microwave
          range: 4
        - !type:PrototypeNearAnchorCondition
          prototype: FoodCondimentPacketPepper
          anchorId: room13_microwave
          range: 4
    quip:
    - tutorial-holopad-quip-burger-failed
    - tutorial-holopad-quip-burger-failed-2
  onComplete:
  - !type:SpeakHolopadAction
    lines:
    - tutorial-holopad-r13-burger-done
  completion: !type:PrototypeNearAnchorCondition
    prototype: FoodBurgerSuper
    range: 10

