    rearm: true
    condition: !type:HeldCondition
      seconds: 2
      condition: !type:AllCondition
        conditions:
        - !type:AnchorAliveCondition
          anchorId: room15_urist
        - !type:AnchorDamageBelowCondition
          anchorId: room15_urist
          max: 0
        - !type:NotCondition
          condition: !type:BuckledToAnchorCondition
            entityAnchorId: room15_urist
    quip:
    - tutorial-holopad-r15-finish-bed
  # the asphyxiation clears on its own once he breathes, the bonk bruise and a fresh scan do not.
  # every last point has to go, and he has to still be lying on the bed for it
  completion: !type:AllCondition
    conditions:
    - !type:AnchorAliveCondition
      anchorId: room15_urist
    - !type:AnchorDamageBelowCondition
      anchorId: room15_urist
      max: 0
    - !type:BuckledToAnchorCondition
      entityAnchorId: room15_urist
    - !type:HealthAnalyzedCondition
      anchorId: room15_urist
  onComplete:
