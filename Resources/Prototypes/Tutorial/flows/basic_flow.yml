# room 5 - camera rotation, then the mop
- type: tutorialStep
  id: TutorialLinearR05Cam
  instruction: tutorial-step-r05-cam
  navigationAnchor: room5
  keybindHint: tutorial-hint-camera
  speakAtAnchor: room5
  speak:
  - tutorial-holopad-r05-a
  - tutorial-holopad-r05-b
  watchers:
  # plenty of trainees mop before they turn the view. a dry mop needs the same advice here
  - !type:AbsorbentSpentWatcher
    rearm: true
    quip:
    - tutorial-holopad-quip-mop-full
  - !type:ConditionWatcher
    actions:
    - !type:AnchorMusicAction
      anchorId: room4_jukebox
      mode: Stop
    condition: !type:AnyCondition
      conditions:
      - !type:ReachAnchorCondition
        anchorId: room5
        range: 1
      - !type:ReachAnchorCondition
        anchorId: room5_getout
  # left, or right twice, is not what was asked. one quip per wrong turn, not one per poll
  - !type:ConditionWatcher
    rearm: true
    quip:
    - tutorial-holopad-r05-cam-wrong
    condition: !type:AllCondition
      conditions:
      - !type:CameraRotatedCondition
        degrees: 45
      - !type:NotCondition
        condition: !type:CameraRotatedCondition
          degrees: 80
          maxDegrees: 135
          direction: Right
  completion: !type:CameraRotatedCondition
    degrees: 80
    maxDegrees: 135
    direction: Right

- type: tutorialStep
  id: TutorialLinearR05Mop
  instruction: tutorial-step-r05-mop
  navigationAnchor: room5_wozek
  keybindHint: tutorial-hint-tool
  highlightAnchors:
  - room5_wozek
  speak:
  - tutorial-holopad-r05-c
  - tutorial-holopad-r05-d
  - tutorial-holopad-r05-e
  watchers:
  # every time it runs dry, not just the first
  - !type:AbsorbentSpentWatcher
    rearm: true
    quip:
    - tutorial-holopad-quip-mop-full
  # scoped, otherwise a spill somewhere else keeps this step open. the room 4 tea is pinned to the
  # floor on purpose and still sits inside the range, so it is ignored by name
  completion: !type:PuddlesClearedCondition
    nearAnchorId: room5_wozek
    range: 7
    ignoreReagents:
    - GreenTea

