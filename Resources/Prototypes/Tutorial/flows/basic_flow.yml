# the stock hack, the quick way first: a pulse on a power wire kills the door for 15 or 30 seconds and a
# crowbar opens an unpowered airlock in a second and a half. cutting both power wires is the permanent
# way and is shown next to it, not demanded. the wire order is random per door, so the client-side
# guide (TutorialWiresGuideSystem) reads the window and glows whatever matters right now. every other
# way into the engine room stays bolted, otherwise the lesson is optional
- type: tutorialStep
  id: TutorialLinearR16Hack
  instruction: tutorial-step-r16-hack
  navigationAnchor: room16_airlock_ame
  keybindHint: tutorial-hint-hack
  stuckSkipSeconds: 480
  wiresGuideAnchor: room16_airlock_ame
  highlightAnchors:
  - room16_airlock_ame
  speak:
  - tutorial-holopad-r16-hack-a
  - tutorial-holopad-r16-hack-b
  - tutorial-holopad-r16-hack-c
  # a crowbar does nothing against bolts, and a pulse on the bolt wire only lifts them while powered.
  # only said once they are actually down
  watchers:
  - !type:ConditionWatcher
    rearm: true
    quip:
    - tutorial-holopad-r16-bolts-dropped
    condition: !type:AllCondition
      conditions:
      - !type:DoorBoltedAnchorCondition
        anchorId: room16_airlock_ame
        bolted: true
      - !type:PoweredAnchorCondition
        anchorId: room16_airlock_ame
  - !type:ConditionWatcher
    rearm: true
    quip:
    - tutorial-holopad-r16-bolts-unpowered
    condition: !type:AllCondition
      conditions:
      - !type:DoorBoltedAnchorCondition
        anchorId: room16_airlock_ame
        bolted: true
      - !type:NotCondition
        condition: !type:PoweredAnchorCondition
          anchorId: room16_airlock_ame
  completion: !type:DoorStateAnchorCondition
    anchorId: room16_airlock_ame
    state: Open
  onComplete:
  - !type:SpeakHolopadAction
    lines:
    - tutorial-holopad-r16-pry-done
  # after a pulse the power comes back and the door would shut itself behind the trainee, and a
  # skipped step needs the way in as well. left open and dead, the engine room stays walkable
  - !type:OpenAnchorAirlockAction
    anchorId: room16_airlock_ame
  - !type:PowerDeviceAction
    anchorId: room16_airlock_ame
    powered: false
  # a skipped step still has to leave the engine room reachable
  - !type:UnlockAnchorAirlockAction
    anchorId: room16_airlock_bay
  - !type:UnlockAnchorAirlockAction
    anchorId: room16_airlock_from_ame_to_bay

