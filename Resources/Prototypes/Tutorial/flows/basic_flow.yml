  - tutorial-holopad-r15-epi-c
  onEnter:
  - !type:SpawnAtAnchorAction
    anchorId: room15_urist_bonk_target
    prototype: EmergencyMedipen
    assignAnchorId: room15_medipen
    tutorialNpc: false
    preventDeath: false
  watchers:
  # the crit can finish him before the shot lands. the defibrillator is still in the room and holds
  # its charge, so this is a setback rather than a dead end - the trainee just has to be told
  - !type:ConditionWatcher
    rearm: true
    condition: !type:DeadAnchorCondition
      anchorId: room15_urist
    quip:
    - tutorial-holopad-r15-epi-again
  # epinephrine only works in crit, so out of crit is exactly the moment it has done its job
  completion: !type:AnchorAliveCondition
    anchorId: room15_urist

