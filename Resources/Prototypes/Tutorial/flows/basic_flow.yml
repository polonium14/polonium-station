# nothing stops a trainee from raising all three machines at once, or in their own order, so the nets
# that catch a run out of steel or a board in the wrong frame belong to the room and not to whichever
# step happens to be up
- type: tutorialWatcherSet
  id: TutorialR16Build
  watchers:
  - !type:ConditionWatcher
    rearm: true
    quip:
    - tutorial-holopad-r16-steel-spare
    actions:
    - !type:SpawnAtAnchorAction
      anchorId: room16_autolathe
      prototype: SheetSteel
      tutorialNpc: false
      preventDeath: false
    condition: !type:AllCondition
      conditions:
      - !type:LatheMaterialsLoadedCondition
        anchorId: room16_autolathe
        materials: [ Steel ]
      - !type:NotCondition
        condition: !type:StackAmountNearCondition
          stackType: Steel
          min: 8
          range: 8
  - !type:ConditionWatcher
    rearm: true
    quip:
    - tutorial-holopad-r16-board-wrong
    condition: !type:PrototypeNearAnchorCondition
      prototype: SubstationMachineCircuitboard
      anchorId: room16_build_smes
      range: 0.5
      ignoreCarried: true
  - !type:ConditionWatcher
    rearm: true
    quip:
    - tutorial-holopad-r16-substation-board-wrong
    condition: !type:PrototypeNearAnchorCondition
      prototype: SMESMachineCircuitboard
      anchorId: room15_build_substation
      range: 0.5
      ignoreCarried: true

# the SMES is the one machine built with a hand on the shoulder: the crafting menu, the autolathe, then every
# stage of the frame and the examine text that says what the frame wants next. the terminal, the substation
# and the APC come after, with less and less help.
#
# every stage of a frame is a new entity (UnfinishedMachineFrame, MachineFrame, then the machine), so the
# steps look for whatever stands on the marker, and each also accepts any later stage so a quick trainee who
# runs ahead does not get stuck waiting for a stage they already passed
- type: tutorialStep
  id: TutorialLinearR16CraftMenu
  instruction: tutorial-step-r16-craft-menu
  navigationAnchor: room16_build_smes
  keybindHint: tutorial-hint-craft-menu
  craftingGuideRecipe: MachineFrame
  highlightTiles:
  - anchor: room16_build_smes
    until: [ UnfinishedMachineFrame, MachineFrame, SMESBasicEmpty ]
  speak:
  - tutorial-holopad-r16-craft-menu-a
  - tutorial-holopad-r16-craft-menu-b
  watcherSets: [ TutorialR16Build ]
  skipIf: !type:PrototypesOnAnchorsCondition
    anchorIds: [ room16_build_smes ]
    prototypes: [ SMESBasicEmpty ]
  completion: !type:CraftingMenuOpenedCondition {}

