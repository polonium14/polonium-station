# room 4 - break room. compulsory rest: lounge music, sit, drink, sit some more.
# getting up pauses the music, staying up or wasting the tea gets them thrown into room 5
- type: tutorialStep
  id: TutorialLinearR04Sit
  instruction: tutorial-step-r04-sit
  navigationAnchor: room4_chair
  keybindHint: tutorial-hint-sit
  speakAtAnchor: room4
  highlightAnchors:
  - room4_chair
  speak:
  - tutorial-holopad-r04-a
  - tutorial-holopad-r04-b
  onEnter:
  - !type:AnchorMusicAction
    anchorId: room4_jukebox
    sound: !type:SoundPathSpecifier
      path: /Audio/_Polonium/Music/lounge.ogg
    volume: -4
  completion: !type:BuckledToAnchorCondition
    anchorId: room4_chair

- type: tutorialStep
  id: TutorialLinearR04Tea
  instruction: tutorial-step-r04-tea
  allowIngestion: true
  navigationAnchor: room4_tea
  keybindHint: tutorial-hint-drink
  stuckSkipSeconds: 90
  highlightAnchors:
  - room4_tea
  speak:
  - tutorial-holopad-r04-c
  - tutorial-holopad-r04-d
  watchers:
  # got up: the music stops until they sit back down
  - !type:ConditionWatcher
    rearm: true
    quip:
    - tutorial-holopad-r04-sit-back
    actions:
    - !type:AnchorMusicAction
      anchorId: room4_jukebox
      mode: Pause
    condition: !type:AllCondition
      conditions:
      - !type:UnbuckledCondition
      - !type:NotCondition
        condition: !type:FlagCondition
          flag: spilled
      - !type:NotCondition
        condition: !type:FlagCondition
          flag: ejecting
  # back on the chair: the music picks up where it stopped
  - !type:ConditionWatcher
    rearm: true
    actions:
    - !type:AnchorMusicAction
      anchorId: room4_jukebox
      sound: !type:SoundPathSpecifier
        path: /Audio/_Polonium/Music/lounge.ogg
      volume: -4
    condition: !type:BuckledToAnchorCondition
      anchorId: room4_chair
  # still up after the warning
  - !type:ConditionWatcher
    quip:
    - tutorial-holopad-r04-disloyal-stand
    - tutorial-holopad-r04-getout
    actions:
    - !type:MuteBriefingAction
    - !type:SetFlagAction
      flag: ejecting
    condition: !type:AllCondition
      conditions:
      - !type:HeldCondition
        seconds: 20
        condition: !type:UnbuckledCondition
      - !type:NotCondition
        condition: !type:FlagCondition
          flag: spilled
      - !type:NotCondition
        condition: !type:FlagCondition
          flag: ejecting
  # some species dribble a unit per sip, that is not "you poured it out".
  # once it is on the floor they may get up to reach it, so the chair rules stand down
  - !type:PuddleNearbyWatcher
    range: 4
    reagent: GreenTea
    minVolume: 8
    quip:
    - tutorial-holopad-quip-tea
    actions:
    - !type:SetFlagAction
      flag: spilled
  # drank it off the floor, or would not even do that
  - !type:ConditionWatcher
    quip:
    - tutorial-holopad-r04-disloyal-tea
    - tutorial-holopad-r04-getout
    actions:
    - !type:MuteBriefingAction
    - !type:SetFlagAction
      flag: ejecting
    condition: !type:AllCondition
      conditions:
      - !type:FlagCondition
        flag: spilled
      - !type:AnyCondition
        conditions:
        - !type:IngestedReagentCondition
          reagent: GreenTea
        - !type:HeldCondition
          seconds: 40
          condition: !type:FlagCondition
            flag: spilled
      - !type:NotCondition
        condition: !type:FlagCondition
          flag: ejecting
  # out once she is done saying why
  - !type:ConditionWatcher
    actions:
    - !type:EjectTraineeAction
      anchorId: room5_getout
      step: TutorialLinearR05Cam
    condition: !type:AllCondition
      conditions:
      - !type:FlagCondition
        flag: ejecting
      - !type:QuipsSaidCondition
  completion: !type:AllCondition
    conditions:
    - !type:IngestedReagentCondition
      reagent: GreenTea
    - !type:NotCondition
      condition: !type:FlagCondition
        flag: spilled
    - !type:NotCondition
      condition: !type:FlagCondition
        flag: ejecting

