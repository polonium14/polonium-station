# only what the flow actually uses. rest of the catalog stays off the floor.
#
# counts are deliberately generous. a trainee who throws the knife down the disposal, spills the
# beaker or feeds the seeds to the cow has to be able to walk back and take another one, or the
# kitchen turns into a dead end halfway through.

- type: vendingMachineInventory
  id: TutorialChefvendInventory
  startingInventory:
    ReagentContainerFlourTutorial: 8
    FoodCondimentPacketSalt: 8
    FoodCondimentPacketPepper: 8
    FoodContainerEgg: 5
    FoodCheese: 5

