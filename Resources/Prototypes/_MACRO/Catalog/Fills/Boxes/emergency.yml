- type: entity
  parent: BoxSurvival
  id: BoxSurvivalAquatic
  name: H2O survival box
  description: A survival box containing a breath mask, a water bottle, an emergency pill, a flare, and a nutribrick. Standard-issue for most water-breathing crew.
  suffix: Standard H2O
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: PillEmergency
        - id: Flare
        - id: FoodSnackNutribrick
        - id: DrinkWaterBottleLargeFull
  - type: Sprite
    sprite: _MACRO/Objects/Storage/boxes.rsi
    layers:
    - state: internals
    - state: vaportank
  - type: Label
    localizedLabel: label-box-survival-h2o

- type: entity
  parent: BoxSurvivalAquatic
  id: BoxSurvivalEngineeringAquatic
  name: extended-capacity H2O survival box
  description: A survival box containing a breath mask, an extended-capacity water bottle, an emergency pill, a flare, and a nutribrick. Issued to water-breathing crew whose job responsibilities often take them to places with no atmosphere.
  suffix: Extended, H2O
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: DrinkWaterBottleTallFull
        - id: ClothingMaskBreath
        - id: PillEmergency
        - id: Flare
        - id: FoodSnackNutribrick
  - type: Sprite
    sprite: _MACRO/Objects/Storage/boxes.rsi
    layers:
    - state: internals
    - state: extendedtankvapor

- type: entity
  parent: BoxSurvivalAquatic
  id: BoxHugAquatic
  name: box of hugs
  description: A special box for sensitive people, stocked with aquatic survival supplies.
  suffix: Emergency H2O
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    layers:
    - state: box_hug
    - state: heart
  - type: Item
    size: Large
    shape:
    - 0,0,2,2
    heldPrefix: hug
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: PillEmergency
        - id: Flare
        - id: FoodSnackNutribrick
        - id: DrinkWaterBottleLargeFunnyFull
  - type: Tag
    tags:
    - BoxHug

