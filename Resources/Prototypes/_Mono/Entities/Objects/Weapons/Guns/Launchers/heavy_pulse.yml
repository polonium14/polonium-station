- type: entity
  parent: [BaseWeaponBattery, BaseGunWieldable, BaseCentcommContraband]
  id: WeaponHeavyPulseCannon
  name: heavy pulse cannon
  description: A shoulder-fired pulse cannon for opening walls, barricades and whatever hides behind them. It holds eight shots and slowly refills its own capacitor.
  components:
  - type: GunCrosshair
    crosshair: Grid
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Launchers/hpc-icon.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Launchers/hpc-inhand-32x.rsi
  - type: Item
    size: Ginormous
    sprite: _Mono/Objects/Weapons/Guns/Launchers/hpc-inhand-32x.rsi
  - type: GunRequiresWield
  - type: Gun
    fireRate: 0.3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_perforator.ogg
  - type: GunMovementSpread
    walk: 1
    run: 3
    sprint: 6.7
  - type: BatteryAmmoProvider
    proto: HeavyPulse
    fireCost: 125
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 5
  - type: SpeedModifiedOnWield
    walkModifier: 0.6
    sprintModifier: 0.6
