- type: entity
  parent: [BaseWeaponRifle, BaseCentcommContraband]
  id: WeaponRifleXlr556
  name: Falcon
  description: A compact assault rifle issued to Nanotrasen response teams. It fires faster than the Lecter and climbs faster too, so short bursts serve it best. Feeds from .20 rifle magazines.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/xlr556.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - state: base-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/xlr556_inhands_32x.rsi
  - type: Item
    sprite: _Mono/Objects/Weapons/Guns/Rifles/xlr556_inhands_32x.rsi
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -16
  - type: Gun
    fireRate: 6
    shotsPerBurst: 3
    angleIncrease: 1.5
    angleDecay: 9.5
    availableModes:
    - Burst
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/_Goobstation/Weapons/Guns/Gunshots/smartgun_shoot.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  parent: [BaseWeaponRifle, BaseCentcommContraband]
  id: WeaponRifleMR8C
  name: Hawk
  description: A semi-automatic marksman rifle with a fixed optic. It is slow to fire and steady at range, and the optic only helps while the rifle is held in both hands. Feeds from .30 rifle magazines.
  components:
  - type: GunCrosshair
    crosshair: TCross
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/xian.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - state: base-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/xian_inhands_32x.rsi
  - type: Item
    sprite: _Mono/Objects/Weapons/Guns/Rifles/xian_inhands_32x.rsi
  - type: Gun
    fireRate: 3
    projectileSpeed: 35
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: GunMovementSpread
    walk: 1
    run: 3.3
    sprint: 8.3
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
