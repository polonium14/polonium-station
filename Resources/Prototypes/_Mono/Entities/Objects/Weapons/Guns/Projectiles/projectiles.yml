- type: entity
  parent: BulletLaser
  id: HeavyPulse
  categories: [ HideSpawnMenu ]
  name: heavy pulse bolt
  components:
  - type: ProjectileTracer
    color: "#33E6FF"
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: heavystun
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectBlueDisabler
    damage:
      types:
        Heat: 60
        Structural: 400

- type: entity
  parent: BasicHitscan
  id: BasiliskRifleBeam
  categories: [ HideSpawnMenu ]
  name: hard radiation beam
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 15
        Radiation: 30
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_xray
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: xray
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_xray

- type: entity
  parent: BasicHitscan
  id: PlasmaLanceBeam
  categories: [ HideSpawnMenu ]
  name: plasma lance beam
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 50
        Radiation: 25
        Structural: 200
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_blue
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_blue
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_blue
