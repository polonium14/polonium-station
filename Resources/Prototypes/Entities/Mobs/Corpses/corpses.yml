# Polonium: chirurgical port of https://github.com/space-wizards/space-station-14/pull/43534
# CENTCOMM
- type: entity
  parent: SalvageHumanCorpse
  id: MobCorpseCentcommOfficial
  suffix: Dead, CentComm Official
  components:
  - type: Loadout
    prototypes: [ CorpseCentcommOfficialGear ]
  - type: EntityTableContainerFill
    containers:
      outerClothing: !type:EntSelector
        id: ClothingOuterArmorCentcommCarapace
        prob: 0.2
      pocket2: !type:EntSelector
        id: WeaponPistolN1984
        prob: 0.2

