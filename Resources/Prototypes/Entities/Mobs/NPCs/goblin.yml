- type: entity
  name: goblin
  id: MobBaseGoblin
  parent: MobBaseAncestor
  description: Śmierdzące, chytre, przestępcze. Ich sama egzystencja jest zbrodnią.
  abstract: true
  components:
  - type: NameIdentifier
    group: Goblin
  - type: LizardAccent
  - type: ReplacementAccent
    accent: kobold
  - type: Inventory
    templateId: digitigrade
    speciesId: harpy
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: ['Hiss', 'Scream']
  - type: Vocal
    emoteSounds: MaleReptilian
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: TypingIndicator
    proto: lizard
  - type: InteractionPopup
    successChance: 0.4
    interactSuccessString: petting-success-monkey
    interactFailureString: petting-failure-monkey
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/lizard_happy.ogg
    interactFailureSound:
      path: /Audio/Items/wirecutter.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Critical
      125: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: Hands
    startingHands:
      hand_left:
        location: Left
      hand_right:
        location: Right
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 7
  - type: Puller
    needsHands: True
  - type: PassiveDamage # Slight passive regen.
    intervalHaltOnDamageTaken: 5s
    allowedStates:
    - Alive
    damage:
      types:
        Poison: -0.5
  - type: InitialBody
    organs:
      Torso: OrganGoblinTorso
      Head: OrganGoblinHead
      ArmLeft: OrganGoblinArmLeft
      ArmRight: OrganGoblinArmRight
      HandRight: OrganGoblinHandRight
      HandLeft: OrganGoblinHandLeft
      LegLeft: OrganGoblinLegLeft
      LegRight: OrganGoblinLegRight
      FootLeft: OrganGoblinFootLeft
      FootRight: OrganGoblinFootRight
      Brain: OrganGoblinBrain
      Eyes: OrganGoblinEyes
      Tongue: OrganGoblinTongue
      Appendix: OrganGoblinAppendix
      Ears: OrganGoblinEars
      Lungs: OrganGoblinLungs
      Heart: OrganGoblinHeart
      Stomach: OrganGoblinStomach
      Liver: OrganGoblinLiver
      Kidneys: OrganGoblinKidneys
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: Mobs/Animals/kobold.rsi
      state: kobold
    - map: [ "outline" ]
      sprite: Mobs/Animals/kobold.rsi
      state: outline
    - map: [ "enum.GoblinoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "ears" ]
    - map: [ "id" ]
    - map: [ "mask" ]
    - map: [ "head" ]
  - type: RandomSprite
    getAllGroups: true
    available:
      - enum.DamageStateVisualLayers.Base:
          kobold: KoboldColors
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 2
  - type: Tag # Polonium: mark clumsy for the toy-gun self-execution whitelist
    tags:
    - Clumsy
    - GoblinCraft
  - type: AlwaysRevolutionaryConvertible
  - type: GhostTakeoverAvailable
  - type: GhostRole
    prob: 1
    makeSentient: true
    name: ghost-role-information-goblin-name
    description: ghost-role-information-goblin-description
    rules: ghost-role-information-freeagent-rules

- type: entity
  parent: OrganBaseOrganic
