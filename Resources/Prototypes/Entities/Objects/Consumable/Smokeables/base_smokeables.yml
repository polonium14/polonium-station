- type: entity
  description: "If you want to get cancer, might as well do it in style."
  id: BaseSmokable
  parent: [SolutionSmokable, SolutionTiny, BaseItem]
  abstract: true
  components:
  - type: Reactive
    groups:
      Extinguish: [ Touch ]
  - type: ExtinguishableSetCollisionWake
  - type: Smokable
  - type: Sprite
  - type: Appearance
  - type: BurnStateVisuals
    unlitIcon: unlit-icon # Polonium: every smokable sprite names it so; the default "icon" broke relighting after going out
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
  - type: StaticPrice
    price: 5
  - type: InjectableSolution
    solution: smokable
  - type: SmokableExplosive # Polonium: plasma or welding fuel in it blows up when lit (tg rigged cigarettes)
  - type: GuideHelp # Polonium: our smoking page
    guides:
    - Smoking
  - type: ActionGrant # Polonium: blow smoke while it is in the mouth
    actions:
    - ActionBlowSmoke
  - type: ItemActionGrant
    activeIfWorn: true
  - type: PointLight # Polonium: the ember glows faintly while it burns
    enabled: false
    radius: 1.1 # smallest possible, like a lighter
    energy: 0.2
    color: "#ff8a3d"

# Base for all cigars and cigarettes.
- type: entity
  parent: BaseSmokable
  id: BaseCigar
  abstract: true
  components:
  - type: Smokable
    exposeTemperature: 1173.15
  - type: Cigar
  # Polonium: dipped in a beaker, it soaks the liquid up (tg)
  - type: RefillableSolution
    solution: smokable
  - type: SolutionTransfer
    canSend: false
  # Polonium end
  - type: Tag
    tags:
    - Trash
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nicotine
        Quantity: 10

- type: entity
  parent: BaseSmokable
  id: BaseSmokingPipe
  abstract: true
  components:
  - type: Smokable
    exposeTemperature: 1173.15
  - type: ContainerContainer
    containers:
      bowl_slot: !type:ContainerSlot
  - type: ItemSlots
  - type: SmokingPipe
    bowl_slot:
      name: smoking-pipe-slot-component-slot-name-bowl
      whitelist:
        tags:
          - Smokable
      insertSound:
        path: /Audio/Weapons/Guns/Empty/empty.ogg
      ejectSound:
        path: /Audio/Weapons/Guns/Empty/empty.ogg

- type: entity
  parent: [SolutionSmokable, SolutionTiny, BaseItem]
  id: BaseVape
  abstract: true
  components:
  - type: Vape
    damage:
      types:
        Heat: 2
  - type: RefillableSolution
    solution: smokable
  - type: ExaminableSolution
    solution: smokable
