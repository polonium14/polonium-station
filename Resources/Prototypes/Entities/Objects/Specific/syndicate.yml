- type: entity
  name: telecrystal
  parent: [BaseItem, BaseSyndicateContraband]
  id: Telecrystal
  # Goobstation - Telecrystal rework # Polonium revert
  suffix: 100 TC
  description: It seems to be pulsing with suspiciously enticing energies.
  components:
  - type: Sprite
    sprite: Objects/Specific/Syndicate/telecrystal.rsi
    state: telecrystal
  - type: Item
    sprite: Objects/Specific/Syndicate/telecrystal.rsi
    size: Tiny
  - type: Stack
    count: 100
    stackType: Telecrystal
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 1000
  - type: Currency
    price:
      Telecrystal: 1

- type: entity
  parent: Telecrystal
  id: Telecrystal1
  suffix: 1 TC
