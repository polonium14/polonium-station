- type: entity
  parent: BaseBullet
  id: BulletMagnum
  categories: [ HideSpawnMenu ]
  name: bullet (.45 magnum)
  components:
  - type: ProjectileTracer # Polonium: bullet tracers
    width: 0.06
  - type: PointLight # Polonium: bullets light their path
    color: "#FFBB32"
    radius: 1.8
    energy: 1
    castShadows: false
  - type: Projectile
    damage:
      types:
        Piercing: 35

