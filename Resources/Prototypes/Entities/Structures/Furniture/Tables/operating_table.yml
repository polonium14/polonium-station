- type: entity
  id: OperatingTable
  parent: Bed
  name: operating table
  description: Special medical table for surgery. Speeds up surgical steps performed on a patient buckled to it.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
    noRot: true
  - type: Icon
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
  - type: AmbientMusicMarkerMedical
  - type: OperatingTable
    speedModifier: 1.25
  - type: DeviceLinkSink
    ports:
      - BodyScannerReceiver
