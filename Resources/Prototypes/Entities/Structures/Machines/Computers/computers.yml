  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#b53ca1"
  - type: GuideHelp
    guides:
    - Science

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerAnalysisConsole
  name: analysis console
