- type: entity
  parent: BaseComputerAiAccess
  id: ComputerAlert
  name: atmospheric alerts computer
  description: Used to access the station's atmospheric automated alert system.
  components:
  - type: Computer
    board: AlertsComputerCircuitboard
  - type: ComputerVisuals
    stateScreen: alert-0
    stateKeys: atmos_key
  - type: GenericVisualizer
    visuals:
      enum.AtmosAlertsComputerVisuals.ComputerLayerScreen:
        enum.ComputerVisualLayers.Screen:
          0: { state: alert-0 }
          1: { state: alert-0 }
          2: { state: alert-1 }
          3: { state: alert-2 }
          4: { state: alert-2 }
  - type: AtmosAlertsComputer
  - type: ActivatableUI
    singleUser: true
    key: enum.AtmosAlertsComputerUiKey.Key
  - type: UserInterface
    interfaces:
        enum.AtmosAlertsComputerUiKey.Key:
            type: AtmosAlertsComputerBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: GuideHelp
    guides:
    - AtmosphericAlertsComputer
    - DeviceMonitoringAndControl
  - type: AmbientMusicMarkerEngineering

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerAtmosMonitoring
  name: atmospheric network monitor
  description: Used to monitor the station's atmospheric networks.
  components:
  - type: Computer
    board: AtmosMonitoringComputerCircuitboard
  - type: ComputerVisuals
    stateScreen: tank
    stateKeys: atmos_key
  - type: AtmosMonitoringConsole
    navMapTileColor: "#1a1a1a"
    navMapWallColor: "#404040"
  - type: ActivatableUI
    singleUser: true
    key: enum.AtmosMonitoringConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.AtmosMonitoringConsoleUiKey.Key:
        type: AtmosMonitoringConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: GuideHelp
    guides:
    - AtmosphericNetworkMonitor
    - DeviceMonitoringAndControl

- type: entity
  parent: BaseComputer
  id: ComputerEmergencyShuttle
  name: emergency shuttle console
  description: Handles authorization to early launch the shuttle.
  components:
  - type: AccessReader
    access:
    - [ Command ]
  - type: EmergencyShuttleConsole
  - type: ActivatableUI
    key: enum.EmergencyConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.EmergencyConsoleUiKey.Key:
          type: EmergencyConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#43ccb5"

- type: entity
  parent: BaseComputer
  id: BaseComputerShuttle
  name: shuttle console
  description: Used to pilot a shuttle.
  abstract: true
  components:
  - type: ShuttleConsole
  - type: ActivatableUI
    key: enum.ShuttleConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.ShuttleConsoleUiKey.Key:
          type: ShuttleConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: RadarConsole
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#43ccb5"
  - type: ItemSlots
    slots:
      disk_slot:
        name: Disk
        insertSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        ejectSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        whitelist:
          components:
          - ShuttleDestinationCoordinates
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
      disk_slot: !type:ContainerSlot {}
  - type: GuideHelp
    guides:
    - ShuttleCraft

- type: entity
  parent: BaseComputerShuttle
  id: ComputerShuttle
  name: shuttle console
  description: Used to pilot a shuttle.
  components:
  - type: ComputerVisuals
    stateScreen: shuttle
  - type: Computer
    board: ShuttleConsoleCircuitboard

- type: entity
  parent: BaseComputerShuttle
  id: ComputerShuttleSyndie
  name: syndicate shuttle console
  description: Used to pilot a syndicate shuttle.
  components:
  - type: ComputerVisuals
    stateScreen: syndishuttle
    stateKeys: syndie_key
  - type: Tag
    tags:
      - Syndicate
  - type: RadarConsole
    maxRange: 384
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#c94242"
  - type: Computer
    board: SyndicateShuttleConsoleCircuitboard

- type: entity
  parent: BaseComputerShuttle
  id: ComputerShuttleCargo
  name: cargo shuttle console
  description: Used to pilot the cargo shuttle.
  components:
  - type: ComputerVisuals
    stateScreen: shuttle
  - type: DroneConsole
    components:
      - type: CargoShuttle
  - type: RadarConsole
    maxRange: 256
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#43ccb5"
  - type: Computer
    board: CargoShuttleConsoleCircuitboard
  - type: StealTarget
    stealGroup:
    - CargoShuttleConsoleCircuitboard

- type: entity
  parent: BaseComputerShuttle
  id: ComputerShuttleSalvage
  name: salvage shuttle console
  description: Used to pilot the salvage shuttle.
  components:
  - type: ComputerVisuals # Polonium: computer sprite states moved to ComputerVisuals by upstream #44256
    stateScreen: shuttle
    stateKeys: generic_keys
  - type: DroneConsole
    components:
    - type: SalvageShuttle
  - type: RadarConsole
    maxRange: 256
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#43ccb5"
  - type: Computer
    board: SalvageShuttleConsoleCircuitboard
  - type: StealTarget
    stealGroup:
    - SalvageShuttleConsoleCircuitboard


- type: entity
  parent: BaseComputerAiAccess
  id: ComputerIFF
  name: IFF computer
  description: Allows you to control the IFF characteristics of this vessel.
  components:
  - type: IFFConsole
  - type: ComputerVisuals
    stateScreen: helm
  - type: ActivatableUI
    key: enum.IFFConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.IFFConsoleUiKey.Key:
          type: IFFConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: Computer
    board: ComputerIFFCircuitboard

- type: entity
  parent: ComputerIFF
  id: ComputerIFFSyndicate
  name: IFF computer
  suffix: Syndicate
  description: Allows you to control the IFF and stealth characteristics of this vessel.
  components:
  - type: IFFConsole
    allowedFlags:
      - Hide
      - HideLabel
    hideOnInit: true
  - type: ActivatableUI
    key: enum.IFFConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.IFFConsoleUiKey.Key:
          type: IFFConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: Computer
    board: ComputerIFFSyndicateCircuitboard

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerPowerMonitoring
  name: power monitoring computer
  description: It monitors power levels across the station.
  components:
  - type: ComputerVisuals
    stateScreen: power_monitor
    stateKeys: power_key
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#c9c042"
  - type: Computer
    board: PowerComputerCircuitboard
  - type: PowerMonitoringConsole
  - type: PowerMonitoringCableNetworks
  - type: NodeContainer
    examinable: true
    nodes:
      hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: ActivatableUI
    singleUser: true
    key: enum.PowerMonitoringConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PowerMonitoringConsoleUiKey.Key:
        type: PowerMonitoringConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: AmbientMusicMarkerEngineering

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerMedicalRecords
  name: medical records computer
  description: This can be used to check medical records.
  components:
  - type: ComputerVisuals
    stateScreen: medcomp
    stateKeys: med_key
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#1f8c28"
  - type: Computer
    board: MedicalRecordsComputerCircuitboard
  - type: AmbientMusicMarkerMedical

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerCriminalRecords
  name: criminal records computer
  description: This can be used to check criminal records. Only security can modify them.
  components:
  - type: CriminalRecordsConsole
  - type: UserInterface
    interfaces:
      enum.CriminalRecordsConsoleKey.Key:
        type: CriminalRecordsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.CriminalRecordsConsoleKey.Key
  - type: ComputerVisuals
    stateScreen: explosive
    stateKeys: security_key
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#1f8c28"
  - type: Computer
    board: CriminalRecordsComputerCircuitboard
  - type: AccessReader
    access: [["Security"]]
  - type: GuideHelp
    guides:
    - CriminalRecords

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerStationRecords
  name: station records computer
  description: This can be used to check station records.
  components:
  - type: GeneralStationRecordConsole
  - type: UserInterface
    interfaces:
        enum.GeneralStationRecordConsoleKey.Key:
          type: GeneralStationRecordConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.GeneralStationRecordConsoleKey.Key
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#1f8c28"
  - type: Computer
    board: StationRecordsComputerCircuitboard
  - type: GuideHelp
    guides:
    - Forensics

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerCrewMonitoring
  name: crew monitoring console
  description: Used to monitor active health sensors built into most of the crew's uniforms.
  components:
  - type: ComputerVisuals
    stateScreen: crew
    stateKeys: med_key
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#006400"
  - type: Computer
    board: CrewMonitoringComputerCircuitboard
  - type: ActivatableUI
    key: enum.CrewMonitoringUIKey.Key
  - type: UserInterface
    interfaces:
        enum.CrewMonitoringUIKey.Key:
          type: CrewMonitoringBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: CrewMonitoringConsole
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
    prefix: device-address-prefix-crew-monitor
  - type: WirelessNetwork
    range: 1200
  - type: AmbientMusicMarkerMedical

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerStationTeleportersControl
  name: station teleporters control console
  description: Used to monitor station teleport system operations.
  components:
  - type: ComputerVisuals
    stateScreen: teleporters_station
    stateKeys: telesci_key
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3493c2"
  - type: Computer
    board: StationTeleportersControlCircuitboard
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUI
    key: enum.StationTeleporterConsoleUIKey.Key
  - type: UserInterface
    interfaces:
      enum.StationTeleporterConsoleUIKey.Key:
        type: StationTeleporterConsoleBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: StationTeleporterConsole
    portalColor: "#81ddeb"
  - type: Storage
    grid:
    - 0,0,4,2
    maxItemSize: Small
    openOnActivate: false
    storageOpenSound: /Audio/Machines/door_lock_off.ogg
    storageCloseSound: /Audio/Machines/door_lock_on.ogg
    storageInsertSound: /Audio/Machines/id_insert.ogg
    storageRemoveSound: /Audio/Machines/id_swipe.ogg
    whitelist:
      tags:
      - FitInTeleporterConsole
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      board: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: AccessReader
    access: [["Command"]]
  - type: Lock
    unlockOnClick: false
  - type: EmptyOnMachineDeconstruct
    containers:
    - storagebase


- type: entity
  parent: ComputerStationTeleportersControl
  id: ComputerStationTeleportersControlFilled
  suffix: Autofilled, Nanotrasen Network
  components:
  - type: StationTeleporterConsole
    autoLinkKey: Nanotrasen

- type: entity
  parent: ComputerStationTeleportersControl
  id: ComputerSyndicateTeleportersControl
  name: syndicate teleporters control console
  components:
  - type: ComputerVisuals
    stateScreen: teleporters_syndicate
    stateKeys: syndie_key
  - type: PointLight
    color: "#c61414"
  - type: Computer
    board: SyndicateTeleportersControlCircuitboard
  - type: AccessReader
    access: [["SyndicateAgent"]]
  - type: StationTeleporterConsole
    portalColor: "#c61414"

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerResearchAndDevelopment
