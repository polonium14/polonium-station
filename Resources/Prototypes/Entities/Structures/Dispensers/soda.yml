- type: entity
  parent: ReagentDispenserBase
  id: SodaDispenserEmpty
  name: soda dispenser
  description: A beverage dispenser with a selection of soda and several other common beverages. Has a single fill slot for containers.
  suffix: Empty
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    drawdepth: SmallObjects
    state: soda
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - DrinkBottle
  - type: Transform
    noRot: false
  - type: Machine
    board: SodaDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
  # Polonium: the dispenser drawn as the steel bar device of its sprite
  - type: UserInterface
    interfaces:
      enum.ReagentDispenserUiKey.Key:
        type: BarDispenserBoundUserInterface
  - type: BarDispenserSkin
    skin: Steel
  - type: ReagentDispenser
    beakerSlot:
      whitelist:
        components:
        - FitsInDispenser
      priority: 9
      insertSound:
        collection: BarDispenserVesselIn
        params:
          variation: 0.05
      ejectSound:
        collection: BarDispenserVesselOut
        params:
          variation: 0.05
  # Polonium end

- type: entity
  parent: SodaDispenserEmpty
  id: SodaDispenser
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: DrinkCoconutWaterJug
        - id: DrinkCoffeeJug
        - id: DrinkColaBottleFull
        - id: DrinkCreamCartonXL
        - id: DrinkDrGibbJug
        - id: DrinkEnergyDrinkJug
        - id: DrinkGreenTeaJug
        - id: DrinkGrenadineBottleFull
        - id: DrinkIceJug
        - id: DrinkJuiceLemonJug
        - id: DrinkJuiceLimeCartonXL
        - id: DrinkJuiceOrangeCartonXL
        - id: DrinkJuicePineappleJug
        - id: DrinkJuiceTomatoJug
        - id: DrinkLemonLimeJug
        - id: DrinkMilkJug
        - id: DrinkRootBeerJug
        - id: DrinkSodaWaterBottleFull
        - id: DrinkSolDryJug
        - id: DrinkSpaceMountainWindBottleFull
        - id: DrinkSpaceUpBottleFull
        - id: DrinkSugarJug
        - id: DrinkTeaJug
        - id: DrinkTonicWaterBottleFull
        - id: DrinkWaterMelonJuiceJug
        - id: DrinkDrGibbBottleFull
