- type: entity
  id: BoozeDispenserEmpty
  name: booze dispenser
  suffix: Empty
  description: A booze dispenser with a single slot for a container to be filled.
  parent: ReagentDispenserBase
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    drawdepth: SmallObjects
    state: booze
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - DrinkBottle
  - type: Transform
    noRot: false
  - type: Machine
    board: BoozeDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
  - type: StealTarget
    stealGroup:
    - BoozeDispenser
  # Polonium: the dispenser drawn as the wooden bar device of its sprite
  - type: UserInterface
    interfaces:
      enum.ReagentDispenserUiKey.Key:
        type: BarDispenserBoundUserInterface
  - type: BarDispenserSkin
    skin: Wood
  - type: ReagentDispenser
    beakerSlot:
      whitelist:
        components:
        - FitsInDispenser
      priority: 9
      insertSound:
        collection: BarDispenserVesselIn
        params:
          variation: 0.05
      ejectSound:
        collection: BarDispenserVesselOut
        params:
          variation: 0.05
  # Polonium end

- type: entity
  id: BoozeDispenser
  suffix: Filled
  parent: BoozeDispenserEmpty
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: DrinkAbsintheBottleFull
        - id: DrinkAleBottleFullGrowler
        - id: DrinkBeerGrowler
        - id: DrinkBlueCuracaoBottleFull
        - id: DrinkChampagneBottleFull
        - id: DrinkCoffeeLiqueurBottleFull
        - id: DrinkCognacBottleFull
        - id: DrinkGinBottleFull
        - id: DrinkMeadJug
        - id: DrinkMelonLiquorBottleFull
        - id: DrinkRumBottleFull
        - id: DrinkTequilaBottleFull
        - id: DrinkVermouthBottleFull
        - id: DrinkVodkaBottleFull
        - id: DrinkWhiskeyBottleFull
        - id: DrinkWineBottleFull
