- type: markingsGroup
  id: None
  onlyGroupWhitelisted: true

- type: markingsGroup
  id: Undergarments
  limits:
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: false
      nudityDefault: [ UndergarmentTopTanktop ]
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: false
      nudityDefault: [ UndergarmentBottomBoxers ]

- type: entity
  id: OrganBase
  name: organ
  abstract: true
  parent: BaseItem
  components:
  - type: Organ
  - type: Appearance

- type: entity
  id: OrganBaseOrganic
  name: organ
  abstract: true
  parent: [ OrganBase, SolutionFood, SolutionTiny ]
  components:
  - type: FlavorProfile
    flavors:
    - chicken # INTRODUCING OUR NEW EVERY-MEAT BURRITO, IT'S GOT EVERY MEAT!
  - type: Edible
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
  - type: Tag # I am nearing my limit of tolerance for TagComponent.
    tags:
    - Raw
    - Meat

- type: entity
  parent: OrganBase
  id: OrganBaseTorso
  name: torso
  abstract: true
  components:
  - type: Organ
    category: Torso
  - type: Sprite
    state: torso
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Chest
    data:
      state: torso
  - type: WoundableVisuals
    thresholds: [ 10, 20, 30, 50, 70, 100 ]
    occupiedLayer: Chest
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#FF0000"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
    bleedingOverlay: _Shitmed/Mobs/Effects/bleeding_damage.rsi
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

