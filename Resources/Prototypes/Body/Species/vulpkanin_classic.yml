- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceVulpkaninClassic
  categories: [ HideSpawnMenu ]
  name: vulpkanin (classic) appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganVulpkaninClassicTorso
      Head: OrganVulpkaninClassicHead
      ArmLeft: OrganVulpkaninClassicArmLeft
      ArmRight: OrganVulpkaninClassicArmRight
      HandRight: OrganVulpkaninClassicHandRight
      HandLeft: OrganVulpkaninClassicHandLeft
      LegLeft: OrganVulpkaninClassicLegLeft
      LegRight: OrganVulpkaninClassicLegRight
      FootLeft: OrganVulpkaninClassicFootLeft
      FootRight: OrganVulpkaninClassicFootRight
      Brain: OrganVulpkaninClassicBrain
      Eyes: OrganVulpkaninClassicEyes
      Tongue: OrganVulpkaninClassicTongue
      Appendix: OrganVulpkaninClassicAppendix
      Ears: OrganVulpkaninClassicEars
      Lungs: OrganVulpkaninClassicLungs
      Heart: OrganVulpkaninClassicHeart
      Stomach: OrganVulpkaninClassicStomach
      Liver: OrganVulpkaninClassicLiver
      Kidneys: OrganVulpkaninClassicKidneys
  - type: HumanoidProfile
    species: VulpkaninClassic
  - type: Inventory
    speciesId: vulpkanin

- type: entity
  parent:
  - AppearanceVulpkaninClassic
  - BaseSpeciesMobOrganic
  id: MobVulpkaninClassic
  name: Urist McArfArf
  suffix: classic # shares its name with MobVulpkanin on purpose; disambiguate the spawn menu
  components:
  - type: MessyDrinker
    spillChance: 0.33
  - type: Speech
    speechSounds: Vulpkanin
    speechVerb: Vulpkanin
    allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Howl', 'Growl', 'Yap', 'Gekker' ]
  - type: TypingIndicator
    proto: vulpkanin
  - type: Vocal
    emoteSounds: MaleVulpkanin
  - type: Damageable
    damageModifierSet: Vulpkanin
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 2
        Slash: 3
  - type: Temperature
    specificHeat: 44
  - type: TemperatureDamage
    heatDamageThreshold: 320
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 0.05 # Per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 2.5 # Per second, scales with temperature & other constants
  - type: Wagging
    action: ActionToggleWaggingVulpkanin
  - type: TemperatureProtection
    heatingCoefficient: 1.2
    coolingCoefficient: 0.3
  - type: JumpAbility
    action: ActionVulpkaninGravityJump
    canCollide: true
    jumpDistance: 3
    jumpSound:
      path: /Audio/Weapons/punchmiss.ogg
      params:
        pitch: 1.33
        volume: -5
        variation: 0.05
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: SulfurBlood
        Quantity: 600
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_vulpkanin
  - type: TailDuoEmote # Funky Change

- type: entity
  parent: OrganBaseOrganic
  id: OrganVulpkaninClassic
  abstract: true
  suffix: vulpkanin classic

- type: entity
  id: OrganVulpkaninClassicMetabolizer
