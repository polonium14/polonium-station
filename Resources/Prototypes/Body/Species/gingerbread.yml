- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceGingerbread
  categories: [ HideSpawnMenu ]
  name: gingerbread appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganGingerbreadTorso
      Head: OrganGingerbreadHead
      ArmLeft: OrganGingerbreadArmLeft
      ArmRight: OrganGingerbreadArmRight
      HandRight: OrganGingerbreadHandRight
      HandLeft: OrganGingerbreadHandLeft
      LegLeft: OrganGingerbreadLegLeft
      LegRight: OrganGingerbreadLegRight
      FootLeft: OrganGingerbreadFootLeft
      FootRight: OrganGingerbreadFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Gingerbread

- type: entity
  parent:
  - AppearanceGingerbread
  - BaseSpeciesMobOrganic
  id: MobGingerbread
  name: Urist McCookie
  components:
  - type: Butcherable
    spawned:
    - id: FoodBakedCookie
      amount: 5
  - type: Damageable
    damageModifierSet: Gingerbread
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sugar
        Quantity: 200
      - ReagentId: Butter
        Quantity: 400
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100 #fairly light
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: TypingIndicator
    proto: gingerbread

- type: entity
  parent: OrganBaseOrganic
  id: OrganGingerbread
  abstract: true
  suffix: gingerbread

- type: entity
  parent: OrganGingerbread
  id: OrganGingerbreadExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Gingerbread/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Gingerbread/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: None


