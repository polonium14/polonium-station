# Felinids are humans with cat ears and a tail, so they reuse the human body sprites
# and only differ in their marking group, damage/temperature stats and cat abilities.

- type: markingsGroup
  parent: Undergarments
  id: Felinid
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      weight: 1
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ FelinidEarsBasic ]
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ FelinidTailBasic ]
    enum.HumanoidVisualLayers.Head:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFelinid
  categories: [ HideSpawnMenu ]
  name: felinid appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganFelinidTorso
      Head: OrganFelinidHead
      ArmLeft: OrganFelinidArmLeft
      ArmRight: OrganFelinidArmRight
      HandRight: OrganFelinidHandRight
      HandLeft: OrganFelinidHandLeft
      LegLeft: OrganFelinidLegLeft
      LegRight: OrganFelinidLegRight
      FootLeft: OrganFelinidFootLeft
      FootRight: OrganFelinidFootRight
      Brain: OrganFelinidBrain
      Eyes: OrganFelinidEyes
      Tongue: OrganFelinidTongue
      Appendix: OrganFelinidAppendix
      Ears: OrganFelinidEars
      Lungs: OrganFelinidLungs
      Heart: OrganFelinidHeart
      Stomach: OrganFelinidStomach
      Liver: OrganFelinidLiver
      Kidneys: OrganFelinidKidneys
  - type: HumanoidProfile
    species: Felinid

- type: entity
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: MobFelinid
  name: Urist McFelinid
  components:
  - type: Fixtures
    fixtures: # felinids are smaller and lighter than humans
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.28
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Felinid
  - type: Speech
    speechSounds: Alto
    speechVerb: Felinid
    allowedEmotes: [ 'Meow', 'Mew', 'Purr', 'Hiss', 'Growl' ]
  - type: Vocal
    wilhelm: "/Audio/Voice/Felinid/cat_wilhelm.ogg"
    emoteSounds: MaleFelinid
  - type: TypingIndicator
    proto: felinid
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  # felinids are hairless cats, so they take more cold damage
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 285
    coldDamage:
      types:
        Cold: 0.5 # per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 1.5 # per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      301: 0.8
      295: 0.6
      285: 0.4
  # cats get thirsty
  - type: Thirst
    baseDecayRate: 0.12
  - type: DamageOnHighSpeedImpact # landing on all fours
    damage:
      types:
        Blunt: 1
  - type: Stamina # felinids take 3 disabler shots to down
    baseCritThreshold: 75
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [ Touch, Ingestion ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:Emote
        emote: Scream
        probability: 0.2
  - type: Felinid

