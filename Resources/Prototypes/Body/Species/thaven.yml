- type: markingsGroup
  parent: Undergarments
  id: Thaven
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ ThavenEars1 ]
    enum.HumanoidVisualLayers.Head:
      limit: 5
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 5
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceThaven
  categories: [ HideSpawnMenu ]
  name: thaven appearance
  components:
  - type: Sprite
    scale: 1, 1.05
  - type: InitialBody
    organs:
      Torso: OrganThavenTorso
      Head: OrganThavenHead
      ArmLeft: OrganThavenArmLeft
      ArmRight: OrganThavenArmRight
      HandRight: OrganThavenHandRight
      HandLeft: OrganThavenHandLeft
      LegLeft: OrganThavenLegLeft
      LegRight: OrganThavenLegRight
      FootLeft: OrganThavenFootLeft
      FootRight: OrganThavenFootRight
      Brain: OrganThavenBrain
      Eyes: OrganThavenEyes
      Tongue: OrganThavenTongue
      Appendix: OrganThavenAppendix
      Ears: OrganThavenEars
      Lungs: OrganThavenLungs
      Heart: OrganThavenHeart
      Stomach: OrganThavenStomach
      Liver: OrganThavenLiver
      Kidneys: OrganThavenKidneys
  - type: HumanoidProfile
    species: Thaven
  - type: Inventory
    templateId: human
    speciesId: thaven
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Thaven/displacement.rsi
            state: jumpsuit
      head:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Thaven/displacement.rsi
            state: head
      outerClothing:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Thaven/displacement.rsi
            state: outerclothing_hardsuit
      gloves:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Thaven/displacement.rsi
            state: hands

- type: entity
  parent:
  - AppearanceThaven
  - BaseSpeciesMobOrganic
  id: MobThaven
  name: Urist McEars
  components:
  - type: ThavenMoodsBound
  - type: Damageable
    damageModifierSet: Thaven
  - type: MeleeWeapon
    attackRate: 0.55
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 0
  - type: StaminaDamageOnHit
    damage: 18
  - type: Butcherable
    spawned:
    - id: FoodThavenMeat
      amount: 5
  - type: TypingIndicator
    proto: thaven
  - type: Speech
    speechSounds: Alto
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: ShimmeringBlood
        Quantity: 600
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_thaven
  - type: UserInterface
    interfaces:
      enum.ThavenMoodsUiKey.Key:
        type: ThavenMoodsBoundUserInterface
        requireInputValidation: false

- type: entity
