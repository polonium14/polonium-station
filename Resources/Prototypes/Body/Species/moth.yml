- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMoth
  categories: [ HideSpawnMenu ]
  name: moth appearance
  components:
  - type: Inventory
    speciesId: moth
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: jumpsuit-female
      back:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: back
      outerClothing:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: outerclothing
      gloves:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: hand
      shoes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: jumpsuit-male
      back:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: back
      outerClothing:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: outerclothing
      gloves:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: hand
      shoes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Moth/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganMothTorso
      Head: OrganMothHead
      ArmLeft: OrganMothArmLeft
      ArmRight: OrganMothArmRight
      HandRight: OrganMothHandRight
      HandLeft: OrganMothHandLeft
      LegLeft: OrganMothLegLeft
      LegRight: OrganMothLegRight
      FootLeft: OrganMothFootLeft
      FootRight: OrganMothFootRight
      Brain: OrganMothBrain
      Eyes: OrganMothEyes
      Tongue: OrganMothTongue
      Appendix: OrganMothAppendix
      Ears: OrganMothEars
      Lungs: OrganMothLungs
      Heart: OrganMothHeart
      Stomach: OrganMothStomach
      Liver: OrganMothLiver
      Kidneys: OrganMothKidneys
  - type: HumanoidProfile
    species: Moth

- type: entity
  parent:
  - AppearanceMoth
  - BaseSpeciesMobOrganic
  id: MobMoth
  name: Urist McFluff
  components:
  - type: Damageable
    damageModifierSet: Moth
  - type: ZombieAccentOverride
    accent: zombieMoth
  - type: Speech
    speechVerb: Moth
    allowedEmotes: ['Chitter', 'Squeak', 'Flap']
  - type: TypingIndicator
    proto: moth
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_moth
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 600
  - type: MothAccent
  - type: Vocal
    emoteSounds: UnisexMoth
  - type: BodyEmotes
    soundsId: MothBodyEmotes
  - type: MovementSpeedModifier
    baseWeightlessAcceleration: 1.5 # Move around more easily in space.
    baseWeightlessFriction: 1
    baseWeightlessModifier: 1
  - type: Flammable
    damage:
      types:
        Heat: 2.5 # moths burn more easily
  - type: TemperatureDamage # Moths hate the heat and thrive in the cold.
    heatDamageThreshold: 314.15
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 0.05 # per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 3 # per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      289: 0.9
      275: 0.8
      250: 0.7

