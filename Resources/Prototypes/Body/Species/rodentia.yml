- type: markingsGroup
  parent: Undergarments
  id: Rodentia
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      weight: 1
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ RodentiaHeadTopEarDefault ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ RodentiaTailDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 3 # Funkystation 3 from 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceRodentia
  categories: [ HideSpawnMenu ]
  name: rodentia appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganRodentiaTorso
      Head: OrganRodentiaHead
      ArmLeft: OrganRodentiaArmLeft
      ArmRight: OrganRodentiaArmRight
      HandRight: OrganRodentiaHandRight
      HandLeft: OrganRodentiaHandLeft
      LegLeft: OrganRodentiaLegLeft
      LegRight: OrganRodentiaLegRight
      FootLeft: OrganRodentiaFootLeft
      FootRight: OrganRodentiaFootRight
      Brain: OrganRodentiaBrain
      Eyes: OrganRodentiaEyes
      Tongue: OrganRodentiaTongue
      Appendix: OrganRodentiaAppendix
      Ears: OrganRodentiaEars
      Lungs: OrganRodentiaLungs
      Heart: OrganRodentiaHeart
      Stomach: OrganRodentiaStomach
      Liver: OrganRodentiaLiver
      Kidneys: OrganRodentiaKidneys
  - type: HumanoidProfile
    species: Rodentia
  - type: Inventory
    speciesId: rodentia

- type: entity
  parent: AppearanceRodentia
  id: MobRodentiaDummy
  categories: [ HideSpawnMenu ]

# Polonium: upstream replaced HungerComponent with the Satiation system; port the
# fork's "33% faster hunger" as a child satiation prototype (base rate is -0.01666).
- type: satiation
  parent: NormalSatiationHunger
  id: RodentiaHunger
  baseChangeRate: -0.02216 # 33% faster than usual

- type: entity
  parent:
  - AppearanceRodentia
  - BaseSpeciesMobOrganic
  id: MobRodentia
  name: Urist McRat
  components:
  - type: Fixtures
    fixtures: # rodentia are small
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.28
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Icon
    sprite: Mobs/Species/Rodentia/parts.rsi
    state: full
  - type: Satiation
    satiations:
      Hunger:
        prototype: RodentiaHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: Damageable
    damageModifierSet: Rodentia
  - type: Speech
    speechVerb: Rodentia
    speechSounds: Squeak
    allowedEmotes: [ 'Squeak' ]
  - type: Vocal
    emoteSounds: MaleRodentia
  - type: TypingIndicator
    proto: rodentia
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 2
        Slash: 3
  - type: Butcherable
    spawned:
    - id: FoodMeatRat
      amount: 5
  - type: Rummager
  - type: MouthStorage # cheek pouches
    mouthProto: CheekStorage
    openStorageAction: ActionOpenMouthStorage
    spitDamageThreshold: 3

- type: entity
  parent: OrganBaseOrganic
  id: OrganRodentia
  abstract: true
  suffix: rodentia

- type: entity
  id: OrganRodentiaMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal, Rat ] # Polonium:ammonia is respiration, garlic is digestion, both need their type on the organ that actually runs it

