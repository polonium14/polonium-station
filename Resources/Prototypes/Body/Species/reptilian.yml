      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ LizardTailSmooth ]
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ LizardSnoutRound ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceReptilian
  categories: [ HideSpawnMenu ]
  name: reptilian appearance
  components:
  - type: Inventory
    speciesId: reptilian
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
      head:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: mask
    displacements:
      head:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: mask
  - type: InitialBody
    organs:
      Torso: OrganReptilianTorso
      Head: OrganReptilianHead
      ArmLeft: OrganReptilianArmLeft
      ArmRight: OrganReptilianArmRight
      HandRight: OrganReptilianHandRight
      HandLeft: OrganReptilianHandLeft
      LegLeft: OrganReptilianLegLeft
      LegRight: OrganReptilianLegRight
      FootLeft: OrganReptilianFootLeft
      FootRight: OrganReptilianFootRight
      Brain: OrganReptilianBrain
      Eyes: OrganReptilianEyes
      Tongue: OrganReptilianTongue
      Appendix: OrganReptilianAppendix
      Ears: OrganReptilianEars
      Lungs: OrganReptilianLungs
      Heart: OrganReptilianHeart
      Stomach: OrganReptilianStomach
      Liver: OrganReptilianLiver
      Kidneys: OrganReptilianKidneys
  - type: HumanoidProfile
    species: Reptilian

- type: entity
  parent:
  - AppearanceReptilian
  - BaseSpeciesMobOrganic
  id: MobReptilian
  name: Urist McScales
  components:
  - type: Puller
    needsHands: false
  - type: Butcherable
    spawned:
    - id: FoodMeatLizard
      amount: 5
  - type: LizardAccent
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: ['Thump']
  - type: TypingIndicator
    proto: lizard
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_lizard
  - type: Vocal
    emoteSounds: MaleReptilian
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: Damageable
    damageModifierSet: Scale
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 400
    coldDamageThreshold: 285
    coldDamage:
      types:
        Cold : 0.1 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat : 1.5 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      301: 0.9
      295: 0.8
      285: 0.7
  - type: Wagging
  - type: TailDuoEmote # Funky Change

