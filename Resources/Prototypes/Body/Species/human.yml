- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHuman
  categories: [ HideSpawnMenu ]
  name: human appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganHumanTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      LungLeft: OrganHumanLungLeft # Polonium: paired lungs and kidneys
      LungRight: OrganHumanLungRight
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      KidneyLeft: OrganHumanKidneyLeft # Polonium: paired lungs and kidneys
      KidneyRight: OrganHumanKidneyRight
      Spleen: OrganSpleen # Polonium: spleen keeps the blood topped up
  - type: HumanoidProfile
    species: Human

- type: entity
  parent: AppearanceHuman
  id: MobHumanDummy
  categories: [ HideSpawnMenu ]

- type: entity
  parent:
  - AppearanceHuman
  - BaseSpeciesMobOrganic
  id: MobHuman
  name: Urist McHands
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5

- type: entity
  parent: OrganBaseOrganic
  id: OrganHuman
  abstract: true
  suffix: human

- type: entity
  id: OrganHumanMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Human ]

- type: entity
  parent: OrganHuman
  id: OrganHumanInternal
