# Wings live on the right arm layer. Note they are NOT hideable: no clothing in this repo
# declares HideLayerClothing for RArm, and HideablePrototypeValidation enforces that an organ
# may only mark a layer hideable if some clothing actually hides it. Upstream handled wing
# hiding with HarpyVisualsSystem, which has no counterpart here.
- type: entity
  parent: [ OrganBaseArmRight, OrganHarpyExternal ]
  id: OrganHarpyArmRight
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Nerve
  - type: Woundable
    integrityCap: 80
    thresholds:
      Healthy: 80
      Minor: 70
      Moderate: 60
      Severe: 40
      Critical: 20
      Mangled: 5
      Severed: -10

