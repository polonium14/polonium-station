# Harpy markings render on layers that do not match their old marking categories:
# ears sit on Head, wings on RArm, talons on LLeg/RFoot. The group limits below are keyed
# on the layer each marking actually declares as its bodyPart.

- type: markingsGroup
  parent: Undergarments
  id: Harpy
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      weight: 1
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: true
      default: [ HarpyEarsDefault ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ HarpyTailPhoenix ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: true
      default: [ HarpyChestDefault ]
    # Wings. Harpies always have a pair.
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: true
      default: [ HarpyWingDefaultHuescale ]
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHarpy
  categories: [ HideSpawnMenu ]
  name: harpy appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganHarpyTorso
      Head: OrganHarpyHead
      ArmLeft: OrganHarpyArmLeft
      ArmRight: OrganHarpyArmRight
      HandRight: OrganHarpyHandRight
      HandLeft: OrganHarpyHandLeft
      LegLeft: OrganHarpyLegLeft
      LegRight: OrganHarpyLegRight
      FootLeft: OrganHarpyFootLeft
      FootRight: OrganHarpyFootRight
      Brain: OrganHarpyBrain
      Eyes: OrganHarpyEyes
      Tongue: OrganHarpyTongue
      Appendix: OrganHarpyAppendix
      Ears: OrganHarpyEars
      Lungs: OrganHarpyLungs
      Heart: OrganHarpyHeart
      Stomach: OrganHarpyStomach
      Liver: OrganHarpyLiver
      Kidneys: OrganHarpyKidneys
  - type: HumanoidProfile
    species: Harpy
  - type: Inventory
    speciesId: harpy
    templateId: digitigrade # Einstein Engines

- type: entity
  parent:
  - AppearanceHarpy
  - BaseSpeciesMobOrganic
  id: MobHarpy
  name: Urist McHarpy
  components:
  - type: Fixtures
    fixtures: # harpies are light-boned
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.32
        density: 90
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Harpy
  - type: Speech
    speechSounds: Harpy
    speechVerb: Harpy
    # Harpies mimic station noises and other species, so they get a very wide emote set.
    allowedEmotes: [ 'Caw', 'Chirp', 'Hiss', 'Meow', 'Mew', 'Purr', 'Growl', 'Squeak',
                     'Ring', 'Pew', 'Bang', 'Rev', 'Chitter', 'Awoo',
                     'Snarl', 'Bark', 'Whine', 'Howl', 'Gekker', 'Yap' ]
  - type: Vocal
    emoteSounds: SoundsHarpyMale
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 5.0
    weightlessAcceleration: 2.5
  - type: HarpySinger
  - type: Instrument
    allowPercussion: false
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Voice": {52: 0}
      "Trumpet": {56: 0}
      "Electric": {27: 0}
      "Bass": {33: 0}
      "Rock": {29: 0}
      "Acoustic": {24: 0}
      "Flute": {73: 0}
      "Sax": {66: 0}
      "Piano": {1: 0}
      "Church Organ": {19: 0}
      "Violin": {41: 0}
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface

- type: entity
  parent: OrganBaseOrganic
  id: OrganHarpy
  abstract: true
  suffix: harpy

