  id: OrganHarpyMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal ]

- type: entity
  parent: OrganHarpy
  id: OrganHarpyInternal
  abstract: true
  components:
