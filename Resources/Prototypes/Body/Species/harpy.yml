  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Harpy/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Harpy

- type: entity
  parent: [ OrganHarpy, OrganHarpyVisual ]
  id: OrganHarpyExternal
  abstract: true
