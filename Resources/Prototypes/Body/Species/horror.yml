  parent: Undergarments
  id: Horror
  limits:
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHorror
  categories: [ HideSpawnMenu ]
  name: horror appearance
  components:
  - type: Inventory
    templateId: horror
  - type: InitialBody
    organs:
      Torso: OrganHorrorTorso
      Head: OrganHorrorHead
      ArmLeft: OrganHorrorArmLeft
      ArmRight: OrganHorrorArmRight
      HandRight: OrganHorrorHandRight
      HandLeft: OrganHorrorHandLeft
      LegLeft: OrganHorrorLegLeft
      LegRight: OrganHorrorLegRight
      FootLeft: OrganHorrorFootLeft
      FootRight: OrganHorrorFootRight
      Brain: OrganHorrorBrain
      Eyes: OrganHorrorEyes
      Tongue: OrganHorrorTongue
      Appendix: OrganHorrorAppendix
      Ears: OrganHorrorEars
      Lungs: OrganHorrorLungs
      Heart: OrganHorrorHeart
      Stomach: OrganHorrorStomach
      Liver: OrganHorrorLiver
      Kidneys: OrganHorrorKidneys

- type: entity
  parent:
  - AppearanceHorror
  - BaseSpeciesMobOrganicNoCrawl
  id: MobHorror
  name: shambling abomination # no more Urist McHorror
  description: Its gaping maw open, an ever-expanding, all consuming mass of flesh stands before you.
  components:
  - type: HumanoidProfile
    examinable: false
  # it speaks like a SPOOKY MONSTER!!!!
  - type: Speech
    speechVerb: Horror
  - type: PassiveDamage
    allowedStates: # it is hard to kill
    - Alive
    - Critical
    - Dead
    damage:
      types: # it regenerates very fast
        Heat: -0.05
        Blunt: -2
        Piercing: -2
        Slash: -2
  - type: MeleeWeapon # Same as ArmbladeHorror,
    soundHit:
      collection: AlienClaw
    wideAnimationRotation: 90
    attackRate: 1
    damage:
      types:
        Slash: 14
        Piercing: 14
        Caustic: 8
        Structural: 20
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepThud
  - type: SlowOnDamage
    speedModifierThresholds:
      140: 0.7
      175: 0.5
  - type: Damageable
    damageModifierSet: Horror
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 5.0 # faster than the speed at which they can break down walls
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Vocal
    emoteSounds: null # there should be a way to not make them scream but oh well
  - type: ChangelingHorror # marks them as a changeling horror
    spawnEffects:
    - !type:EvenHealthChange # why not
      damage:
        Burn: -50
        Toxin: -50
        Airloss: -50
        Brute: -50
        Genetic: -50
    - !type:ModifyBleed
        amount: -50 # bleeding is evil
    - !type:ModifyBloodLevel # reasonable blood restore
      amount: 150
    actions:
    - ActionChangelingScreech
  - type: PermanentStatusEffects
    statusEffects:
    - StatusEffectHorrorFormArmblades
  - type: ActionGrant # Not cloned, this is used for giving the ability to horror forms that were spawned in rather than transformed into.
    removeOnShutdown: true
    actions:
    - ActionChangelingScreech
  - type: Tag
    tags:
    - DoorBumpOpener
    - StunImmune
    - FootstepSound


