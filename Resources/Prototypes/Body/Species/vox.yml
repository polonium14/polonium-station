    speciesId: vox
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: jumpsuit
      eyes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: eyes
      gloves:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: hand
      head:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: head
      neck:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: neck
      back:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: ears
      shoes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: shoes
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: Mobs/Species/Vox/displacement.rsi
          state: hand_l
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: Mobs/Species/Vox/displacement.rsi
          state: hand_r
  - type: InitialBody
    organs:
      Torso: OrganVoxTorso
      Head: OrganVoxHead
      ArmLeft: OrganVoxArmLeft
      ArmRight: OrganVoxArmRight
      HandRight: OrganVoxHandRight
      HandLeft: OrganVoxHandLeft
      LegLeft: OrganVoxLegLeft
      LegRight: OrganVoxLegRight
      FootLeft: OrganVoxFootLeft
      FootRight: OrganVoxFootRight
      Brain: OrganVoxBrain
      Eyes: OrganVoxEyes
      Tongue: OrganVoxTongue
      Appendix: OrganVoxAppendix
      Ears: OrganVoxEars
      Lungs: OrganVoxLungs
      Heart: OrganVoxHeart
      Stomach: OrganVoxStomach
      Liver: OrganVoxLiver
      Kidneys: OrganVoxKidneys
  - type: HumanoidProfile
    species: Vox

- type: entity
  parent:
  - AppearanceVox
  - BaseSpeciesMobOrganic
  id: MobVox
  name: Urist McVox
  components:
  - type: Damageable
    damageModifierSet: Vox
  - type: Speech
    speechVerb: Vox
    speechSounds: Vox
    allowedEmotes: ['Click', 'Chitter', 'Coo']
  - type: TypingIndicator
    proto: vox
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_vox
  - type: Vocal
    emoteSounds: UnisexVox
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          FoodMeatChickenFriedVox:
            min: 3
            max: 5
      - !type:BurnBodyBehavior
        popupMessage: bodyburn-vox-text-others
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 40
      behaviors:
      - !type:VomitBehavior
  - type: PassiveDamage
    # Augment normal health regen to be able to tank some Poison damage
    # This allows Vox to take their mask off temporarily to eat something without needing a trip to medbay afterwards.
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.07
        Blunt: -0.05
        Piercing: -0.05
        Slash: -0.05
        Poison: -0.2 # needs to be less than the PendingZombieComponent does or they never become zombies by the disease.
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 600
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5 # Reduce?
  - type: Wagging
  - type: TailDuoEmote # Funky Change

