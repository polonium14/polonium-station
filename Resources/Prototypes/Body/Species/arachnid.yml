- type: markingsGroup
  parent: Undergarments
  id: Arachnid
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ ArachnidAppendagesDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ ArachnidCheliceraeDownwards ]
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceArachnid
  categories: [ HideSpawnMenu ]
  name: arachnid appearance
  components:
  - type: Inventory
    templateId: arachnid
    speciesId: arachnid
  - type: InitialBody
    organs:
      Torso: OrganArachnidTorso
      Head: OrganArachnidHead
      ArmLeft: OrganArachnidArmLeft
      ArmRight: OrganArachnidArmRight
      HandRight: OrganArachnidHandRight
      HandLeft: OrganArachnidHandLeft
      LegLeft: OrganArachnidLegLeft
      LegRight: OrganArachnidLegRight
      FootLeft: OrganArachnidFootLeft
      FootRight: OrganArachnidFootRight
      Brain: OrganArachnidBrain
      Eyes: OrganArachnidEyes
      Tongue: OrganArachnidTongue
      Appendix: OrganArachnidAppendix
      Ears: OrganArachnidEars
      Lungs: OrganArachnidLungs
      Heart: OrganArachnidHeart
      Stomach: OrganArachnidStomach
      Liver: OrganArachnidLiver
      Kidneys: OrganArachnidKidneys
  - type: HumanoidProfile
    species: Arachnid

- type: entity
  parent:
  - AppearanceArachnid
  - BaseSpeciesMobOrganic
  id: MobArachnid
  name: Urist McWebs
  components:
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.5 # This makes space and crit more lethal to arachnids.
    damageRecovery:
      types:
        Asphyxiation: -0.5
  - type: Sericulture
    productionLength: 2
    entityProduced: MaterialWebSilk1
    hungerCost: 4 # Should total to 25 total silk on full hunger
    minHungerThreshold: Peckish
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - SpiderCraft
    - AnomalyHost
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 5
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch]
      effects:
      - !type:SpawnEntityInInventory
        slot: head
        entity: WaterDropletHat
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CopperBlood
        Quantity: 600
  - type: MeleeWeapon
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 5
  - type: Speech
    speechVerb: Arachnid
    speechSounds: Arachnid
    allowedEmotes: ['Click', 'Chitter']
  - type: Vocal
    emoteSounds: UnisexArachnid
  - type: TypingIndicator
    proto: spider
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_arachnid

- type: entity
  parent: OrganBaseOrganic
  id: OrganArachnid
  abstract: true
  suffix: Arachnid

- type: entity
  id: OrganArachnidMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Arachnid, Animal ] # Polonium: raw meat is bloodstream now so heart needs Animal too

