- type: entity
  id: BaseMobAnimal
  abstract: true
  components:
  - type: Body
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganAnimalLungs
        - id: OrganAnimalHeart
        - id: OrganAnimalStomach
