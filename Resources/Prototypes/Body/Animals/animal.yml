- type: entity
  id: OrganAnimalMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal ]

- type: entity
  parent: OrganBaseOrganic
  id: OrganAnimal
  abstract: true
  suffix: Animal

- type: entity
  parent: OrganAnimal
  id: OrganAnimalInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: [ OrganBaseLungs, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganAnimalLungs
  components:
  - type: OrganIntegrity # Polonium: organ thresholds (healthy from 35% integrity, dead at 0), dead organ stays in the slot
    integrityCap: 34
    integrityThresholds:
      Normal: 11.9
      Damaged: 0.01
      Destroyed: 0
    deadOrgan: OrganDeadLungs

