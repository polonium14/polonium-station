  id: ActionVampireToggleFangs
  name: Włącz/wyłącz kły
  description: Wysuń lub schowaj kły, aby pić krew z ofiar.
  components:
    - type: Action
      useDelay: 2 # Toggle
      itemIconStyle: NoItem
      priority: 1
      icon:
        sprite: _Starlight/Vampire/actions_vampire.rsi
        state: fangs_retracted
      iconOn:
        sprite: _Starlight/Vampire/actions_vampire.rsi
        state: fangs_extended
    - type: InstantAction
      event: !type:VampireToggleFangsActionEvent {}
    - type: VampireAction
      bloodToUnlock: 0
      bloodCost: 0

