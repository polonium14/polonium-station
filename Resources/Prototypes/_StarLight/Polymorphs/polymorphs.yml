- type: polymorph
  id: VampireSanguinePoolPolymorph
  configuration:
    entity: MobVampireSanguinePool
    forced: true
    transferDamage: true
    transferName: true
    inventory: None
    revertOnCrit: true
    revertOnDeath: true
    effectProto: null
    polymorphSound: !type:SoundPathSpecifier
      path: /Audio/_Starlight/Effects/vampire/enter_blood.ogg
    exitPolymorphSound: !type:SoundPathSpecifier
      path: /Audio/_Starlight/Effects/vampire/exit_blood.ogg

