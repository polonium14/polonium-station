- type: entity
  id: XenoDoor
  name: resin door
  parent: BaseMaterialDoor
  description: Its a door? Idk, but its like a huge... Yes this is door.
  components:
  - type: Sprite
    sprite: _bm/test/base/rsi/Textures/Structures/xeno/xenodoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: true
    clickOpen: true
    canCrush: false
    canPry: false
    closeTimeOne: 0.4
    closeTimeTwo: 0.4
    openTimeOne: 0.4
    openTimeTwo: 0.4
    openSound:
      path: /Audio/Backmen/Effects/Xeno/alien_resin_move1.ogg
    closeSound:
      path: /Audio/Backmen/Effects/Xeno/alien_resin_move2.ogg
  - type: AccessReader
    access: [ [ "Xeno" ] ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: XenoSlimeModifier
  - type: IconSmooth
    key: xenowalls
    mode: NoSprite
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Temperature
    heatDamage:
      types:
        Heat: 5
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Flammable
    fireSpread: true #If you walk into incredibly dense, flaming vines, you can expect to burn.
    damage:
      types:
        Heat: 3

- type: damageModifierSet
  id: XenoSlimeModifier
  coefficients:
    Blunt: 0.2
    Slash: 2
    Piercing: 0.2
    Shock: 1

- type: entity
  id: XenoRCD
  parent: RCD
  name: xeno slime
  description: Using its secretions, it creates monstrous caves to protect its hive. Yes, exactly as you imagine.
  suffix: AutoRecharge
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/checker_pieces.rsi
    layers:
      - state: b_checker_piece
  - type: LimitedCharges
    maxCharges: 50
  - type: AutoRecharge
    rechargeDuration: 5
  - type: RCD
    availablePrototypes:
    - XenoWall
    - XenoDoor
    successSound: /Audio/Backmen/Effects/Xeno/alien_resin_build2.ogg

- type: rcd
  id: XenoDoor
  category: Airlocks
  sprite: /Textures/Interface/Radial/RCD/airlock.png
  mode: ConstructObject
  prototype: XenoDoor
  cost: 8
  delay: 3
  collisionMask: FullTileMask
  rotation: Camera
  fx: EffectRCDConstruct4

- type: rcd
  id: XenoWall
  category: WallsAndFlooring
  sprite: /Textures/Interface/Radial/RCD/solid_wall.png
  mode: ConstructObject
  prototype: XenoWall
  cost: 4
  delay: 1
  collisionMask: FullTileMask
  rotation: Fixed
  fx: EffectRCDConstruct2

# Polonium Start

- type: entity
  id: XenoRCDPlus
  parent: XenoRCD
  name: xeno slime
  description: Using its secretions, it creates monstrous caves to protect its hive. Yes, exactly as you imagine.
  suffix: AutoRecharge
  components:
  - type: RCD
    availablePrototypes:
    - XenoWall
    - XenoDoor
    - WeaponTurretXeno
    successSound: /Audio/Backmen/Effects/Xeno/alien_resin_build2.ogg

# Polonium End

- type: entity
  id: XenoEgg
  parent: BaseStructure
  name: xeno egg
  suffix: KsenosXeno
  description: Looks gross.
  save: false
  components:
  - type: ContainerContainer
  - type: ActionsContainer
  - type: Actions
  - type: Sprite
    sprite: _bm/test/base/rsi/Textures/Misc/Egg.rsi
    layers:
      - state: icon
    noRot: true
    netsync: false
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Slime
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 1350
        mask:
        - FullTileMask
        layer:
        - WallLayer
  #- type: PointLight
  #  enabled: true
  #  radius: 3
  #  softness: 5
  #  color: "#FF33FF"
  #  autoRot: true
  #- type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: false
    allowSpeech: false
    makeSentient: true
    name: Xeno Egg
    description: Looks gross.
    rules: "Grow into a proper hive defender."
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: KsenosXenoLarva


# LOCATOR #

- type: entity
  id: PinpointerXeno
  name: Xeno Egg Locator
  description: "Xenomorphs always know how to find the queen."
  parent: PinpointerBase
  components:
  - type: Pinpointer
    component: EggLayer
  - type: Transform
    noRot: True
  - type: Sprite
    netsync: false
    noRot: True
    sprite: Objects/Devices/pinpointer.rsi
    layers:
    - state: pinpointer
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      visible: false
  - type: Item
    inhandVisuals:
      left:
      - state: ""
      right:
      - state: ""
  - type: Appearance

# EVOLUTION #

- type: entity
  id: ActionToLarva
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    event: !type:PolymorphActionEvent

- type: polymorph
  id: EggToLarva
  configuration:
    entity: KsenosXenoLarva
    forced: true
    transferDamage: false
    revertOnCrit: false
    revertOnDeath: false
    allowRepeatedMorphs: true
