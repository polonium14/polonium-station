# Originally from TGMC

# BASE #

- type: entity
  abstract: true
  name: Xeno
  id: KsenosXenoBase
  parent: MobXeno
  description: A threat to any form of organic life
  suffix: KsenosXeno
  components:
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: LagCompensation
  - type: Input
    context: "human"
  - type: MovedByPressure
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Sprite
    drawdepth: Mobs
    sprite: _bm/Mobs/Aliens/Xenos/burrower.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
    noRot: true
    netsync: false
  - type: Clickable
  - type: InteractionOutline
  - type: SolutionContainerManager
  - type: AtmosExposed
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Critical
      300: Dead
  - type: Internals
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Xenolian
  - type: Body
    prototype: Animal
  - type: Actions
  - type: DoAfter
  - type: Polymorphable
  - type: Buckle
  - type: Insulated
  # - type: Hands
  #   showInHands: true
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 4
  - type: Stamina
    baseCritThreshold: 500
  - type: Appearance
  - type: Bloodstream
    bloodReagent: FluorosulfuricAcid
    bloodMaxVolume: 650
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 4
    color: "purple"
  - type: Puller
    needsHands: false
  - type: NoSlip
  - type: IgnoreSpiderWeb
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - Hivemind
  - type: IntrinsicRadioTransmitter
    channels:
    - Hivemind
  - type: LizardAccent
  - type: Speech
    speechSounds: Xeno
  - type: Eye
    drawFov: false
  - type: SolutionRegeneration
    solution: spray
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 10
  - type: Access
    tags:
    - Xeno
  # Polonium
  - type: Sprinter
    canSprint: false
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.25
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: TypingIndicator
    proto: alien
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatXeno
      amount: 2

- type: accessLevel
  id: Xeno
  name: Xeno

- type: damageModifierSet
  id: Xenolian
  coefficients:
    Blunt: 1.4
    Slash: 1.0
    Piercing: 1.8
    ArmorPiercing: 1.8
    Heat: 3.2
    Shock: 3.6
    Poison: 0.0
    Radiation: 0.0
    Asphyxiation: 0.0
    Bloodloss: 0.0
    Cellular: 0.0

- type: damageModifierSet
  id: XenolianStrong
  coefficients:
    Blunt: 1.0
    Slash: 0.6
    Piercing: 0.8
    ArmorPiercing: 1.4
    Heat: 3.6
    Shock: 3.2
    Poison: 0.0
    Radiation: 0.0
    Asphyxiation: 0.0
    Bloodloss: 0.0
    Cellular: 0.0

- type: nameIdentifierGroup
  id: Xeno
  format: name-identifier-format-xeno
  minValue: 333
  maxValue: 999

- type: speechSounds
  id: Xeno
  saySound:
    path: /Audio/Animals/cat_hiss.ogg
  askSound:
    path: /Audio/Animals/snake_hiss.ogg
  exclaimSound:
    path: /Audio/Animals/snake_hiss.ogg

# CLASSES #

# WORM #

- type: entity
  name: Heartbreaker
  id: KsenosXenoLarva
  description: Young xenomorph.
  parent: KsenosXenoBase
  components:
  - type: ActionGrant
    actions:
    - ActionViewLaws
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: larva
      sprite: _bm/test/base/rsi/Textures/Mob/xeno/worm.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      20: Dead
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: Heartbreaker
    description: Young xenomorph
    rules: "Evolve into a full-fledged xenomorph."
    raffle:
      settings: default
  - type: SlowOnDamage
    speedModifierThresholds:
      5: 0.8
  - type: NameIdentifier
    group: Xeno
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 6
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 10
  - type: Puller
    needsHands: true
  - type: Polymorphable
    innatePolymorphs: [ LarvaToDrone, LarvaToRunner, DroneToSpitter, RunnerToWarrior]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Speech
    speechSounds: Xeno
    allowedEmotes: ['Squeak']
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatXeno
      amount: 1
  - type: Bloodstream
    bloodReagent: FluorosulfuricAcid
    bloodMaxVolume: 200


# QUEEN #

- type: entity
  name: Queen
  parent: KsenosXenoBase
  id: KsenosXenoQueen
  description: Queen of the hive.
  components:
  - type: ActionGun
    action: ActionXenoHealingSpit
    gunProto: WeaponXenoHealingSpit
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: Queen
    description: Queen of the hive.
    rules: "Command the hive and protect your egg clutch. Abilities: Tail Swipe (left-click to stun, right-click to sweep), Sticky Roots, Xenomorphic Construction (G key), Healing Pheromones, Sweeping Strike (right-click)"
    raffle:
      settings: default
  - type: Body
  - type: InnateTool
    tools:
      - id: WeaponXenoQueenStun
      - id: WeaponXenoQueenClaw
      - id: XenoRCDPlus
      - id: WeaponXenoHealingSpit
      - id: PinpointerXeno
  - type: XenoAcidSpiller
  - type: SolutionContainerManager
    solutions:
      udder:
        maxVol: 250
        reagents:
        - ReagentId: SlermQueenPlus
          Quantity: 30
  - type: Udder
    reagentId: SlermQueenPlus
    quantityPerUpdate: 25
    growthDelay: 30
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1000
      behaviors:
      - !type:GibBehavior { }
  - type: Sprite
    drawdepth: Mobs
    sprite: _bm/test/base/rsi/Textures/Mob/xeno/queen.rsi
    offset: 0,0.4
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Dead
  - type: Stamina
    baseCritThreshold: 1500
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.8
    baseSprintSpeed : 4.5
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: XenolianStrong
  - type: SlowOnDamage
    speedModifierThresholds:
      500: 0.8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Spider
    webPrototype: XenoWeed
    webAction: XenoWeedsAction
    customActionSuccessLocMessage: xeno-web-action-success
    customActionFailLocMessage: xeno-web-action-fail
  - type: PointLight
    radius: 9
  - type: NameIdentifier
    group: Xeno
  - type: EggLayer
    hungerUsage: 0
    eggLayCooldownMin: 150
    eggLayCooldownMax: 150
    eggSpawn:
    - id: XenoEgg
    eggLayAction: XenoLayEgg
  - type: Speech
    speechSounds: Xeno
    allowedEmotes: ['Scream']
    speechVerb: LargeMob
  - type: Vocal
    sounds:
      Male: UnisexXeno2
      Female: UnisexXeno2
      Unsexed: UnisexXeno2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatXeno
      amount: 4
  - type: Bloodstream
    bloodReagent: FluorosulfuricAcid
    bloodMaxVolume: 800

- type: entity
  id: XenoLayEgg
  name: Lay a xenomorph egg
  description: Useful in any nest.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    event: !type:EggLayInstantActionEvent
    icon: { sprite: _bm/test/base/rsi/Textures/Misc/Egg.rsi, state: icon }
    useDelay: 150

