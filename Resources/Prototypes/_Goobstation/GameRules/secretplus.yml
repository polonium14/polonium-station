- type: entityTable
  id: SecretPlusTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: SpaceTrafficControlTable
    - !type:NestedSelector
      tableId: BasicGameRulesTable

- type: weightedRandom
  id: SecretPlus
  weights:
    ThiefSecretPlus: 0.10
    Traitor: 0.15
    Changeling: 0.08
    Nukeops: 0.05
    Revolutionary: 0.05
    Wizard: 0.025
    Xenoborgs: 0.05
    LoneNukeopsRoundStart: 0.03
    Zombie: 0.04

- type: weightedRandom
  id: SecretPlusPrimary
  weights:
    Traitor: 0.30
    Changeling: 0.10
    Nukeops: 0.08
    LoneNukeopsRoundStart: 0.05
    Revolutionary: 0.08
    Wizard: 0.05
    Xenoborgs: 0.08
    ThiefSecretPlus: 0.06

- type: weightedRandom
  id: SecretPlusChaos
  weights:
    ThiefSecretPlus: 0.10
    Traitor: 0.25
    Changeling: 0.10
    Nukeops: 0.08
    Revolutionary: 0.08
    Wizard: 0.05
    Xenoborgs: 0.08
    Zombie: 0.05
    LoneNukeopsRoundStart: 0.05

- type: weightedRandom
  id: SecretPlusPrimaryMid
  weights:
    Traitor: 0.30
    Changeling: 0.10
    Nukeops: 0.08
    LoneNukeopsRoundStart: 0.05
    Revolutionary: 0.08
    Wizard: 0.05
    Xenoborgs: 0.08

- type: weightedRandom
  id: SecretPlusPrimaryMidHigh
  weights:
    Traitor: 0.30
    Changeling: 0.10
    Nukeops: 0.08
    LoneNukeopsRoundStart: 0.05
    Revolutionary: 0.08
    Wizard: 0.05
    Xenoborgs: 0.08

- type: entityTable
  id: SecretPlusMidTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: SpaceTrafficControlTable
    - !type:NestedSelector
      tableId: BasicGameRulesTable
    - id: CowiekMaupaSpawn
    - id: GreytideVirusSecretPlus

- type: entityTable
  id: SecretPlusMidHighTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: SpaceTrafficControlTable
    - !type:NestedSelector
      tableId: BasicGameRulesTable
    - id: CowiekMaupaSpawn
    - id: GreytideVirusSecretPlus

- type: entityTable
  id: SecretPlusSurvivalTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: SpaceTrafficControlTable
    - !type:NestedSelector
      tableId: BasicGameRulesTable
    - id: ZombieOutbreakSurvivalPlus

- type: entity
  id: SecretPlusMid
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 22
    maxStartingChaos: 33
    livingChaosChange: -0.018
    deadChaosChange: 0.020
    chaosChangeVariationMin: 0.8
    chaosChangeVariationMax: 1.3
    eventIntervalMin: 90
    eventIntervalMax: 400
    disallowedEvents: [ FriendlySpawn ]
    primaryAntagsWeightTable: SecretPlusPrimaryMid
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusMidTable

- type: entity
  id: SecretPlusMidHigh
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 33
    maxStartingChaos: 44
    livingChaosChange: -0.028
    deadChaosChange: 0.030
    chaosChangeVariationMin: 0.8
    primaryAntagsWeightTable: SecretPlusPrimaryMidHigh
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusMidHighTable

- type: entity
  id: SecretPlusAdmeme
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 45
    maxStartingChaos: 60
    livingChaosChange: -0.03
    deadChaosChange: 0.03
    chaosExponent: 1
    eventIntervalMin: 60
    eventIntervalMax: 200
    primaryAntagsWeightTable: SecretPlusChaos
    ignoreIncompatible: true
    ignoreTimings: true

- type: entity
  id: SecretPlusLow
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 5
    maxStartingChaos: 10
    noRoundstartAntags: true
    livingChaosChange: -0.006
    deadChaosChange: 0.015
    chaosExponent: 1.2
    eventIntervalMin: 150
    eventIntervalMax: 480
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTable

- type: entity
  id: SecretPlusRampingMid
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 0
    maxStartingChaos: 0
    noRoundstartAntags: true
    speedRamping: 0.0003
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusSurvivalTable
