- type: emote
  id: Flip
  name: chat-emote-name-flip
  category: General
  icon: Interface/VerbIcons/flip.svg.192dpi.png
  blacklist:
    components:
      - PAI
  chatMessages: ["chat-emote-msg-flip"]
  chatTriggers:
  - flip
  - flips
  - does a flip
  - salto
  - robi salto
  - zrobił salto
  - zrobiła salto
  - fika koziołka
  event: !type:AnimationFlipEmoteEvent

