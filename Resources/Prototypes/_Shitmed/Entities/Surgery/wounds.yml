- type: entity
  id: WoundBase
  abstract: true
  components:
  - type: Wound
    damageType: Blunt
  - type: ContainerContainer
    containers:
      Traumas: !type:Container
        ents: [ ]

- type: entity
  id: WoundBlunt
  parent: WoundBase
  components:
  - type: Wound
    damageType: Blunt
    woundType: External
    woundVisibility: Always
    scarWound: BluntScar
    mangleSeverity: Severe

  - type: TraumaInflicter
    severityThreshold: 12
    allowedTraumas:
    - Dismemberment
    - OrganDamage
    - BoneDamage
    - VeinsDamage
    - NerveDamage
    allowArmourDeduction:
    - Dismemberment
    - OrganDamage
    - BoneDamage
    - VeinsDamage
    - NerveDamage
    traumasChances:
      Dismemberment: -2
      OrganDamage: 0.17
      BoneDamage: 0.8
      VeinsDamage: 0
      NerveDamage: 0
    mangledMultipliers:
      BoneDamage: 1
  - type: PainInflicter
    multiplier: 0.87

