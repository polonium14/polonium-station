- type: entity
  name: wonderprod
  parent: [BaseItem, BaseMajorContraband]
  id: Wonderprod
  description: Universal tool of the abductor agent.
  components:
  - type: GuideHelp
    guides:
    - Abductors
  - type: Item
    sprite: _Shitmed/Objects/Weapons/Melee/wonderprod.rsi
    heldPrefix: stun
    size: Large
    storedRotation: -90
    shape:
    - 0,0,2,2
  - type: Clothing
    sprite: _Shitmed/Objects/Weapons/Melee/wonderprod.rsi
    quickEquip: false
    equippedPrefix: stun
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: _Shitmed/Objects/Weapons/Melee/wonderprod.rsi
    layers:
    - state: stun-icon
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AbductorBatonVisuals.Mode:
        base:
          Stun: { state: stun-icon }
          Sleep: { state: sleep-icon }
          Cuff: { state: cuffs-icon }
          Mark: { state: damage-icon }
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.75
    damage:
      types:
        Shock: 0
    angle: 60
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/Guns/Hits/taser_hit.ogg
    soundNoDamage:
      path: /Audio/Weapons/Guns/Hits/taser_hit.ogg
  - type: DisarmMalus
  - type: AbductorBaton
    cuffs: AbductorCuffs
    modeSound:
      collection: sparks
      params:
        variation: 0.125
        volume: -5
