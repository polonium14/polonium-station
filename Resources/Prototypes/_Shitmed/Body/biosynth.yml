# Bio-synthetic organs and limbs produced by the medical biofabricator. They are ordinary human
# organs/limbs (their parents) - the "adapts to any recipient" line is flavour. Ported from
# polonium-old; limbs re-parented from the old LeftArmHuman-style ids to the current OrganHuman*
# limb-organs, and the old cosmetic Biosynthectic tags dropped (nothing reads them).

# Organs

- type: entity
  parent: OrganHumanHeart
  id: BioSynthHeart
  name: bio-synthetic heart
  description: This heart can be transplanted into any living organism and it will adapt to its recipient.

