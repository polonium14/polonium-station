- type: entity
  parent: BaseAction
  id: ActionXenoTailStab
  name: Tail Stab
  description: Stab a nearby target with your tail.
  components:
  - type: Action
    useDelay: 12
    itemIconStyle: BigAction
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: tail_attack
  - type: TargetAction
    range: 2.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:XenoTailStabActionEvent

