- type: entity
  parent: BaseAction
  id: ActionXenoTailStab
  name: Tail Stab
  description: Stab a nearby target with your tail.
  components:
  - type: Action
    useDelay: 12
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _RMC14/Actions/xeno_actions.rsi
    layers:
    - state: tail_attack
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 2.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:XenoTailStabActionEvent

