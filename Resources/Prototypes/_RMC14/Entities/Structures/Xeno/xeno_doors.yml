- type: entity
  parent: BaseStructure
  id: DoorXenoResin
  name: resin door
  description: A door made of resin.
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_door.rsi
    layers:
    - state: resin
      map: [ "enum.DoorVisualLayers.Base" ]
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Door
    canPry: false
    crushDamage:
      types:
        Blunt: 15
    openSpriteState: resinopen
    closedSpriteState: resin
    openingSpriteState: resinopening
    closingSpriteState: resinclosing
    openSound:
      path: /Audio/_RMC14/Xeno/alien_resin_move1.ogg
    closeSound:
      path: /Audio/_RMC14/Xeno/alien_resin_move2.ogg
  - type: Appearance
  - type: Airtight
    noAirWhenFullyAirBlocked: false
  - type: Occluder
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PlacementReplacement
    key: walls
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: XenoConstructionPlasmaCost
    plasma: 144
  - type: XenoStructureUpgradeable
    to: DoorXenoResinThick
    cost: 30
  - type: XenoConstruct
  - type: Corrodible
    isCorrodible: true
    structure: true
  - type: AllowWeedSpread
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: XenoResinBreak

- type: entity
  parent: DoorXenoResin
  id: DoorXenoResinThick
  name: thick resin door
  description: A thick resin door.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_door.rsi
    layers:
    - state: thick_resin
      map: [ "enum.DoorVisualLayers.Base" ]
  - type: Door
    canPry: false
    crushDamage:
      types:
        Blunt: 15
    openSpriteState: thick_resinopen
    closedSpriteState: thick_resin
    openingSpriteState: thick_resinopening
    closingSpriteState: thick_resinclosing
    openSound:
      path: /Audio/_RMC14/Xeno/alien_resin_move1.ogg
    closeSound:
      path: /Audio/_RMC14/Xeno/alien_resin_move2.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: XenoConstructionPlasmaCost
    plasma: 174
