- type: entity
  parent: WeaponTurretXeno
  id: XenoAcidTurret
  name: xeno acid turret
  description: A living turret that spits acid at hostiles.
  suffix: Constructible
  components:
  - type: Transform
    anchored: true
  - type: XenoConstruct
  - type: XenoConstructionPlasmaCost
    plasma: 500
  - type: HiveMember
  - type: XenoFriendly
  - type: AllowWeedSpread
  - type: Corrodible
    isCorrodible: true
    structure: true
  - type: Injurable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:SpawnEntitiesBehavior
        spawn:
          FoodMeatXeno:
            min: 3
            max: 5
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: XenoResinBreak
