- type: alertLevel
  id: Green
  name: alert-level-green
  announcement: alert-level-green-announcement
  instructions: alert-level-green-instructions
  sound: /Audio/_Polonium/Announcements/AlertLevels/green.ogg # Polonium: custom announcement sound
  color: Green
  emergencyLightColor: LawnGreen
  shuttleTime: 600

