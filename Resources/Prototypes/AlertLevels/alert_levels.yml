- type: alertLevels
  id: stationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      sound: /Audio/_Polonium/Announcements/AlertLevels/green.ogg
      color: Green
      emergencyLightColor: LawnGreen
      shuttleTime: 600
    blue:
      announcement: alert-level-blue-announcement
      sound: /Audio/_Polonium/Announcements/AlertLevels/blue.ogg
      color: DodgerBlue
      forceEnableEmergencyLights: true
      emergencyLightColor: DodgerBlue
      shuttleTime: 600
    violet:
      announcement: alert-level-violet-announcement
      sound: /Audio/Misc/notice1.ogg
      color: Violet
      emergencyLightColor: Violet
      forceEnableEmergencyLights: true
      shuttleTime: 600
    yellow:
      announcement: alert-level-yellow-announcement
      sound: /Audio/Misc/notice1.ogg
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
    red:
      announcement: alert-level-red-announcement
      sound: /Audio/_Polonium/Announcements/AlertLevels/red.ogg
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
      shuttleTime: 600 #No reduction in time as we don't have swiping for red alert like in /tg/. Shuttle times are intended to create friction, so having a way to brainlessly bypass that would be dumb.
    gamma:
      announcement: alert-level-gamma-announcement
      selectable: false
      sound:
        path: /Audio/_Polonium/Announcements/siren.ogg
        params:
          volume: -2
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
    delta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound: /Audio/_Polonium/Announcements/AlertLevels/delta.ogg
      disableSelection: true
      color: DarkRed
      emergencyLightColor: Orange
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    epsilon:
      announcement: alert-level-epsilon-announcement
      selectable: false
      sound: /Audio/_Polonium/Announcements/epsilon.ogg
      disableSelection: true
      color: DarkViolet
      emergencyLightColor: DarkViolet
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    amber:
      announcement: alert-level-amber-announcement
      selectable: false
      sound:
        path: /Audio/_Impstation/Misc/amber.ogg
        params:
          volume: -1
      disableSelection: true
      color: DarkGoldenrod
      emergencyLightColor: DarkGoldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    octarine:
      announcement: alert-level-octarine-announcement
      selectable: false
      sound: /Audio/_Polonium/Announcements/AlertLevels/octarine.ogg
      disableSelection: true
      color: CadetBlue
      emergencyLightColor: CadetBlue
      forceEnableEmergencyLights: true
      shuttleTime: 600
    cyan:
      announcement: alert-level-cyan-announcement
      sound:
        path: /Audio/_Polonium/Announcements/AlertLevels/cyan.ogg
        params:
          volume: 2
      color: Cyan
      emergencyLightColor: Cyan
      forceEnableEmergencyLights: true
      shuttleTime: 600
