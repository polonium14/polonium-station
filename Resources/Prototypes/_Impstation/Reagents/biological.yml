- type: reagent
  parent: Blood
  id: DinoBlood
  name: reagent-name-dino-blood
  group: Biological
  desc: reagent-desc-dino-blood
  flavor: protein
  color: "#DC143C"
  recognizable: true
  physicalDesc: reagent-physical-desc-viscous
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 1.5
      - !type:ModifyBloodLevel
        amount: 1
      - !type:HealthChange
        damage:
          types:
            Heat: -1
            Caustic: -1
            Asphyxiation: -1
            Blunt: -1
      - !type:ModifyBleed
        amount: -1

- type: reagent
  id: ShimmeringBlood
  name: reagent-name-shimmering-blood
  group: Biological
  desc: reagent-desc-shimmering-blood
  flavor: shimmeringblood
  color: "#ff624a"
  recognizable: true
  physicalDesc: reagent-physical-desc-shimmering-blood
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateHunger
        factor: 1
      - !type:SatiateThirst
        factor: 1
      - !type:GenericStatusEffect
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Thaven ]
          inverted: true
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 5
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 2
  - !type:PlantAdjustWeeds
    amount: -2
  - !type:PlantAdjustPests
    amount: -2
  footstepSound:
    collection: FootstepBlood
    params:
      volume: 6
