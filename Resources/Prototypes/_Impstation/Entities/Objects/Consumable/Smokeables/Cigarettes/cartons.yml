- type: entity
  id: CigCartonMixedRejects
  parent: [CigCartonGreen, BaseSyndicateContraband]
  name: Dan's soaked smokes rejects carton
  description: A carton containing 6 packets of Dan's Soaked Smokes Rejects
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Smokeables/Cartons/mixedrejectscarton.rsi
    state: closed
    layers:
    - state: closed
      map: ["closeLayer"]
    - state: open
      map: ["openLayer"]
      visible: false
  - type: Item
    sprite: _Impstation/Objects/Consumable/Smokeables/Cartons/mixedrejectscarton.rsi
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CigPackMixedRejects
        amount: 6
  - type: Storage
    grid:
    - 0,0,5,1
    - 6,1,6,1
