# these are HEAVILY based on the Bingle free-agent ghostrole from GoobStation, but reflavored and reprogrammed to make them more Robust (and less of a meme.)
# all credit for the core gameplay concepts and a lot of the core functionality of the code goes to the folks over at Goob, but I re-wrote enough of it to justify putting it in our filestructure.
# the original Bingle PR can be found here: https://github.com/Goob-Station/Goob-Station/pull/1519
- type: entity
  id: ReplicatorNest
  name: replicator nest
  description: A roiling mass of nanotechnology is eating through the station's infrastructure.
  categories: [ HideSpawnMenu ] # don't want admins spawning unlinked nests
  placement:
    mode: SnapGridCenter
  components:
  - type: ReplicatorNest
    blacklist:
      tags:
      - Cartridge
      - CartridgeMagnum
      - Trash
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.4
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - WallLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Sprite
    drawdepth: FloorTiles
    sprite: _Impstation/Mobs/Replicator/replicator_nest.rsi
    layers:
    - map: ["enum.ReplicatorNestVisuals.Level1"]
      state: nest1
    - map: ["enum.ReplicatorNestVisuals.Level2"]
      state: nest2
      visible: false
    - map: ["enum.ReplicatorNestVisuals.Level3"]
      state: nest3
      visible: false
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageModifierSet: ReplicatorNest
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg # TODO: Probably replace this.
  - type: RequireProjectileTarget
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 1000
  - type: Drain # remove liquids around pit
    unitsPerSecond: 10
    unitsDestroyedPerSecond: 10
  - type: PassiveDamage #passive Healing
    damage:
      types:
        Heat: -1
        Shock: -1
        Structural: -1
        Blunt: -1
        Slash: -1
        Piercing: -1
  - type: AntiRottingContainer
  # POLONIUM
  - type: ReplicatorHive
    rebuilds:
    - tier: 1
      name: replicator-rebuild-tier1
      icon: { sprite: _Impstation/Mobs/Replicator/replicator.rsi, state: icon }
    - tier: 2
      cost: 400
      minNestLevel: 2
      name: replicator-rebuild-tier2
      icon: /Textures/_Impstation/Interface/Actions/replicator_level2.png
    - tier: 3
      cost: 800
      minNestLevel: 3
      name: replicator-rebuild-tier3
      icon: /Textures/_Impstation/Interface/Actions/replicator_level3.png
  - type: MaterialStorage
    materialWhiteList:
    - Replisteel
    canEjectStoredMaterials: false
    ignoreColor: true
  - type: Lathe
    staticPacks:
    - ReplicatorNest
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
    requiresComplex: false
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
