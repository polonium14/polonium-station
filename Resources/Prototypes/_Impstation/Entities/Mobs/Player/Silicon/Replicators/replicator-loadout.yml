- type: entity
  id: ReplicatorStunRay
  parent: BaseItem
  name: replicator stun ray
  description: Neutralize target to enable termination and consumption.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/practice_disabler.rsi
    state: base
  - type: Item
    size: Small
  - type: Gun
    soundGunshot: /Audio/_Impstation/Weapons/Guns/Gunshots/stunprojector.ogg
    soundEmpty: null
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 3
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 3
    rechargeSound: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletDisabler
    capacity: 1
    count: 1
  - type: Unremoveable

- type: startingGear
  id: StartingGearReplicatorTools
  inhand:
    - OmnitoolUnremoveable
    - WelderExperimentalUnremoveable

- type: startingGear
  id: StartingGearReplicatorWeapon
  inhand:
    - ReplicatorT3Weapon

- type: entity
  id: ReplicatorT3Weapon
  parent: BaseItem
  name: replicator arm
  description: You are a weapon.
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - Pickaxe
  - type: Sprite
    sprite: _Impstation/Mobs/Replicator/replicator.rsi
    state: t3weapon
  - type: MeleeWeapon
    attackRate: 0.7
    wideAnimationRotation: 180
    soundHit: 
      path: "/Audio/Effects/metal_slam4.ogg"
    animation: WeaponArcSlash
    damage:
      types:
        Blunt: 25
        Structural: 30
  - type: StaminaDamageOnHit
    damage: 5
  - type: Unremoveable
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1
    useSound:
      path: /Audio/Items/crowbar.ogg
