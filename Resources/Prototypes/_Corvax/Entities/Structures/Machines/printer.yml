- type: entity
  parent: BaseLathe
  id: PrinterDoc
  name: document printer
  description: Bureaucratic perfection. Stores the database of all Nanotrasen documents. For rapid pre-filling of documents with your personal details, use the ID card slot. Printing is available provided paper is supplied.
  components:
  - type: Sprite
    sprite: Corvax/Structures/Machines/printer.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: idle
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Transform
    noRot: false
  - type: Machine
    board: PrinterDocMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/scanning.ogg
    idleState: icon
    runningState: building
    staticRecipes:
    - PrintedDocumentReportStationRecipe
    - PrintedDocumentErtRequestRecipe
    - PrintedDocumentResignationRecipe
    - PrintedDocumentJobChangeRequestRecipe
    - PrintedDocumentAccessExtensionRecipe
    - PrintedDocumentIdCardRequestRecipe
    - PrintedDocumentRemovalOrderRecipe
    - PrintedDocumentInterimHeadRequestRecipe
    - PrintedDocumentComplaintRecipe
    - PrintedDocumentInterimCaptainRequestRecipe
    - PrintedDocumentHeadsCouncilProtocolRecipe
    - PrintedDocumentDepartmentActivityReportRecipe
    - PrintedDocumentOrderCompletionReportRecipe
    - PrintedDocumentPositionCreationRequestRecipe
    - PrintedDocumentEmployeeCommendationRequestRecipe
    - PrintedDocumentStationEmploymentRequestRecipe
    - PrintedDocumentAccessRevocationOrderRecipe
    - PrintedDocumentCommandDecreeRecipe
    - PrintedDocumentStationGoalProgressReportRecipe
    - PrintedDocumentRestrictedEquipmentPermitRecipe
    - PrintedDocumentInterrogationProtocolRecipe
    - PrintedDocumentSearchWarrantRecipe
    - PrintedDocumentExecutionOrderRecipe
    - PrintedDocumentInvestigationReportRecipe
    - PrintedDocumentWitnessTestimonyRecipe
    - PrintedDocumentArrestRequestRecipe
    - PrintedDocumentDetainedPersonsRegisterRecipe
    - PrintedDocumentRoomSearchProtocolRecipe
    - PrintedDocumentAssetSeizureOrderRecipe
    - PrintedDocumentPatrolReportRecipe
    - PrintedDocumentDisciplinarySentenceRecipe
    - PrintedDocumentArrestExtensionRequestRecipe
    - PrintedDocumentDeathCertificateRecipe
    - PrintedDocumentMedicationOrderRecipe
    - PrintedDocumentPrescriptionRecipe
    - PrintedDocumentEuthanasiaRequestRecipe
    - PrintedDocumentHealthCertificateRecipe
    - PrintedDocumentEpidemiologyReportRecipe
    - PrintedDocumentDrugSynthesisRequestRecipe
    - PrintedDocumentPatientMedicalCardRecipe
    - PrintedDocumentPsychologicalInterventionProtocolRecipe
    - PrintedDocumentQuarantineCertificateRecipe
    - PrintedDocumentCargoOrderRecipe
    - PrintedDocumentDisposalReportRecipe
    - PrintedDocumentDeliveryReceiptRecipe
    - PrintedDocumentFundsRequestRecipe
    - PrintedDocumentWarehouseReportRecipe
    - PrintedDocumentConstructionPermitRecipe
    - PrintedDocumentRenovationRequestRecipe
    - PrintedDocumentTechnicalWorkReportRecipe
    - PrintedDocumentPowerStatusReportRecipe
    - PrintedDocumentAtmosStatusReportRecipe
    - PrintedDocumentDemolitionPermitRecipe
    - PrintedDocumentSentienceCertificateRecipe
    - PrintedDocumentExperimentReportRecipe
    - PrintedDocumentObjectStudyReportRecipe
    - PrintedDocumentModernizationRequestRecipe
    - PrintedDocumentProductManufacturingOrderRecipe
    - PrintedDocumentAnomalyStudyReportRecipe
    - PrintedDocumentSpecialistTrainingRequestRecipe
    - PrintedDocumentObjectClassificationProtocolRecipe
    - PrintedDocumentServiceObjectStudyReportRecipe
    - PrintedDocumentServiceProductOrderRecipe
    - PrintedDocumentServiceOrderRecipe
    - PrintedDocumentEventOrganizationRequestRecipe
    - PrintedDocumentCateringStatusReportRecipe
    - PrintedDocumentRoomReservationRecipe
    - PrintedDocumentCentcomUniversalRecipe
    - PrintedDocumentCentcomStaffOrderRecipe
    - PrintedDocumentCentcomStaffResponseRecipe
    - PrintedDocumentCentcomPeriodicReportsOrderRecipe
    - PrintedDocumentIaVerificationRequestRecipe
    - PrintedDocumentIaDocumentationRequestRecipe
    - PrintedDocumentIaDepartmentAuditReportRecipe
    - PrintedDocumentIaInterrogationProtocolRecipe
    - PrintedDocumentSyndicateCooperationOfferRecipe
    - PrintedDocumentSyndicateInfoExchangeProposalRecipe
    - PrintedDocumentSyndicateSummonsRecipe
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 25
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: MaterialStorage
    whitelist:
      tags:
      - Document
    storage:
      PrinterPaper: 0
  - type: DocumentPrinter
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      blueprint: !type:Container
      id: !type:ContainerSlot
  - type: ItemSlots
    slots:
      id:
        name: IdSlot
        whitelist:
          components:
          - IdCard
