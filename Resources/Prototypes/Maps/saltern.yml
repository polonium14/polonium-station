- type: gameMap
  id: Saltern
  mapName: 'Saltern'
  mapPath: /Maps/_Polonium/saltern.yml
  minPlayers: 0
  maxPlayers: 35
  fallback: true
  stations:
    Saltern:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Saltern {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            #central command
            StationAi: [ 1, 1 ]
            NanotrasenRepresentative: [ 1, 1 ] # Polonium
#            InternalAffairsAgent: [ 2, 2 ]
#            Magistrate: [ 1, 1 ]
            #command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 2 ]
            Chef: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            #engineering
            StationEngineer: [ 6, 6 ]
            TechnicalAssistant: [ 4, 4 ] #intern, not counted
            #medical
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 3 ]
            MedicalIntern: [ 4, 4 ] #intern, not counted
            Paramedic: [ 1, 1 ]
            #science
            Scientist: [ 3, 3 ]
            Roboticist: [ 1, 1 ]
            ResearchAssistant: [ 2, 2 ] #intern, not counted
            Borg: [ 2, 2 ]
            #security
            Warden: [ 1, 1 ]
            Detective: [ 1, 1 ]
            Brigmedic: [1, 1]
            SecurityOfficer: [ 4, 4 ]
            SecurityCadet: [ 4, 4 ] #intern, not counted
            #supply
            SalvageSpecialist: [ 1, 3 ]
            CargoTechnician: [ 2, 2 ]
            #civilian
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Reporter: [ 1,1 ]

