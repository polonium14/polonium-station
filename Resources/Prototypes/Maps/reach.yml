- type: gameMap
  id: Reach
  mapName: 'Reach'
  mapPath: /Maps/reach.yml # Reach wymaga ponownego zamapowania naszych zawartości
  minPlayers: 0
  maxPlayers: 15
  stations:
    Reach:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Reach Transport {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'SC'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml
        - type: StationJobs
          availableJobs:
            #central command
            NanotrasenRepresentative: [ 1, 1 ] # Polonium
            NanotrasenCareerTrainer: [ 2, 2 ] # Polonium, whitelistowana rola
            #command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ] # Polonium
            HeadOfSecurity: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ] # Polonium
            ChiefMedicalOfficer: [ 1, 1 ] # Polonium
            Quartermaster: [ 1, 1 ] # Polonium
            ResearchDirector: [ 1, 1 ] # Polonium
            #security
            SecurityOfficer: [ 1, 2 ]
            SecurityCadet: [ 1, 1 ]
            Brigmedic: [ 1, 1 ] # Polonium
            Warden: [ 1, 1 ] # Polonium
            #cargo
            CargoTechnician: [ 1, 1 ]
            SalvageSpecialist: [ 1, 1 ]
            #medical
            MedicalDoctor: [ 1, 1 ]
            MedicalIntern: [ 1, 1 ] # Polonium
            Paramedic: [ 1, 1 ] # Polonium
            Psychologist: [ 1, 1 ] # Polonium
            #engineering
            StationEngineer: [ 1, 2 ]
            TechnicalAssistant: [ 1, 1 ] # Polonium
            #science
            Scientist: [ 1, 1 ]
            ResearchAssistant: [ 1, 1 ]
            Borg: [ 1, 1 ]
            #service
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 1 ]
            Chef: [ 1, 1 ]
            ServiceWorker: [ 1, 1 ] # Polonium
            Chemist: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Passenger: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Lawyer: [ 1, 1 ] # Polonium
            Chaplain: [ 1, 1 ] # Polonium

