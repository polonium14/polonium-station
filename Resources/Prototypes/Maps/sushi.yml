- type: gameMap
  id: Sushi
  mapName: 'Sushi Station'
  mapPath: /Maps/sushi.yml
  minPlayers: 45
  stations:
    Sushi:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Sushi Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_sushi.yml
        - type: StationJobs
          availableJobs:
            # Command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            # Service (11-13)
            Bartender: [ 0, 2 ]
            Botanist: [ 0, 2 ]
            Chef: [ 0, 2 ]
            Janitor: [ 0, 2 ]
            Chaplain: [ 0, 1 ]
            Librarian: [ 0, 1 ]
            Reporter: [ 0, 1 ]
            ServiceWorker: [ 0, 2 ]
            # Engineering (7-9)
            AtmosphericTechnician: [ 1, 3 ]
            StationEngineer: [ 2, 4 ]
            TechnicalAssistant: [ 0, 2 ]
            # Medical (8-10)
            Chemist: [ 1, 2 ]
            MedicalDoctor: [ 2, 4 ]
            Paramedic: [ 0, 1 ]
            MedicalIntern: [ 0, 2 ]
            Psychologist: [ 0, 1 ]
            # Science (4-6)
            Scientist: [ 2, 4 ]
            ResearchAssistant: [ 0, 2 ]
            # Security (9-11)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 2, 5 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 0, 2 ]
            Lawyer: [ 0, 2 ]
            # Supply (6)
            SalvageSpecialist: [ 1, 3 ]
            CargoTechnician: [ 2, 3 ]
            # Civilian (3+)
            Passenger: [ -1, -1 ]
            Clown: [ 0, 1 ]
            Mime: [ 0, 1 ]
            Musician: [ 0, 1 ]
            # Silicon (4)
            StationAi: [ 1, 1 ]
            Borg: [ 0, 3 ]
