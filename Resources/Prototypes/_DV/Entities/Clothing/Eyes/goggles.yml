- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesNightVisionGoggles
  name: night vision goggles
  description: An advanced heads-up display which provides id data and vision in complete darkness.
  components:
  - type: Sprite
    sprite: _EE/Clothing/Eyes/Goggles/nightvision.rsi
  - type: Clothing
    sprite: _EE/Clothing/Eyes/Goggles/nightvision.rsi
  - type: NightVision
    relayOverlay: true
    enabled: false
    action: ActionToggleNightVision
    overlayColor: "#98FB9840"
    lightingColor: "#98FB9866"
    noiseAmount: 0.4
    noiseMultiplier: 1.25
    prioritized: true
  - type: IdentityBlocker
    coverage: EYES
  - type: Tag
    tags:
    - NightVisionGoggles
    - WhitelistChameleon

- type: entity
  parent: [ ClothingEyesNightVisionGoggles, ShowSecurityIcons, BaseSecurityContraband ]
  id: ClothingEyesNightVisionSecurityGoggles
  name: night vision security goggles
  components:
  - type: Sprite
    sprite: _EE/Clothing/Eyes/Goggles/security_nightvision.rsi
  - type: Clothing
    sprite: _EE/Clothing/Eyes/Goggles/security_nightvision.rsi
