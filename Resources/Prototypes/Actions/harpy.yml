- type: entity
  parent: BaseAction
  id: ActionHarpyPlayMidi
  name: Play MIDI
  description: Sing your heart out! Right click yourself to set an instrument.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - texture: _DV/Interface/Actions/harpy_sing.png
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.InstrumentUiKey.Key

- type: entity
  parent: BaseAction
  id: ActionSyrinxChangeVoiceMask
  name: Set name
  description: Change the name others hear to something else.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: _DV/Interface/Actions/harpy_syrinx.png
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:VoiceMaskSetNameEvent
