- type: entity
  parent: BaseAction
  id: ActionEatMouse
  name: Eat Mouse
  description: Eat the mouse in your hand, gaining nutriment and a hairball charge.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: Interface/Actions/verbiconfangs.png
  - type: InstantAction
    event: !type:EatMouseActionEvent

- type: entity
  parent: BaseAction
  id: ActionHairball
  name: Cough Up Hairball
  description: Purge some of your chemstream, and gain a cool hairball to throw at people.
  categories: [ HideSpawnMenu ]
  components:
  - type: LimitedCharges
    maxCharges: 1
  - type: Action
    icon: { sprite: Objects/Specific/Species/felinid.rsi, state: icon }
    useDelay: 30
  - type: InstantAction
    event: !type:HairballActionEvent
