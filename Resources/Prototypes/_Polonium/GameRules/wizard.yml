# Lowpop wizard
- type: entity
  parent: [ BaseWizardRule, BaseRoundstartAntagRule ]
  id: WizardLowpop
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 10
    chaosScore: 900
  - type: GameRuleMaxPlayers
    maxPlayers: 20
  - type: DynamicRuleCost
    cost: 100
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: WizardLowpop
  - type: AntagObjectives
    objectives: []
  - type: AntagRandomObjectives
    sets:
    - groups: WizardLowpopObjectiveSetVictim
      maxPicks: 1
    - groups: WizardLowpopObjectiveSetTreasure
      maxPicks: 1
    - groups: WizardLowpopObjectiveSetSpectacle
      maxPicks: 1
    - groups: WizardLowpopObjectiveSetExtra
      maxPicks: 1
    - groups: WizardLowpopObjectiveSetFinale
      maxPicks: 1
    maxDifficulty: 5
