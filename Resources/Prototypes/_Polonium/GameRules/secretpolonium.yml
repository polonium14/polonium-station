- type: weightedRandom
  id: SecretPolonium
  weights:
    # Massacre (50%)
    SecretPlusMid: 19
    SecretPlusMidHigh: 17
    SurvivalPlusMid: 12
    # Calm (49%)
    SecretPlusLow: 20
    Traitor: 9
    Extended: 6
    Greenshift: 6
    # Rare spice (1%)
    AllAtOnce: 0.5
    AllerAtOnce: 0.5

- type: weightedRandom
  id: SecretPoloniumCalm
  weights:
    SecretPlusLow: 40
    Traitor: 20
    Extended: 15
    Greenshift: 10
    SecretPlusMid: 15

- type: weightedRandom
  id: SecretPoloniumHot
  weights:
    SecretPlusMidHigh: 35
    SecretPlusMid: 25
    SurvivalPlusMid: 25
    SecretPlusLow: 5
    Traitor: 5
    AllAtOnce: 2.5
    AllerAtOnce: 2.5

- type: weightedRandom
  id: SecretPoloniumMadness
  weights:
    AllAtOnce: 45
    AllerAtOnce: 25
    SecretPlusMidHigh: 30

- type: entity
  id: SecretPoloniumRule
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretRule
    weightTable: SecretPolonium
    moodWeightTables:
      Calm: SecretPoloniumCalm
      Hot: SecretPoloniumHot
      Madness: SecretPoloniumMadness
