# Reguła presetu Sekret. To ona wybiera faktyczny preset rundy.
# Kandydaci i ich wagi siedzą w polach "moods" presetów (pliki game_presets.yml),
# a same nastroje w Prototypes/_Polonium/round_moods.yml. Presety SecretPlus są w SecretPlus/.
- type: entity
  id: SecretPoloniumRule
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretRule
    useMoods: true
