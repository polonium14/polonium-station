- type: entity
  parent: BaseGameRule
  id: CowiekMaupaSpawn
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/_Polonium/Announcements/attention.ogg
    weight: 5
    duration: 1
    minimumPlayers: 5
    reoccurrenceDelay: 25
    earliestStart: 20
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 250
  - type: RandomEntityStorageSpawnRule
    prototype: MobCowiekMaupa
    openStorageSound: /Audio/_Polonium/Effects/Jumpscare/jumpscare1.ogg

# Like BreakerFlip, but flips every APC breaker on the station.
- type: entity
  parent: BaseGameRule
  id: BreakerDown
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 0
    duration: 1
    minimumPlayers: 1
    eventType: Maintenance
  - type: GameRule
    chaosScore: 200
  - type: BreakerDownRule

# Morph z NSV13: waga 2 i raz na rundę jak w oryginale.
- type: entity
  parent: BaseGameRule
  id: MorphSpawn
  components:
  - type: StationEvent
    weight: 2
    duration: 1
    maxOccurrences: 1
    occursDuringRoundEnd: false
    earliestStart: 20
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 250
  - type: RandomSpawnRule
    prototype: MobMorph
