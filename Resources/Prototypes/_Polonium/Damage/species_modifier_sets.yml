# Fork species damage modifier sets, preserved from the pre-merge Damage/modifier_sets.yml
# (upstream relocated its own sets into Damage/ModifierSets/*; these three are fork-only and
# are referenced by Body/Species/{felinid,rodentia,harpy}.yml).

- type: damageModifierSet
  id: Felinid
  coefficients:
    Blunt: 1.15
    Slash: 1.15
    Piercing: 1.15

# Rodentia are fragile, especially to blunt
- type: damageModifierSet
  id: Rodentia
  coefficients:
    Blunt: 1.3
    Slash: 1.15
    Piercing: 1.15

# Harpies are light-boned
- type: damageModifierSet
  id: Harpy
  coefficients:
    Blunt: 1.15
    Slash: 1.15
    Piercing: 1.15
