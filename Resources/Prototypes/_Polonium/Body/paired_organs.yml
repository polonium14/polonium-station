# Paired lungs and kidneys for the player species: each side is its own organ category, because a body holds
# one organ per category. A side is the species organ with the side mixin first, so the mixin wins.

- type: organCategory
  id: LungLeft

- type: organCategory
  id: LungRight

- type: organCategory
  id: KidneyLeft

- type: organCategory
  id: KidneyRight

- type: entity
  abstract: true
  id: OrganSideLungLeft
  name: left lung
  components:
  - type: Organ
    category: LungLeft
  - type: Sprite
    layers:
    - state: lung-l

- type: entity
  abstract: true
  id: OrganSideLungRight
  name: right lung
  components:
  - type: Organ
    category: LungRight
  - type: Sprite
    layers:
    - state: lung-r

- type: entity
