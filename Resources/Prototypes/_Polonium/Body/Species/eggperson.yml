# Jajoludzie z Aquili. Skorupka twardnieje, im bardziej jajko jest usmażone (EggShellComponent).
- type: markingsGroup
  parent: Undergarments
  id: Eggperson
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

# Kruchość względem tłuczenia liczy EggShellSystem, tu zostaje tylko gotowanie.
- type: damageModifierSet
  id: Eggperson
  coefficients:
    Heat: 1.1

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceEggperson
  categories: [ HideSpawnMenu ]
  name: eggperson appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganEggpersonTorso
      Head: OrganEggpersonHead
      ArmLeft: OrganEggpersonArmLeft
      ArmRight: OrganEggpersonArmRight
      HandRight: OrganEggpersonHandRight
      HandLeft: OrganEggpersonHandLeft
      LegLeft: OrganEggpersonLegLeft
      LegRight: OrganEggpersonLegRight
      FootLeft: OrganEggpersonFootLeft
      FootRight: OrganEggpersonFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Eggperson

- type: entity
  parent: AppearanceEggperson
  id: MobEggpersonDummy
  categories: [ HideSpawnMenu ]

- type: entity
  parent:
  - AppearanceEggperson
  - BaseSpeciesMobOrganic
  id: MobEggperson
  name: Urist McYolk
  components:
  - type: EggShell
  - type: Speech
    speechVerb: Eggperson
    speechSounds: Eggcrack
  - type: Damageable
    damageModifierSet: Eggperson
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Egg
        Quantity: 300
  - type: Butcherable
    spawned:
    - id: FoodMealOmelette
      amount: 3
    - id: Eggshells
      amount: 2

- type: entity
  parent: OrganBaseOrganic
  id: OrganEggperson
  abstract: true
  suffix: eggperson

- type: entity
  parent: OrganEggperson
  id: OrganEggpersonExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Polonium/Mobs/Species/Eggperson/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Polonium/Mobs/Species/Eggperson/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Eggperson

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganEggpersonExternal ]
  id: OrganEggpersonTorso
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Nerve
  - type: Woundable
    integrityCap: 200
