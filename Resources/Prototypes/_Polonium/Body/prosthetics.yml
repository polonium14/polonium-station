- type: entity
  parent: OrganBase
  id: OrganProstheticBase
  abstract: true
  description: A simple prosthesis. Attach it like any limb.
  components:
  - type: Prosthetic
  - type: StaticPrice
    price: 50

- type: entity
  parent: OrganProstheticBase
  id: OrganProstheticLimbBase
  abstract: true
  components:
  - type: ContainerContainer
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Nerve
  - type: Woundable
    integrityCap: 80
    thresholds:
      Healthy: 80
      Minor: 70
      Moderate: 60
      Severe: 40
      Critical: 20
      Mangled: 5
      Severed: -10

- type: entity
  parent: [ OrganBaseArmLeft, OrganProstheticLimbBase ]
  id: OrganProstheticArmLeft
  name: prosthetic left arm
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Customization/scars.rsi
    state: arm_l_prosthetic
  - type: VisualOrgan
    data:
      sprite: _Impstation/Mobs/Customization/scars.rsi
      state: arm_l_prosthetic
  - type: VisualOrganMarkings
    markingData:
      group: None
      layers:
      - LArm

