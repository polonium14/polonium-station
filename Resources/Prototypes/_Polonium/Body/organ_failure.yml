# Organ failure of the kidneys, liver, lungs and heart.
# selfDamage is a fraction of the organ's maximum integrity per second; chances are per second.
# A higher self-damage would kill the organ before stage 2, so it is low: none in stage 1,
# 0.025% of the organ a second in stage 2 and 0.1% in stage 3.
# A stage passes once the organ is healthy and back to cureAt of its integrity. Stage 3 no longer passes by
# healing (needsSurgery) and scars the organ: a quarter of its integrity is gone until it is replaced.
# A failing organ healed back to health spares the body, but still wears itself down.

- type: organFailure
  id: Kidneys
  stages:
  - selfDamage: 0
    symptoms:
    - chance: 0.02
      others: organ-failure-pale
    - chance: 0.02
      others: organ-failure-shudder
    - chance: 0.025
      self: organ-failure-abdomen
  - selfDamage: 0.00025
    cureAt: 0.6
    symptoms:
    - chance: 0.02
      others: organ-failure-pale
    - chance: 0.02
      others: organ-failure-groan
    - chance: 0.025
      self: organ-failure-back
    - chance: 0.015
      self: organ-failure-flank
    - chance: 0.015
      faint: 3
  - selfDamage: 0.001
    needsSurgery: true
    scar: 0.25
    damage:
      types:
        Poison: 0.5
    symptoms:
    - chance: 0.02
      others: organ-failure-twitch
    - chance: 0.05
      emote: Gasp

