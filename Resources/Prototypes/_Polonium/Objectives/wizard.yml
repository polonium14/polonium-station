# Finale

- type: entity
  parent: [ BaseWizardObjective, BaseLivingObjective ]
  id: WizardEscapeShuttleObjective
  name: Escape to CentComm on the evacuation shuttle, uncuffed.
  description: The Federation has someone on the inside at CentComm. Show up on the evacuation shuttle and don't get cuffed.
  components:
  - type: Objective
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
  - type: EscapeShuttleCondition

- type: entity
  parent: BaseWizardObjective
  id: WizardRobesObjective
  name: Last until the end of the shift in a wizard's hat and robe.
  description: A true wizard doesn't hide who they are. At the end of the shift you must be alive and wearing a magic hat and robe.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Hats/wizardhat.rsi
      state: icon
  - type: WearingWhitelistCondition
    slots: [ head, outerClothing ]
    whitelist:
      components:
      - WizardClothes

# Pools, one objective from each set

- type: weightedRandom
  id: WizardObjectiveGroupVictim
  weights:
    WizardKillHeadObjective: 0.75
    WizardKillChaplainObjective: 0.75
    WizardKillSecurityObjective: 0.75
    WizardKillScientistObjective: 0.75
    WizardMaroonCaptainObjective: 0.75
    WizardMaroonRandomObjective: 0.75
    WizardCluwneTargetObjective: 1
    WizardCluwneHeadObjective: 0.5
    WizardCluwneClownObjective: 0.5
    WizardPolymorphTargetObjective: 1
    WizardPolymorphHeadObjective: 0.5

- type: weightedRandom
  id: WizardObjectiveGroupSpectacle
  weights:
    WizardChosenOneObjective: 1
    WizardCluwneCountObjective: 1
    WizardPolymorphCountObjective: 1
    WizardSlipperyCountObjective: 1
    WizardAnimateCountObjective: 1
    WizardDoorCountObjective: 1
    WizardRedAlertObjective: 1

- type: weightedRandom
  id: WizardObjectiveGroupTreasure
  weights:
    WizardStealXenoArtifactObjective: 1
    WizardStealBibleObjective: 1
    WizardStealCaptainSwordObjective: 1
    WizardStealHandTeleporterObjective: 1
    WizardStealAntiqueLaserObjective: 1
    WizardStealPlantRDObjective: 1
    WizardStealAltarObjective: 1
    WizardStealBoozeDispenserObjective: 1
    WizardStealChemDispenserObjective: 1
    WizardStealGoldMedalObjective: 1
    WizardStealWardenHatObjective: 1
    WizardStealDetectiveLighterObjective: 1
    WizardStealHeadCloaksObjective: 1
    WizardStealStampsObjective: 1
    WizardStealTechDisksObjective: 1

- type: weightedRandom
  id: WizardObjectiveGroupFamiliar
  weights:
    WizardFamiliarIanObjective: 1
    WizardFamiliarCatObjective: 1
    WizardFamiliarMcGriffObjective: 1
    WizardFamiliarWalterObjective: 1
    WizardFamiliarMortyObjective: 1
    WizardFamiliarRenaultObjective: 1
    WizardFamiliarShivaObjective: 1
    WizardFamiliarTropicoObjective: 1

- type: weightedRandom
  id: WizardObjectiveGroupFinale
  weights:
    WizardSurviveObjective: 1
    WizardEscapeShuttleObjective: 1
    WizardRobesObjective: 1

- type: weightedRandom
  id: WizardLowpopObjectiveSetVictim
  weights:
    WizardObjectiveGroupVictim: 1

- type: weightedRandom
  id: WizardLowpopObjectiveSetTreasure
  weights:
    WizardObjectiveGroupTreasure: 3
    WizardObjectiveGroupFamiliar: 1

- type: weightedRandom
  id: WizardLowpopObjectiveSetSpectacle
  weights:
