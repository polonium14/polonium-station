- type: weightedRandom
  id: WizardLowpopObjectiveSetExtra
  weights:
    WizardObjectiveGroupVictim: 1
    WizardObjectiveGroupTreasure: 1
    WizardObjectiveGroupFamiliar: 0.5
    WizardObjectiveGroupSpectacle: 1

- type: weightedRandom
  id: WizardLowpopObjectiveSetFinale
  weights:
    WizardObjectiveGroupFinale: 1
