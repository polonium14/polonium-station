# Victims

- type: entity
  abstract: true
  parent: BaseWizardObjective
  id: BaseWizardTargetObjective
  components:
  - type: TargetObjective
  - type: PickRandomPerson
    conditions:
    - !type:ObjectiveTargetCondition
      inverted: true
      whitelist:
        components:
        - TargetObjective

- type: entity
  abstract: true
  parent: [ BaseWizardTargetObjective, BaseKillObjective ]
  id: BaseWizardKillObjective
  components:
  - type: Objective
    unique: true
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: gib
  - type: TargetObjective
    title: wizard-objective-kill-title
  - type: KillPersonCondition
    requireDead: true

- type: entity
  parent: BaseWizardKillObjective
  id: WizardKillHeadObjective
  description: This head of staff dared to mock the Federation. Let the whole station see how unbelievers end up.
  components:
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      whitelist:
        components:
        - CommandStaff

- type: entity
  parent: BaseWizardKillObjective
  id: WizardKillChaplainObjective
  description: The station's chaplain preaches that magic is heresy. Show them what prayers are worth against true power.
  components:
  - type: PickRandomPerson
    conditions:
    - !type:JobCondition
      jobs: [ Chaplain ]

- type: entity
  parent: BaseWizardKillObjective
  id: WizardKillSecurityObjective
  description: This station's security has locked up more than one apprentice of the Federation. Time to settle the score.
  components:
  - type: PickRandomPerson
    conditions:
    - !type:JobCondition
      jobs: [ HeadOfSecurity, Warden, SecurityOfficer, Detective ]

- type: entity
  parent: BaseWizardKillObjective
  id: WizardKillScientistObjective
  description: This person is trying to reduce magic to formulas and charts. The Federation does not like anyone prying into its secrets.
  components:
  - type: PickRandomPerson
    conditions:
    - !type:JobCondition
      jobs: [ ResearchDirector, Scientist ]

- type: entity
  abstract: true
  parent: BaseWizardKillObjective
  id: BaseWizardMaroonObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: blink
  - type: TargetObjective
    title: objective-condition-maroon-person-title
  - type: KillPersonCondition
    requireDead: false
    requireMaroon: true

- type: entity
  parent: BaseWizardMaroonObjective
  id: WizardMaroonCaptainObjective
  description: The Federation has its own plans for the captain. Whether they live or not, they must not return to CentComm.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Hats/captain.rsi
      state: icon
  - type: PickRandomPerson
    conditions:
    - !type:JobCondition
      jobs: [ Captain ]

- type: entity
  parent: BaseWizardMaroonObjective
  id: WizardMaroonRandomObjective
  description: This person has seen too much. They must not tell the tale at CentComm.

- type: entity
  abstract: true
  parent: BaseWizardTargetObjective
  id: BaseWizardCluwneObjective
  components:
  - type: Objective
    icon:
      sprite: Clothing/Mask/cluwne.rsi
      state: icon
  - type: TargetObjective
    title: wizard-objective-cluwne-title
  - type: TargetWhitelistCondition
    whitelist:
      components:
      - Cluwne

- type: entity
  parent: BaseWizardCluwneObjective
  id: WizardCluwneTargetObjective
  description: Someone has to become the laughingstock of the station. Cast Cluwne's Curse and make sure the victim lasts until the end of the shift, a dead cluwne makes nobody laugh.

- type: entity
  parent: BaseWizardCluwneObjective
  id: WizardCluwneHeadObjective
  description: Nothing teaches humility like a red nose. Curse this head of staff with Cluwne's Curse and let them keep commanding until the end of the shift.
  components:
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      whitelist:
        components:
        - CommandStaff

- type: entity
  parent: BaseWizardCluwneObjective
  id: WizardCluwneClownObjective
  description: The station's clown parodies wizards at every show. Show them what a real joke looks like with Cluwne's Curse. They must last until the end of the shift.
  components:
  - type: PickRandomPerson
    conditions:
    - !type:JobCondition
      jobs: [ Clown ]

- type: entity
  abstract: true
  parent: BaseWizardTargetObjective
  id: BaseWizardPolymorphObjective
  components:
  - type: Objective
    icon:
      sprite: Mobs/Aliens/Carps/magic.rsi
      state: icon
  - type: TargetObjective
    title: wizard-objective-polymorph-title
  - type: TargetWhitelistCondition
    whitelist:
      components:
      - PolymorphedEntity

- type: entity
  parent: BaseWizardPolymorphObjective
  id: WizardPolymorphTargetObjective
  description: This person would do better with fins. Turn them into an animal with the wand of carp polymorph and make sure they last until the end of the shift in that form.

- type: entity
  parent: BaseWizardPolymorphObjective
  id: WizardPolymorphHeadObjective
  description: Someone who loves giving orders this much can try giving them by gurgling. Turn this head of staff into an animal with the wand of carp polymorph and keep them that way until the end of the shift.
  components:
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      whitelist:
        components:
        - CommandStaff

# Spectacle

- type: entity
  parent: [ BaseWizardTargetObjective, BaseKeepAliveObjective ]
  id: WizardChosenOneObjective
  description: The Federation has chosen this person as a future apprentice, though they don't know it yet. They must survive the shift.
  components:
  - type: Objective
    unique: true
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: shield
  - type: TargetObjective
    title: wizard-objective-chosen-one-title
  - type: PickRandomPerson
    conditions:
    - !type:AntagonistCondition
      inverted: true

- type: entity
  parent: BaseWizardObjective
  id: WizardCluwneCountObjective
  description: The Federation loves a good circus. Everyone cursed with Cluwne's Curse must still be alive at the end of the shift.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Mask/cluwne.rsi
      state: icon
  - type: NumberObjective
    min: 2
    max: 3
    title: wizard-objective-cluwne-count-title
  - type: MindWhitelistCountCondition
    whitelist:
      components:
      - Cluwne

- type: entity
  parent: BaseWizardObjective
  id: WizardPolymorphCountObjective
  description: The station needs a menagerie. Everyone hit by the wand of carp polymorph must last until the end of the shift in animal form.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Guns/Basic/wands.rsi
      state: poly
  - type: NumberObjective
    min: 2
    max: 3
    title: wizard-objective-polymorph-count-title
  - type: MindWhitelistCountCondition
    whitelist:
      components:
      - PolymorphedEntity

- type: entity
  parent: BaseWizardObjective
  id: WizardSlipperyCountObjective
  description: Nothing livens up a station like a crew tripping over each other. The victims must still be alive at the end of the shift.
  components:
  - type: Objective
    icon:
      sprite: Objects/Specific/Janitorial/soap.rsi
      state: omega-4
  - type: NumberObjective
    min: 3
    max: 4
    title: wizard-objective-slippery-count-title
  - type: MindWhitelistCountCondition
    whitelist:
      components:
      - Slippery

- type: entity
  parent: BaseWizardObjective
  id: WizardAnimateCountObjective
  description: Chairs, lockers, vending machines, anything can gain a will of its own with the staff of animation. They must still be roaming the station at the end of the shift.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Guns/Basic/staves.rsi
      state: animation
  - type: NumberObjective
    min: 3
    max: 5
    title: wizard-objective-animate-count-title
  - type: EntityCountCondition
    component: Animate

- type: entity
  parent: BaseWizardObjective
  id: WizardDoorCountObjective
  description: Nanotrasen architecture is dreadfully dull. Show them what a station decorated by a wizard looks like, using the wand of entrance. The doors must still stand at the end of the shift.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Guns/Basic/wands.rsi
      state: door
  - type: NumberObjective
    min: 5
    max: 8
    title: wizard-objective-door-count-title
  - type: EntityCountCondition
    component: PolymorphedEntity
    whitelist:
      components:
      - Door

- type: entity
  parent: BaseWizardObjective
  id: WizardRedAlertObjective
  name: Force the station into Red Alert.
  description: Let them know the Federation is here. Command has to declare at least Red Alert.
  components:
  - type: Objective
    icon:
      sprite: Objects/Fun/Instruments/otherinstruments.rsi
      state: red_phone
  - type: AlertLevelReachedCondition
    levels: [ Red, Gamma, Epsilon ]

