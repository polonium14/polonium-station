- type: entity
  name: goblin
  id: MobBaseGoblin
  parent: MobBaseAncestor
  description: Śmierdzące, chytre, przestępcze. Ich sama egzystencja jest zbrodnią wojenną.
  abstract: true
  components:
  - type: NameIdentifier
    group: Goblin
  - type: LizardAccent
  - type: ReplacementAccent
    accent: kobold
  - type: Inventory
    templateId: digitigrade
    speciesId: harpy
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: ['Hiss', 'Scream']
  - type: Vocal
    emoteSounds: Goblin
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: TypingIndicator
    proto: lizard
  - type: InteractionPopup
    successChance: 0.4
    interactSuccessString: petting-success-monkey
    interactFailureString: petting-failure-monkey
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/lizard_happy.ogg
    interactFailureSound:
      path: /Audio/Items/wirecutter.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Critical
      125: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 7
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Hands
    startingHands:
      hand_left:
        location: Left
      hand_right:
        location: Right
  - type: Puller
    needsHands: True
  - type: PassiveDamage # Slight passive regen.
    intervalHaltOnDamageTaken: 5s
    allowedStates:
    - Alive
    damage:
      types:
        Poison: -0.5
  - type: Rummager
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganGoblinLungs
        - id: OrganGoblinHeart
        - id: OrganGoblinStomach
        - id: OrganGoblinLiver
        - id: OrganGoblinKidneys
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _Polonium/Mobs/goblin.rsi
      state: goblin
    - map: [ "outline" ]
      sprite: _Polonium/Mobs/goblin.rsi
      state: outline
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "ears" ]
    - map: [ "id" ]
    - map: [ "mask" ]
    - map: [ "head" ]
  - type: RandomSprite
    getAllGroups: true
    available:
      - enum.DamageStateVisualLayers.Base:
          goblin: KoboldColors
  - type: Butcherable
    spawned:
    - id: FoodMeatGoblin
      amount: 3
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
    - reagents: [ SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 0.2
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "goblin-hurt-by-spacecleaner-popup" ]
        probability: 0.66
      - !type:Emote
        emote: Scream
        probability: 0.3
  - type: AlwaysRevolutionaryConvertible
  - type: GhostTakeoverAvailable
  - type: GhostRole
    prob: 1
    makeSentient: true
    name: ghost-role-information-goblin-name
    description: ghost-role-information-goblin-description
    rules: ghost-role-information-freeagent-rules


- type: entity
  parent: OrganBaseOrganic
  id: OrganGoblin
  abstract: true
  suffix: goblin

- type: entity
  id: OrganGoblinMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Goblin ]

- type: entity
  parent: OrganGoblin
  id: OrganGoblinInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganGoblin
  id: OrganGoblinExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi


