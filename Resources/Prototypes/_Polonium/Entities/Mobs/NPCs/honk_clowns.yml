- type: entity
  abstract: true
  parent: SimpleSpaceMobBase
  id: BaseMobHonkClown
  suffix: Honk
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit
      Dead:
        Base: crit
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4.5
  - type: MeleeWeapon
    angle: 90
    animation: WeaponArcBite
    soundHit:
      collection: Punch
    damage:
      types:
        Blunt: 8.75
  - type: NoSlip
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 150
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.15
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
  - type: Speech
    speechVerb: Cluwne
    allowedEmotes: ['Scream', 'HonkClownWail']
  - type: Vocal
    emoteSounds: HonkClown
    wilhelmProbability: 0
  - type: Emoting
  - type: AutoEmote
    emotes:
    - HonkClownWail
  - type: GhostRole
    prob: 0.3
    makeSentient: true
    name: ghost-role-information-honk-clown-name
    description: ghost-role-information-honk-clown-description
    rules: ghost-role-information-honk-clown-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: SpawnOnGib
    spawn:
    - id: OrganHumanHeart
    - id: OrganHumanLungs
    - id: OrganHumanLiver
    - id: OrganHumanStomach
    - id: OrganHumanKidneys
    - id: ClothingMaskClown
      prob: 0.5

