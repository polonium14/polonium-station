- type: entity
  parent: [FoodMeatRawBase, BaseSlicingRefinableFood]
  id: FoodMeatGoblin
  name: surowe mięso goblińskie
  description: Niesanitarne, ale gobliny zawsze tak wyglądają, nawet od środka.
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Cosumable/Food/meat.rsi
    state: goblin
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatGoblinCutlet
      amount: 4
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: UncookedAnimalProteins
        Quantity: 4
      - ReagentId: THC
        Quantity: 15
      - ReagentId: SpaceDrugs
        Quantity: 15
  - type: Construction
    graph: GoblinSteak
    node: start
    defaultTarget: goblin steak

- type: entity
  parent: FoodMeatCutletBase
  id: FoodMeatGoblinCutlet
  name: surowy gobliński kotlet
  description: surowy, bardzo uzależniający, gobliński kotlet.
  components:
  - type: Tag
    tags:
    - Raw
    - Cutlet
    - Meat
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: UncookedAnimalProteins
        Quantity: 2
      - ReagentId: THC
        Quantity: 5
      - ReagentId: SpaceDrugs
        Quantity: 5
  - type: Sprite
    sprite: _Polonium/Objects/Cosumable/Food/meat.rsi
    state: goblinCutlet
  - type: Construction
    graph: GoblinCutlet
    node: start
    defaultTarget: goblin cutlet
  - type: Item
    inhandVisuals:
      left: []
      right: []


