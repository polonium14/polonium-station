- type: entity
  name: parówka
  parent: FoodMeatBase
  id: FoodMeatParowka
  description: Parówka, taka jak z żabki.
  components:
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: Sprite
    sprite: _Polonium/Objects/Cosumable/Food/meat.rsi
    state: parowka
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: Fat
        Quantity: 2

- type: entity
  name: Pęto parówek
  parent: [FoodMeatBase, BaseSlicingRefinableFood]
  id: FoodMeatPetoParowek
  description: Pęto parówek, no bo kto nie lubi parówek.
  components:
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: Sprite
    sprite: _Polonium/Objects/Cosumable/Food/meat.rsi
    state: petoparowek
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
      - ReagentId: Fat
        Quantity: 8
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatParowka
      amount: 4

- type: entity
  name: ćmoparówka
  parent: FoodMeatBase
  id: FoodMeatMoffParowa
  description: Bo ćmy też chcą skosztować parówek.
  components:
  - type: Tag
    tags:
    - Raw
    - ClothMade
  - type: Sprite
    sprite: _Polonium/Objects/Cosumable/Food/meat.rsi
    state: moffparowa
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 5
      - ReagentId: Fat
        Quantity: 5

- type: entity
  name: pęto ćmoparówek
  parent: [FoodMeatBase, BaseSlicingRefinableFood]
  id: FoodMeatPetoMoffParowek
  description: Pęto ćmoparówek, bzz!
  components:
  - type: Tag
    tags:
    - Raw
    - ClothMade
  - type: Sprite
    sprite: _Polonium/Objects/Cosumable/Food/meat.rsi
    state: petomoffparowek
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 20
      - ReagentId: Fat
        Quantity: 20
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatMoffParowa
      amount: 4

- type: entity
  parent: [FoodMeatRawBase, BaseSlicingRefinableFood]
  id: FoodMeatGoblin
  name: surowe mięso goblińskie
  description: Niesanitarne, ale tak gobliny zawsze wyglądają, nawet od środka.
  components:
  - type: Sprite
    state: rotten
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatGoblinCutlet
      amount: 4
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: UncookedAnimalProteins
        Quantity: 4
      - ReagentId: THC
        Quantity: 15
      - ReagentId: SpaceDrugs
        Quantity: 15
  - type: Construction
    graph: MeatSteak
    node: start
    defaultTarget: meat steak
  - type: Tag
    tags:
    - Meat
  - type: Item
    storedOffset: -2,1
    inhandVisuals:
      left:
      - state: plain-inhand-left
      right:
      - state: plain-inhand-right

- type: entity
  parent: FoodMeatCutletBase
  id: FoodMeatGoblinCutlet
  name: surowy gobliński kotlet
  description: surowy, bardzo uzależniający, gobliński kotlet.
  components:
  - type: Tag
    tags:
    - Raw
    - Cutlet
    - Meat
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 1
      - ReagentId: UncookedAnimalProteins
        Quantity: 3
      - ReagentId: THC
        Quantity: 4
      - ReagentId: SpaceDrugs
        Quantity: 4
  - type: Sprite
    state: cutlet
  - type: Construction
    graph: Cutlet
    node: start
    defaultTarget: cutlet
