- type: entity
  id: BulletSeismicCharge
  name: seismic charge
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Bombs/seismic.rsi
    layers:
      - state: icon
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Cryo
    totalIntensity: 120
    intensitySlope: 2
    maxIntensity: 30
    canCreateVacuum: true
    maxTileBreak: 60
  - type: PointLight
    radius: 1
    color: orange
    energy: 0.5


- type: entity
  id: BulletPlasmaCutterShuttle
  parent: BulletPlasmaCutter
  components:
  - type: GatheringProjectile
  - type: Projectile
    damage:
      types:
        Heat: 8 #funkystation -GLORY TO TAYDEO!!!!, GREAT LEADER!!! TAYDEO NUMBA 1!!!
        Structural: 25 #funkystation mining tools should not deal above 30 structural damage if they are ment to have the GatheringProjectile tag as otherwise it will cause ore drops to dupe
  - type: TimedDespawn
    lifetime: 2.8 
  - type: PointLight
    radius: 4
    color: purple
    energy: 2