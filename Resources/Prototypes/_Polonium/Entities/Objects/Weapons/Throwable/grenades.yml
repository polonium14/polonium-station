# Polonium - Halon firefighting grenade
- type: entity
  parent: AirGrenade
  id: HalonGrenade
  name: halon grenade
  description: An emergency firefighting grenade that floods an area with halon gas, smothering fires by devouring their oxygen. Do not deploy where people still need to breathe.
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Weapons/Grenades/halonade.rsi
  - type: ReleaseGasOnTrigger
    keysIn:
    - timer
    removeFraction: 0.75
    air:
      volume: 1000
      moles:
        Halon: 300
      temperature: 293.15

# Polonium - Piemageddon grenade: chains into itself three times before scattering pies
- type: entity
  parent: [VolatileGrenadeBase, TimerGrenadeBase]
  id: PiemageddonGrenadeAdmeme
  suffix: Admeme
  name: Piemageddon grenade
  description: Chains into more of itself three times, before erupting into a storm of pies.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/clusterbomb.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: PiemageddonGrenade
    fillPrototype: PiemageddonChain2Admeme
    count: 3
    distance: 4
    velocity: 6
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 0.5
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      path: "/Audio/Machines/door_lock_off.ogg"
    positional: true

- type: entity
  parent: [VolatileGrenadeBase, TimerGrenadeBase]
  id: PiemageddonChain2Admeme
  suffix: Admeme
  name: Piemageddon grenade
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/clusterbomb.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: PiemageddonGrenade
    fillPrototype: PiemageddonChain3Admeme
    count: 3
    distance: 4
    velocity: 6

- type: entity
  parent: [VolatileGrenadeBase, TimerGrenadeBase]
  id: PiemageddonChain3Admeme
  suffix: Admeme
  name: Piemageddon grenade
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/clusterbomb.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: PiemageddonGrenade
    fillPrototype: PiemageddonTerminalAdmeme
