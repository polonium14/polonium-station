- type: entity
  parent: [VolatileGrenadeBase, TimerGrenadeBase]
  id: PiemageddonTerminalAdmeme
  suffix: Admeme
  name: Piemageddon pie
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/clusterbomb.rsi
    layers:
