- type: entity
  parent: BasePlushie
  id: PlushieItanKio
  name: Itan-Kio plushie
  description: A plush representation of a very (in)competent atmospheric technician.
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Fun/Plushies/ItanKio-Plush.rsi
    state: icon
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/Items/Toys/weh.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 180
    attackRate: 15
    soundHit:
      path: /Audio/Items/Toys/weh.ogg

- type: entity
  parent: BaseItem
  id: ItanKioGoBoom
  name: Itan-Kio plushie
  description: "User manual: Twist its tail and throw it at a victim of your choosing."
  suffix: BOMB, DO NOT MAP
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Fun/Plushies/ItanKio-Plush.rsi
    state: icon
  - type: TriggerOnUse
  - type: Explosive
    explosionType: Minibomb
    totalIntensity: 300
    intensitySlope: 30
    maxIntensity: 60
  - type: ExplodeOnTrigger
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:TimerStartBehavior
    - trigger:
        !type:DamageTrigger
        damage: 45
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  parent: PlushieMoth
  id: PlushieMothDeathshead
  name: deathshead moth plushie
  description: A fluffy plushie resembling a certain moth bartender. A small inscription reads "Don't serve whiskey after midnight".
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Fun/Plushies/deathshead.rsi
    state: icon
  - type: ReactionMixer
    mixMessage: "spoon-mixing-success"
    timeToMix: 0.5
    reactionTypes:
    - Stir
  - type: Clothing
    sprite: _Polonium/Objects/Fun/Plushies/deathshead.rsi
