# Kapitan Bomba z NSV13 (Aquila, aq33/NSV13#304, sprite'y: Reprimann).
# Sam antagonista nie był portowany do NSV13 - strój jest w szafce kapitana, a pełny zestaw z blasterem tylko dla adminów.

- type: entity
  parent: ClothingHeadEVAHelmetBase
  id: ClothingHeadHelmetKapitanBomba
  name: cosmo-helmet
  description: The cosmic helmet of the Captain of the Space Ship Orzeł 1.
  components:
  - type: Sprite
    sprite: _Polonium/Clothing/Hats/kapitanbomba.rsi
  - type: Clothing
    sprite: _Polonium/Clothing/Hats/kapitanbomba.rsi
  - type: Item
    sprite: _Polonium/Clothing/Hats/kapitanbomba.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
        Shock: 0.8

- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterSuitKapitanBomba
  name: cosmo-suit
  description: The cosmic suit of the Captain of the Space Ship Orzeł 1.
  components:
  - type: Sprite
    sprite: _Polonium/Clothing/OuterClothing/kapitanbomba.rsi
  - type: Clothing
    sprite: _Polonium/Clothing/OuterClothing/kapitanbomba.rsi
  - type: Item
    sprite: _Polonium/Clothing/OuterClothing/kapitanbomba.rsi
    size: Normal
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.85
        Heat: 0.8
        Caustic: 0.8

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesKapitanBomba
  name: cosmo-boots
  description: Captain Bomba's cosmic boots, he polished them himself.
  components:
  - type: Sprite
    sprite: _Polonium/Clothing/Shoes/kapitanbomba.rsi
  - type: Clothing
    sprite: _Polonium/Clothing/Shoes/kapitanbomba.rsi

- type: entity
  parent: MagazineLightRifleBox
  id: MagazineLightRifleBoxBlaster
  name: blaster ammo
  description: Miraculously not drunk away, but no wonder - who would trade 6mm for a bottle.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifle
    capacity: 99

- type: entity
  parent: BaseWeaponLightMachineGun
  id: WeaponLightMachineGunBlaster
  name: Captain Bomba's blaster
  description: Hands off, you dumb dicks.
  components:
  - type: Sprite
    sprite: _Polonium/Weapons/Guns/blaster.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    sprite: _Polonium/Weapons/Guns/blaster.rsi
  - type: Clothing
    sprite: _Polonium/Weapons/Guns/blaster.rsi
    slots: [ NONE ]
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleBoxBlaster
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifleBox
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle

- type: entity
  parent: IDCardStandard
  id: KapitanBombaIDCard
  name: Captain Bomba's ID card
  suffix: Admeme
  components:
  - type: Sprite
    layers:
    - state: gold
    - state: stripe_top
      color: "#1b67a5"
    - state: stripe_bottom
      color: "#0e4069"
  - type: Item
    heldPrefix: gold
  - type: IdCard
    fullName: Tytus Bomba
    jobTitle: job-title-kapitan-bomba
  - type: Access
    tags:
    - Maintenance
    - SyndicateAgent
    - Captain

- type: startingGear
  id: KapitanBombaGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitOperative
    outerClothing: ClothingOuterSuitKapitanBomba
    head: ClothingHeadHelmetKapitanBomba
    shoes: ClothingShoesKapitanBomba
    gloves: ClothingHandsGlovesCombat
    ears: ClothingHeadset
    id: KapitanBombaIDCard
    back: ClothingBackpack
  inhand:
  - WeaponLightMachineGunBlaster
  storage:
    back:
    - StorageImplanter
