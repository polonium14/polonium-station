- type: entity
  parent: BaseItem
  id: GenieLamp
  name: Lampa Dżina
  description: Stara lampa, która wygląda jakby mogła spełnić życzenia.
  components:
  - type: Sprite
    sprite: /Textures/_Polonium/Objects/Misc/genie.rsi
    state: icon
  - type: Item
    sprite: /Textures/_Polonium/Objects/Misc/genie.rsi
    size: Tiny
  - type: UseDelay
    delay: 30
  - type: EmitSoundOnUse
    sound:
        collection: GenieLamp
        params:
            variation: 0.2
  - type: PopupOnUse
    message: Czujesz nadprzyrodzoną obecność wokół siebie...
    showToOthers: true
    popupSize: large
