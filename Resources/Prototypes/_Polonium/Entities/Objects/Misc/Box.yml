
# Thermite Pack

- type: entity
  parent: BoxBase
  id: BaseThermitePack
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,2,1
    whitelist:
      tags:
      - Spray
      - FireExtinguisher
      - TacticalIgniter
      - Pill
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 50
      Cloth: 10
  - type: StaticPrice
    price: 15
  - type: Sprite
    layers:
      - state: box
      - state: flare
  - type: Item
    shape:
    - 0,0,2,1

- type: entity
  parent: BaseThermitePack
  id: ThermitePack
  name: thermite pack
  description: "A box for tactical deployment of thermite based breaching. On the side there is writen: ONLY FOR PEACE SPREADING!"
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
       children:
        - id: SprayBottleSpaceCleaner
        - id: ThermiteSparyer
        - id: TacticalIgniter
        - id: PillDermaline

# Explosive Pack

- type: entity
  parent: BoxBase
  id: BaseExplosivePack
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,1
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 50
      Steel: 50 # hey it is explosion resistant in the end
      Cloth: 10
  - type: StaticPrice
    price: 15
  - type: Sprite
    layers:
      - state: box
      - state: flare
  - type: Item
    shape:
    - 0,0,3,2 # Downside of the explosive proofness

- type: entity
  parent: BaseExplosivePack
  id: ExplosivePack
  name: explosive pack
  description: "A box for tactical deployment of explosive based breaching. On the side there is writen: ONLY FOR PEACE SPREADING!"
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
       children:
        - id: WiredDetonator
          amount: 2
        - id: RemoteSignaller
        - id: CableDetStack10
