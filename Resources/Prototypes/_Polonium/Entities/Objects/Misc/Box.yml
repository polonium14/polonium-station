- type: entity
  parent: BoxCardboard
  id: BaseThermitePack
  name: BaseThermitePack
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
      - state: tote-0
        map: ["enum.StorageFillLayers.Fill"]
      - state: circuit
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 3
    fillBaseName: tote
  - type: Storage
    maxItemSize: Medium
    grid:
    - 0,0,4,1
    whitelist:
      components:
      - FireExtinguisher
      - TacticalIgniter
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 50
      Cloth: 10
  - type: StaticPrice
    price: 15
  - type: Sprite
    layers:
      - state: box
      - state: flare
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:

- type: entity
  parent: BaseThermitePack
  id: ThermitePack
  name: Thermite Pack
  description: A box for tactical deployment of thermite based breaching.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FireExtinguisher
        - id: ThermiteSparyer
        - id: TacticalIgniter
        - id: PillDermaline