# Reklamówki

- type: entity
  abstract: true
  parent: BaseStorageItem
  id: BasePlasticShoppingBag
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Misc/reklamowki.rsi
  - type: Item
    sprite: _Polonium/Objects/Misc/reklamowki.rsi
    size: Normal
  - type: Storage
    grid:
    - 0,0,3,2
    maxItemSize: Normal
  - type: Damageable
    damageModifierSet: CardboardMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BasePlasticShoppingBag
  id: PlasticShoppingBagBiedronka
  name: Biedronka shopping bag
  description: A plastic shopping bag from Biedronka.
  components:
  - type: Sprite
    state: biedronka
  - type: Item
    heldPrefix: biedronka

- type: entity
  parent: BasePlasticShoppingBag
  id: PlasticShoppingBagLidl
  name: Lidl shopping bag
  description: A plastic shopping bag from Lidl.
  components:
  - type: Sprite
    state: lidl
  - type: Item
    heldPrefix: lidl

