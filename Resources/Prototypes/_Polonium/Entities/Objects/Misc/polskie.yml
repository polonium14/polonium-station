  - type: Construction
    graph: PolishEmblemWooden
    node: emblem

- type: entity
  parent: BasePolishWallDecor
  id: PolishEmblemWoodenWall
  name: emblem in a wooden frame
  description: The image of a white eagle with a golden crown on its head turned to the right, with spread wings, golden beak and talons, set in a red shield.
  suffix: Wall
  components:
  - type: Sprite
    sprite: _Polonium/Structures/Wallmounts/godla.rsi
    state: drewniane
  - type: WallHanging
