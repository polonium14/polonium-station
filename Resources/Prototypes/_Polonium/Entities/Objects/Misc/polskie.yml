# Polskie przedmioty z NSV13 (Aquila, aq33/NSV13#304, sprite'y: Reprimann).

# Sztandar

- type: entity
  parent: BaseItem
  id: PolishBannerMundane
  name: Polish banner
  description: For the fatherland!
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Fun/sztandar.rsi
    state: icon
  - type: Item
    sprite: _Polonium/Objects/Fun/sztandar.rsi
    size: Large
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 8
  - type: Construction
    graph: PolishBanner
    node: banner

- type: entity
  parent: PolishBannerMundane
  id: PolishBanner
  suffix: Inspiring
  components:
  - type: InspiringBanner
    warcry: inspiring-banner-warcry-polish
    heal:
      Brute: 15
      Burn: 15

# Krzyże i godła wieszane na ścianie

- type: entity
  abstract: true
  parent: BaseItem
  id: BasePolishWallDecorItem
  components:
  - type: Item
    size: Small
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  abstract: true
  parent: BaseSignWeak
  id: BasePolishWallDecor
  components:
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BasePolishWallDecorItem
  id: PolishCrossWooden
  name: wooden cross
  description: Lord, have mercy on us.
  components:
  - type: Sprite
    sprite: _Polonium/Structures/Wallmounts/krzyze.rsi
    state: drewniany
  - type: WallHangable
    structure: PolishCrossWoodenWall
  - type: Construction
    graph: PolishCrossWooden
    node: cross

- type: entity
  parent: BasePolishWallDecor
  id: PolishCrossWoodenWall
  name: wooden cross
  description: Lord, have mercy on us.
  suffix: Wall
  components:
  - type: Sprite
    sprite: _Polonium/Structures/Wallmounts/krzyze.rsi
    state: drewniany
  - type: WallHanging
    item: PolishCrossWooden

- type: entity
  parent: BasePolishWallDecorItem
  id: PolishCrossGolden
  name: golden cross
  description: Lord, have mercy on us - but with style.
  components:
  - type: Sprite
    sprite: _Polonium/Structures/Wallmounts/krzyze.rsi
    state: zloty
  - type: WallHangable
    structure: PolishCrossGoldenWall
  - type: PhysicalComposition
    materialComposition:
      Gold: 100
  - type: Construction
    graph: PolishCrossGolden
    node: cross

- type: entity
  parent: BasePolishWallDecor
  id: PolishCrossGoldenWall
  name: golden cross
  description: Lord, have mercy on us - but with style.
  suffix: Wall
  components:
  - type: Sprite
    sprite: _Polonium/Structures/Wallmounts/krzyze.rsi
    state: zloty
  - type: WallHanging
    item: PolishCrossGolden

- type: entity
  parent: BasePolishWallDecorItem
