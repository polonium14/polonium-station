# Ported from Goob-Station (https://github.com/Goob-Station/Goob-Station/pull/4929)
- type: entity
  parent: BaseMachinePowered
  id: SlotMachine
  name: slot machine
  description: Gambling for the antisocial.
  components:
  - type: Sprite
    sprite: _Polonium/Structures/Machines/slot_machine.rsi
    layers:
    - state: slotmachine
    - state: slotmachine_spin
      visible: false
      map: ["slotmachine_spin"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SlotMachineVisuals.Spinning:
        slotmachine_spin:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    layoutId: SlotMachine
    boardName: wires-board-name-slot-machine
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: StationAiWhitelist
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 2
    energy: 1.5
    lightMask: ConeSingle
    autoRot: true
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Repairable
    doAfterDelay: 8
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Vending
  - type: Vocalizer
    minVocalizeInterval: 8m
    maxVocalizeInterval: 10m
    hideChat: true
  - type: VocalizerRequiresPower
  - type: DatasetVocalizer
    dataset: SlotMachineAds
  - type: StaticPrice
    price: 100
  - type: ContainerContainer
    containers:
      money: !type:ContainerSlot
  - type: ItemSlots
    slots:
      money:
        name: slotmachine-slot-money
        ejectOnBreak: true
        whitelist:
          components:
          - Cash
  - type: DoAfter
  - type: SlotMachine
    spinCost: 250
    prizes:
    - SlotMachineLose
    - SlotMachineMinorWin
    - SlotMachineSmallWin
    - SlotMachineMediumWin
    - SlotMachineLargeWin
    - SlotMachineJackpot
