- type: entity
  parent: BaseStructure
  id: IVDrip
  name: IV stand
  description: A stand meant to hold IV bags upright, injecting or drawing from patients attached to it.
  suffix: IV, empty
  components:
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MobMask
  - type: Transform
    anchored: false
    noRot: true
  - type: InteractionOutline
  - type: Clickable
  - type: Sprite
    noRot: true
    sprite: _Polonium/Structures/Machines/Medical/iv_drip.rsi
    layers:
    - state: empty
      map: [ "enum.IVDripVisualLayers.Base" ]
    - state: reagent0
      map: [ "enum.IVDripVisualLayers.Reagent" ]
  - type: IVDrip
    transferAmount: 1.0
    transferDelay: 2.0
    noBagState: empty
    unattachedState: unhooked
    attachedState: hooked
    lineOriginOffset: "0.19, 0.16"
    reagentStates:
    - 0: reagent0
    - 10: reagent10
    - 25: reagent25
    - 50: reagent50
    - 75: reagent75
    - 80: reagent80
    - 100: reagent100
    ripDamage:
      types:
        Piercing: 3
  - type: ItemSlots
    slots:
      pack:
        whitelist:
          components:
          - IVBag
  - type: ContainerContainer
    containers:
      pack: !type:ContainerSlot {}

- type: entity
  parent: BaseItem
  id: IVBag
  name: IV bag
  description: An IV bag. Contains fluids, typically used for transfusions.
  suffix: empty
  components:
  - type: IVBag
    transferAmount: 2.0
    transferDelay: 1.0
  - type: Sprite
    sprite: _Polonium/Objects/Medical/blood_pack.rsi
    layers:
    - state: bloodpack1
      map: ["enum.IVBagVisuals.Fill"]
      visible: false
    - state: bloodpack
    - state: blank
      map: ["enum.IVBagVisuals.Label"]
  - type: Item
    size: Small
    sprite: _Polonium/Objects/Medical/blood_pack.rsi
  - type: ExaminableSolution
    solution: pack
  - type: FitsInDispenser
    solution: pack
  - type: Tag
    tags:
    - Bloodpack
  - type: Solution
    id: pack
    solution:
      maxVol: 100
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: Appearance
  - type: DrawableSolution
    solution: pack
  - type: InjectableSolution
    solution: pack
  - type: RefillableSolution
    solution: pack
  - type: Damageable
    damageModifierSet: Glass
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 2
    damage:
      types:
        Blunt: 5
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpillBehavior
        solution: pack
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 30

- type: entity
  parent: IVBag
  id: IVBagSaline
  name: IV bag
  suffix: Saline
  components:
  - type: Solution
    id: pack
    solution:
      maxVol: 100
      reagents:
      - ReagentId: Saline
        Quantity: 100

- type: entity
  parent: BaseFlatpack
  id: IVDripFlatpack
  name: IV stand flatpack
  description: A flatpack used for constructing an IV stand.
  components:
  - type: Flatpack
    entity: IVDrip
  - type: Sprite
    sprite: _Polonium/Structures/Machines/Medical/iv_drip.rsi
    layers:
    - state: flatpack
