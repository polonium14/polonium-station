# Duży krzyż

- type: entity
  parent: BaseStructure
  id: PolishCrucifix
  name: cross
  description: Degenerates like you should be crucified.
  components:
  - type: Sprite
    sprite: _Polonium/Structures/Furniture/krzyz.rsi
    state: krzyz
    offset: 0,0.5
    drawdepth: Overdoors
  - type: InteractionOutline
  - type: Strap
    position: Stand
    buckleOffset: 0,0.6
  - type: Crucifix
    damage:
      types:
        Piercing: 30
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 5
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: PolishCrucifix
    node: crucifix

# Maluch

- type: entity
  id: VehicleMaluch
  name: maluch
  description: Mind your head.
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Vehicles/maluch.rsi
    state: icon
    noRot: true
    drawdepth: Mobs
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Pullable
  - type: GravityAffected
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    weightlessModifier: 0
    acceleration: 2
    friction: 2
    frictionNoInput: 6
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: Vehicle
    transferDamage: false
  - type: ContainerVehicle
    containerId: maluch_seats
  - type: ContainerVehicleEntry
    entryDelay: 2
    exitDelay: 2
  - type: PassengerVehicle
    containerId: maluch_seats
    maxOccupants: 5
    engineSound:
      path: /Audio/_Polonium/Vehicles/carrev.ogg
  - type: ContainerContainer
    containers:
      maluch_seats: !type:Container
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 5
            max: 10
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: StaticPrice
    price: 2000
