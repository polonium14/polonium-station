# Polskie struktury z NSV13 (Aquila, aq33/NSV13#304, sprite'y: Reprimann).

# Flagi

- type: entity
  parent: BaseFlag
  id: PolishFlagAnchor
  name: white-red flag with an anchor
  description: The flag used by Polish spaceships, conforming to the pattern in Annex 6 to the 'Nanotrasen Military Unit Designation Act'.
  components:
  - type: Sprite
    sprite: _Polonium/Structures/Wallmounts/flagi_polskie.rsi
    state: kotwica

- type: entity
  parent: BaseFlag
  id: PolishFlag
  name: flag of Poland
  description: The flag used by Poles, conforming to the pattern in Annex 3 to the 'Nanotrasen National Minorities Rights Act'.
  components:
  - type: Sprite
    # Flaga ma 64x32 i zajmuje dwa pola, tak jak w NSV13: od pola, na którym stoi, w prawo.
    sprite: _Polonium/Structures/Wallmounts/flagi_polskie_szerokie.rsi
    state: polska
    offset: 0.5,0

- type: entity
  parent: PolishFlag
  id: PolishFlagEagle
  name: white-red flag with an eagle
  description: The flag customarily used by Poles, not conforming to the pattern in Annex 3 to the 'Nanotrasen National Minorities Rights Act'.
  components:
  - type: Sprite
    state: orzel

