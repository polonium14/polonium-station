- type: entity
  name: vacuum ore box # Funky Station changed to make it also be able to pick up scrap items 
  id: OreBoxVacuum
  parent: BaseStorageItem
  description: A robust bag for salvage specialists and miners alike to carry large amounts of ore or scrap. Magnetises any nearby raw resources when attached to a belt.
  components:
  - type: MagnetPickup
    range: 2
    slotCheck: false
  - type: Sprite
    noRot: true
    sprite: /Textures/Structures/Storage/orebox.rsi
    layers:
    - state: orebox
    - state: orebox-top
      map: [ top ]
      visible: true
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,7
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - ArtifactFragment
        - Ore
        - Recyclable
  - type: Dumpable
  - type: Tag
    tags:
    - VacuumOreBox