# Repairs one badly damaged organ without a transplant, once per organ, like a coronary bypass,
# lobectomy, hepatectomy or gastrectomy. One surgery per organ, so the surgeon picks which one to repair.

- type: entity
  abstract: true
  parent: BasePartSurgery
  id: BaseSurgeryRepairOrgan
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - SurgeryStepRepairOrgan
  - type: SurgeryPartCondition
    categories: [ Torso ]

- type: entity
  abstract: true
  parent: BaseSurgeryRepairOrgan
  id: BaseSurgeryRepairHeadOrgan
