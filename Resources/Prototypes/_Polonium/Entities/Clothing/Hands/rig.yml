- type: entity
  abstract: true
  id: ClothingHandsModSuitBase
  categories: [ HideSpawnMenu ]
  name: R.I.G. gauntlets
  description: The gauntlets of a deployed R.I.G.
  components:
  - type: ModSuitSealable
  - type: ModSuitSealablePowerDraw
    powerDraw:
      true: 0.02
      false: 0.01
  - type: ModSuitDeployableInventory
  - type: ContainerContainer
    containers:
      mod_suit_inventory: !type:ContainerSlot {}
  - type: Clothing
    slots:
    - gloves
    clothingVisuals:
      gloves: []
  - type: Appearance
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: GuideHelp
    guides:
    - RIG

- type: entity
  parent: ClothingHandsModSuitBase
  id: ClothingHandsModSuitEngineering
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Polonium/Clothing/Hands/ModSuits/engineering.rsi
    state: icon
  - type: ModSuitSealable
    iconLayers:
      true:
      - sprite: _Polonium/Clothing/Hands/ModSuits/engineering.rsi
        state: icon-sealed
      false:
      - sprite: _Polonium/Clothing/Hands/ModSuits/engineering.rsi
        state: icon
    clothingLayers:
      true:
        gloves:
        - sprite: _Polonium/Clothing/Hands/ModSuits/engineering.rsi
          state: equipped-HAND-sealed
      false:
        gloves:
        - sprite: _Polonium/Clothing/Hands/ModSuits/engineering.rsi
          state: equipped-HAND
    uiLayer:
      true:
        sprite: _Polonium/Clothing/Hands/ModSuits/engineering.rsi
        state: equipped-HAND-sealed
      false:
        sprite: _Polonium/Clothing/Hands/ModSuits/engineering.rsi
        state: equipped-HAND
    sealedComponents:
    - type: DamageOnInteractProtection
      damageProtection:
        flatReductions:
          Heat: 10

