- type: entity
  abstract: true
  id: ClothingHeadModSuitBase
  categories: [ HideSpawnMenu ]
  name: R.I.G. helmet
  description: The helmet of a deployed R.I.G.
  components:
  - type: ModSuitSealable
    sealOtherDelay: 3
  - type: HideLayerClothing
    layers:
      Hair: HEAD
      HeadTop: HEAD
      HeadSide: HEAD
      Snout: HEAD
      FacialHair: HEAD
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 3
    energy: 2
    lightMask: ConeSingle
    autoRot: true
    netsync: false
  - type: HandheldLight
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: radiating
      interpolate: Linear
      maxDuration: 2.0
      startValue: 3.0
      endValue: 2.0
      isLooped: true
      reverseWhenFinished: true
    - !type:PulseBehaviour
      id: blinking
      interpolate: Nearest
      maxDuration: 1.0
      startValue: 0.1
      endValue: 2.0
      isLooped: true
  - type: Battery
    maxCharge: 600
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRechargeRate: 2
  - type: ModSuitSealablePowerDraw
    powerDraw:
      true: 0.02
      false: 0.01
  - type: ModSuitDeployableInventory
  - type: ContainerContainer
    containers:
      mod_suit_inventory: !type:ContainerSlot {}
  - type: Clothing
    slots:
    - head
    clothingVisuals:
      head: []
  - type: Appearance
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: GuideHelp
    guides:
    - RIG

- type: entity
  parent: ClothingHeadModSuitBase
  id: ClothingHeadModSuitEngineering
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
    state: icon
  - type: ModSuitSealable
    iconLayers:
      true:
      - sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
        state: icon-sealed
      false:
      - sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
        state: icon
    clothingLayers:
      true:
        head:
        - sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
          state: equipped-HELMET-sealed
      false:
        head:
        - sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
          state: equipped-HELMET
    uiLayer:
      true:
        sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
        state: equipped-HELMET-sealed
      false:
        sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
        state: equipped-HELMET
    unpoweredIconLayers:
      true:
      - sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
        state: icon-sealed-unpowered
    unpoweredClothingLayers:
      true:
        head:
        - sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
          state: equipped-HELMET-sealed-unpowered
    unpoweredUiLayer:
      true:
        sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
        state: equipped-HELMET-sealed-unpowered
    sealedComponents:
    - type: BreathMask
    - type: IdentityBlocker
    - type: IngestionBlocker
    - type: PressureProtection
      highPressureMultiplier: 0.1
      lowPressureMultiplier: 1000
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.95
          Heat: 0.9
          Radiation: 0.25
  - type: PointLight
    color: '#d4ecff'
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - sprite: _Polonium/Clothing/Head/ModSuits/engineering.rsi
        state: equipped-HELMET-visor
        shader: unshaded
        color: '#d4ecff'

