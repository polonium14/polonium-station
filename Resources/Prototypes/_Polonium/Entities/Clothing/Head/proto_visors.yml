# The Evil CC corporate version
- type: entity
  parent: [ClothingCyberneticBeastMantleBasic, ClothingCyberneticBeastMantleBaseSpaceProof, ClothingCyberneticBeastMantleBaseNVG, BaseCentcommContraband] 
  id: ClothingCyberneticBeastMantleCentCom
  name: Central Command's Cybernetic Visor
  description: "Higly specialized equipment used for providing aditional data about the enviroment and fixing users vision problems."
  suffix: DO NOT MAP
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Head/mantle.rsi
    state: icon-centralcommand
  - type: Clothing
    sprite: _Omu/Clothing/Head/mantle.rsi
    clothingVisuals:
      head:
      - state: helmet-centralcommand
      - state: helmet-internals
      - state: eyes-centralcommand
        shader: unshaded
  - type: FlashImmunity
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: ShowContrabandDetails
  - type: ShowHungerIcons
  - type: ShowThirstIcons
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
    - Silicon
  - type: GenericVisualizer
    visuals:
      enum.TrayScannerVisual.Visual:
        base:
          On: { state: tray-on }
          Off: { state: tray-off }
  - type: TrayScanner
    toggleAction: ActionToggleTrayScanner
    soundOn:
      path: /Audio/Items/flashlight_on.ogg
    soundOff:
      path: /Audio/Items/flashlight_off.ogg
  - type: ThermalSight
  - type: SolutionScanner
  - type: EyeProtection
