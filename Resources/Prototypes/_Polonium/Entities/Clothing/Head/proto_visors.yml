  id: ClothingCyberneticProtoVisorEngi
  name: Engineer's Cybernetic Visor
  description: Higly specialized equipment used for providing aditional data about the enviroment and fixing users vision problems. This version is space proof, has a built in T-ray scanner and provides some protection against welding arcs. Not as good as a designated mask however.
