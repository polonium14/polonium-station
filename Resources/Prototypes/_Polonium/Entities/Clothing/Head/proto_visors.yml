
# IMPORTANT: Code is a changed version by Resources\Prototypes\_Omu\Entities\Clothing\Head\mantles.txt for the purpose of fixing fork differences
# Litteraly making this into fancy glasses that go on your head...
# Balanced by the fact you can't make them and if someone steals it than well, you have poor vision even with glasses for the rest of your life.
# Also... SPACE >:3 (though Head's get Space Proof version)

# Abstract parents
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadProtoVisorBase
  abstract: true
  components:
  - type: VisionCorrection
    correctionPower: 16 # fixes ANY eye damage to the minimum allowed value
  - type: HideLayerClothing
    slots:
    - Snout
  - type: PointLight # the glow is subtle. It's just enough to make the mantle visible in pitch black lighting, but won't help you see much.
    radius: 3
    energy: 1
    color: "#CCFFCC" # light green, bc thats the colour used by original mantles
    containerOccluded: true # this makes the mantle illuminate itself.
    lightMask: ConeSingle
    autoRot: true
  - type: Clothing
    equipDelay: 1 #Just for the equip delay
    unequipDelay: 3 # So you get annoyed at it when you need to put on a spacesuit in a hurry >:3
    stripDelay: 2 # Strip already gives a 4 secound delay so this makes it 6
  - type: Item
    size: Huge
  - type: Tag # Overwrite the TagComponent from the parent to get rid of ClothMade because it's funny when a mothroach eats this ultra specialized bit of equipment, but only the first time.
    tags:
    - WhitelistChameleon
  - type: StealTarget
    stealGroup: ClothingEyesHuds # It goes on the head...but why not?
  - type: IdentityBlocker
  - type: IngestionBlocker
  - type: TriggerOnGotEquipped # Here starts the mess of components used to give visors unique features.
    keyOut: ProtoVisorEquipped
    slotFlags: HEAD
  - type: TriggerOnGotUnequipped
    keyOut: ProtoVisorUnequipped
    slotFlags: HEAD
  - type: AddComponentsOnTrigger
    targetUser: true
    keysIn:
    - ProtoVisorEquipped
    components:
    - type: PermanentBlindness # Gives blindness
      blindness: 5
  - type: DamageOnTrigger
    targetUser: true
    keysIn:
    - ProtoVisorEquipped
    damage:
      types:
        Blunt: 10
  - type: StunOnTrigger # default 1 secound stun on equip - technicly I belive it can be used to dodge a stun baton stun if timed perfectly but its sucha niche use if you pull it off its a reward for skill.
    keysIn:
    - ProtoVisorEquipped
    targetUser: true
  - type: KnockdownOnTrigger # default 1 secound stun on equip - technicly I belive it can be used to dodge a stun baton stun if timed perfectly but its sucha niche use if you pull it off its a reward for skill.
    keysIn:
    - ProtoVisorEquipped
    targetUser: true
  - type: ToggleComponentsOnTrigger # Gives the mob components to keep steady 0.5u supply of Nanobots. Change the healing values of them if you want to balance this.
    keysIn:
    - ProtoVisorEquipped
    - ProtoVisorUnequipped
    targetUser: true
    componentsAdded: false
    components:
    - type: RepeatingTrigger
      delay: 1
      nextTrigger: 1
      keyOut: ProtoVisorInjectTime
    - type: AddSolutionOnTrigger
      targetUser: false
      keysIn: 
      - ProtoVisorInjectTime
      solution: bloodstream
      addedSolution:
        reagents:
        - ReagentId: Nanobots
          Quantity: 0.5

