
# IMPORTANT: Code is a changed version by Resources\Prototypes\_Omu\Entities\Clothing\Head\mantles.txt for the purpose of fixing fork differences
# Litteraly making this into fancy glasses that go on your head...
# Balanced by the fact you can't make them and if someone steals it than well, you have poor vision even with glasses for the rest of your life.
# Also... SPACE >:3 (though Head's get Space Proof version)

# Abstract parents
- type: entity
  parent: ClothingHeadBase
  id: ClothingCyberneticProtoVisorBase
  abstract: true
  components:
  - type: VisionCorrection
    correctionPower: 16 # fixes ANY eye damage to the minimum allowed value
  - type: HideLayerClothing
    slots:
    - Snout
  - type: PointLight # the glow is subtle. It's just enough to make the mantle visible in pitch black lighting, but won't help you see much.
    radius: 1.45
    energy: 0.6
    offset: 0,0.2
    color: "#CCFFCC" # this will match the colour of the beast's eyes when worn, this is just a default.
    containerOccluded: true # this makes the mantle illuminate itself.
  - type: Item
    size: Huge
  - type: Tag # Overwrite the TagComponent from the parent to get rid of ClothMade because it's funny when a mothroach eats this ultra specialized bit of equipment, but only the first time.
    tags:
    - WhitelistChameleon
  - type: StealTarget
    stealGroup: ClothingEyesHuds # It goes on the head...but why not?
  - type: IdentityBlocker
  - type: IngestionBlocker

- type: entity
  parent: ClothingCyberneticProtoVisorBase
  id: ClothingCyberneticProtoVisorBaseSpaceProof
  abstract: true
  components:
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000

- type: entity
  parent: ClothingCyberneticProtoVisorBase
  id: ClothingCyberneticProtoVisorBaseNVG
  abstract: true
  components:
    - type: NightVision
      isEquipment: true
      color: "#0D0D0D"

# Basic Forms
- type: entity
  parent: ClothingCyberneticProtoVisorBase
  id: ClothingCyberneticProtoVisorBasic
  name: Cybernetic Visor
  description: Higly specialized equipment used for providing aditional data about the enviroment and fixing users vision problems. The most common simplest model.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Head/mantle.rsi
  - type: Clothing
    sprite: _Omu/Clothing/Head/mantle.rsi
    clothingVisuals:
      head:
      - state: helmet
      - state: eyes
        shader: unshaded

- type: entity
  parent: [ClothingCyberneticProtoVisorBase, ClothingCyberneticProtoVisorBaseSpaceProof]
  id: ClothingCyberneticProtoVisorSpaceProof # Here basicly just for if Admin wants to spawn it.
  name: Space Proof Cybernetic Visor
  description: Higly specialized equipment used for providing aditional data about the enviroment and fixing users vision problems. This one comes with aditional seals to make it space proof.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Head/mantle.rsi
    state: icon-work
  - type: Clothing
    clothingVisuals:
      head:
      - state: helmet
      - state: helmet-internals
      - state: eyes
        shader: unshaded

# Engi
