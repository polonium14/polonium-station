# Przedmioty SecurityMedic dla pracy Brigmedic (przywrócone z mastera Polonium pod forky)

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatBeretSecurityMedic
  name: security medic beret
  description: A robust beret with the medical insignia emblazoned on it. Uses reinforced fabric to offer sufficient protection.
  components:
  - type: Sprite
    sprite: Clothing/Head/Hats/beret_security_medic.rsi
  - type: Clothing
    sprite: Clothing/Head/Hats/beret_security_medic.rsi

- type: entity
  parent: ClothingHeadHelmetBasic
  id: ClothingHeadHelmetSecurityMedic
  name: security medic helmet
  description: A standard issue combat helmet for security medics. Has decent tensile strength and armor. Keep your head down.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/security_medic.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/security_medic.rsi

- type: entity
  parent: ClothingOuterArmorBasic
  id: ClothingOuterVestArmorMedSec
  name: security medic armor vest
  description: A security medic's armor vest, with little pockets for little things.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/armor_sec_med.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/armor_sec_med.rsi

- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, ShowMedicalIcons, BaseSecurityContraband]
  id: ClothingEyesGlassesMedSec
  name: medical security glasses
  description: Sunglasses with a medical and security hud
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Eyes/Glasses/medglasses.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Eyes/Glasses/medglasses.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IdentityBlocker
    coverage: EYES
