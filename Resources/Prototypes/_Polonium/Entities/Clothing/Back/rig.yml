- type: entity
  abstract: true
  parent: [ Clothing, PowerCellSlotMediumItem ]
  id: ClothingBackpackModSuitBase
  components:
  - type: ModSuitComplexityLimit
    maxComplexity: 12
  - type: ModSuitSealable
  - type: ModSuitSealablePowerDraw
    powerDraw:
      true: 0.02
      false: 0.01
  - type: ModuleContainer
    whitelist:
      tags:
      - ModSuitModule
  - type: ModuleContainerAddOnInteract
  - type: ModuleContainerPower
  - type: PowerCellDraw
    enabled: false
  - type: PowerCellSlot
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
      modules: !type:Container {}
      deployable-outerClothing: !type:ContainerSlot {}
      deployable-gloves: !type:ContainerSlot {}
      deployable-head: !type:ContainerSlot {}
      deployable-shoes: !type:ContainerSlot {}
  - type: ModSuitCellSlot
  - type: ModSuitSpeed
  - type: ModSuitUserInterface
  - type: WiresPanel
  - type: UserInterface
    interfaces:
      enum.ModSuitUiKey.Key:
        type: ModSuitBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Item
    size: Ginormous
  - type: Clothing
    slots:
    - back
    clothingVisuals:
      back: []
  - type: Appearance
  - type: HeldSpeedModifier
  - type: ContainerFill
    containers:
      modules:
      - ModSuitModuleStorageNormal
  - type: GuideHelp
    guides:
    - RIG

- type: entity
  parent: [ ClothingBackpackModSuitBase, BaseEngineeringContraband ]
  id: ClothingBackpackModSuitEngineering
  name: engineering R.I.G.
  description: A modular suit built for engineering work. Shielded against radiation.
  components:
  - type: Sprite
    sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
    state: icon
  - type: ModSuitSealable
    iconLayers:
      true:
      - sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
        state: icon-sealed
      false:
      - sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
        state: icon
    clothingLayers:
      true:
        back:
        - sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
          state: equipped-BACKPACK-sealed
      false:
        back:
        - sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
          state: equipped-BACKPACK
    uiLayer:
      true:
        sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
        state: equipped-BACKPACK-sealed
      false:
        sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
        state: equipped-BACKPACK
    unpoweredIconLayers:
      true:
      - sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
        state: icon-sealed-unpowered
      false:
      - sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
        state: icon-unpowered
    unpoweredClothingLayers:
      true:
        back:
        - sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
          state: equipped-BACKPACK-sealed-unpowered
    unpoweredUiLayer:
      true:
        sprite: _Polonium/Clothing/Back/ModSuits/engineering.rsi
        state: equipped-BACKPACK-sealed-unpowered
  - type: ModSuitPartDeployable
    deployableParts:
      outerClothing: ClothingOuterModSuitEngineering
      gloves: ClothingHandsModSuitEngineering
      head: ClothingHeadModSuitEngineering
      shoes: ClothingShoesModSuitEngineering
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: ModSuitSpeed
    unpoweredWalkModifier: 0.6
    unpoweredSprintModifier: 0.6
  - type: ModuleContainerRequireWirePanel
  - type: Construction
    graph: ModSuit
    node: engineeringPlating

