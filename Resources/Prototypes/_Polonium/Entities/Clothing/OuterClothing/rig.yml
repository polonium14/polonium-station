- type: entity
  abstract: true
  id: ClothingOuterModSuitBase
  categories: [ HideSpawnMenu ]
  name: R.I.G. chestplate
  description: The chestplate of a deployed R.I.G.
  components:
  - type: ModSuitSealable
  - type: AllowSuitStorage
  - type: Geiger
    attachedToSuit: true
  - type: HideLayerClothing
    layers:
      Tail: OUTERCLOTHING
  - type: ModSuitSealablePowerDraw
    powerDraw:
      true: 0.02
      false: 0.01
  - type: ModSuitDeployableInventory
  - type: ContainerContainer
    containers:
      mod_suit_inventory: !type:ContainerSlot {}
  - type: Clothing
    slots:
    - outerClothing
    clothingVisuals:
      outerClothing: []
  - type: Appearance
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: GuideHelp
    guides:
    - RIG

- type: entity
  parent: ClothingOuterModSuitBase
  id: ClothingOuterModSuitEngineering
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Polonium/Clothing/OuterClothing/ModSuits/engineering.rsi
    state: icon
  - type: ModSuitSealable
    iconLayers:
      true:
      - sprite: _Polonium/Clothing/OuterClothing/ModSuits/engineering.rsi
        state: icon-sealed
      false:
      - sprite: _Polonium/Clothing/OuterClothing/ModSuits/engineering.rsi
        state: icon
    clothingLayers:
      true:
        outerClothing:
        - sprite: _Polonium/Clothing/OuterClothing/ModSuits/engineering.rsi
          state: equipped-OUTERCLOTHING-sealed
      false:
        outerClothing:
        - sprite: _Polonium/Clothing/OuterClothing/ModSuits/engineering.rsi
          state: equipped-OUTERCLOTHING
    uiLayer:
      true:
        sprite: _Polonium/Clothing/OuterClothing/ModSuits/engineering.rsi
        state: equipped-OUTERCLOTHING-sealed
      false:
        sprite: _Polonium/Clothing/OuterClothing/ModSuits/engineering.rsi
        state: equipped-OUTERCLOTHING
    sealedComponents:
    - type: PressureProtection
      highPressureMultiplier: 0.04
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coefficient: 0.05
    - type: ExplosionResistance
      damageCoefficient: 0.5
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Shock: 0.8
          Caustic: 0.5
          Radiation: 0.2

