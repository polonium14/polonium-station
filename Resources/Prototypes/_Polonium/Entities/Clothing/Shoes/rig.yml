- type: entity
  abstract: true
  id: ClothingShoesModSuitBase
  categories: [ HideSpawnMenu ]
  name: R.I.G. boots
  description: The boots of a deployed R.I.G.
  components:
  - type: ModSuitSealable
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: ModSuitSealablePowerDraw
    powerDraw:
      true: 0.02
      false: 0.01
  - type: ModSuitDeployableInventory
  - type: ContainerContainer
    containers:
      mod_suit_inventory: !type:ContainerSlot {}
  - type: Clothing
    slots:
    - feet
    clothingVisuals:
      shoes: []
  - type: Appearance
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: GuideHelp
    guides:
    - RIG

- type: entity
  parent: ClothingShoesModSuitBase
  id: ClothingShoesModSuitEngineering
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
    state: icon
  - type: ModSuitSealable
    iconLayers:
      true:
      - sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
        state: icon-sealed
      false:
      - sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
        state: icon
    clothingLayers:
      true:
        shoes:
        - sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
          state: equipped-FEET-sealed
      false:
        shoes:
        - sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
          state: equipped-FEET
    uiLayer:
      true:
        sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
        state: equipped-FEET-sealed
      false:
        sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
        state: equipped-FEET
    unpoweredIconLayers:
      true:
      - sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
        state: icon-sealed-unpowered
    unpoweredClothingLayers:
      true:
        shoes:
        - sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
          state: equipped-FEET-sealed-unpowered
    unpoweredUiLayer:
      true:
        sprite: _Polonium/Clothing/Shoes/ModSuits/engineering.rsi
        state: equipped-FEET-sealed-unpowered

