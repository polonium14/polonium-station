# Issues the patient intake generator spends a case's budget on.
# Damage and bleeds land on one random limb; bone and organ issues go through the same
# trauma path real injuries take, so the normal surgeries treat them.

- type: patientIntakeIssue
  id: PatientIntakeBruising
  kind: Damage
  weight: 2
  damage:
    types:
      Blunt: 20
  description: patient-intake-issue-bruising
  symptom: patient-intake-symptom-bruising

