- type: reagent
  id: Nanobots
  name: reagent-name-nanobots
  group: Special
  desc: reagent-desc-nanobots
  physicalDesc: reagent-physical-desc-thick-and-grainy
  flavor: medicine
  color: "#add8e6"
  metabolisms:
    Bloodstream:
      effects:
      - !type:EvenHealthChange
        conditions:
        - !type:MobStateCondition # no healing in crit
          mobstate: Alive
        damage:
          Burn: -0.075
          Toxin: -0.075
          Airloss: -0.075
          Brute: -0.075
- type: reagent
  id: PenteticAcid
  name: reagent-name-pentetic-acid
  group: Medicine
  desc: reagent-desc-pentetic-acid
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#b2ffd1"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: -1
      - !type:HealOrgans
        categories: [ Kidneys, Liver, Stomach ]
        amount: 1.5
      - !type:DamageOrgans
        conditions:
        - !type:ReagentCondition
          reagent: PenteticAcid
          min: 15
        categories: [ Kidneys ]
        amount: 3
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: PenteticAcid
          min: 15
        probability: 0.02

