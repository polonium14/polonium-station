      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Salbutamol
          min: 30

- type: reagent
  id: Perfluorodecalin
  name: reagent-name-perfluorodecalin
  group: Medicine
  desc: reagent-desc-perfluorodecalin
  physicalDesc: reagent-physical-desc-viscous
  flavor: medicine
  color: "#ff6464"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Asphyxiation: -3
      - !type:HealOrgans
        categories: [ Lungs ]
        amount: 1
      - !type:DamageOrgans
        conditions:
        - !type:ReagentCondition
          reagent: Perfluorodecalin
          min: 20
        categories: [ Lungs ]
        amount: 2
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: Perfluorodecalin
          min: 20
