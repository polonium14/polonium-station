- type: entity
  abstract: true
  parent: GunSafe
  id: GunSafeBaseCentcomm
  suffix: Central Command, Locked
  components:
  - type: AccessReader
    access: [["CentralCommand"]]

- type: entity
  abstract: true
  parent: GunSafe
  id: GunSafeBaseSyndicate
  suffix: Syndicate, Locked
  components:
  - type: AccessReader
    access: [["SyndicateAgent"]]

- type: entity
  parent: [GunSafeBaseCentcomm, BaseCentcommContraband]
  id: GunSafeRifleXlr556
  name: falcon safe
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillGunSafeRifleXlr556

- type: entityTable
  id: FillGunSafeRifleXlr556
  table: !type:AllSelector
    children:
    - id: WeaponRifleXlr556
      amount: 2
    - id: MagazineRifle
