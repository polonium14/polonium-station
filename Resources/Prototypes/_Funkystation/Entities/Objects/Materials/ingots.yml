    materialComposition:
      MetalHydrogen: 100
  - type: Stack
    stackType: MetalHydrogen
    baseLayer: base
    layerStates:
    - hydrogen
    - hydrogen_2
    - hydrogen_3
  - type: Sprite
    state: hydrogen_3
