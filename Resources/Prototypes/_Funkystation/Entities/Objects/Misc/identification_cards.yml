- type: entity
  parent: [IDCardStandard, BaseCentcommContraband]
  id: InternalAffairsAgentIDCard
  name: internal affairs agent ID card
  description: You wouldn't lose this, would you?
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/id_cards.rsi
    layers:
    - state: default
    - state: decal-stripe-cc
    - sprite: _Funkystation/Interface/Misc/job_icons.rsi
      offset: "-0.125, 0.09375"
      state: InternalAffairsAgent
  - type: PresetIdCard
    job: InternalAffairsAgent

