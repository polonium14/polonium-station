# Raw

- type: entity
  name: raw mystery meat
  parent: [FoodMeatRawBase, BaseSlicingRefinableFood]
  id: FoodMysteryMeat
  description: Ground-down organic bits and pieces, coagulated into a slab of ambiguous protein.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Consumable/Food/meat.rsi
    state: mysterymeat
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
  - type: ToolRefinable
    refineResult:
    - id: FoodMysteryCutlet
      amount: 5
  - type: Construction
    graph: MysteryMeatSteak
    node: start
    defaultTarget: cooked mystery meat
  - type: Item
    sprite: Objects/Consumable/Food/meat.rsi
    size: Tiny
    shape:
    inhandVisuals:
      left:
      - state: generic-pink-inhand-left
      right:
      - state: generic-pink-inhand-right

# Cooked

- type: entity
  name: cooked mystery meat
  parent: [FoodMeatCookedBase, BaseSlicingRefinableFood]
  id: FoodMysteryMeatCooked
  description: A little more edible than when it was raw. Still just as ambiguous though.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
    - Steak
  - type: Sprite
    sprite: _Funkystation/Objects/Consumable/Food/meat.rsi
    layers:
    - state: mysterymeat-cooked
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Protein
        Quantity: 10
  - type: ToolRefinable
    refineResult:
    - id: FoodMysteryCutletCooked
      amount: 5
  - type: Construction
    graph: MysteryMeatSteak
    node: cooked mystery meat
  - type: FoodSequenceElement
    entries:
      Burger: FoodMysteryMeatCooked
      Taco: FoodMysteryMeatCooked
  - type: Item
    sprite: Objects/Consumable/Food/meat.rsi
    size: Tiny
    shape:
    inhandVisuals:
      left:
      - state: generic-pink-inhand-left
        color: brown
      right:
      - state: generic-pink-inhand-right
        color: brown

# Cutlets

# Raw

- type: entity
  name: raw mystery cutlet
  parent: FoodMeatCutletBase
  id: FoodMysteryCutlet
  description: This can probably pass for a slice of raw bacon if you squint.
  components:
  - type: Tag
    tags:
    - Raw
    - Cutlet
    - Meat
  - type: Sprite
    sprite: _Funkystation/Objects/Consumable/Food/meat.rsi
    layers:
    - state: mysterycutlet
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 4
      - ReagentId: Fat
        Quantity: 2
  - type: Construction
    graph: MysteryCutlet
    node: start
    defaultTarget: cooked mystery cutlet
  - type: Item
    sprite: Objects/Consumable/Food/meat.rsi
    size: Tiny
    shape:
    inhandVisuals:
      left:
      - state: generic-pink-inhand-left
      right:
      - state: generic-pink-inhand-right

# Cooked

- type: entity
  name: cooked mystery cutlet
  parent: FoodMeatCutletCookedBase
  id: FoodMysteryCutletCooked
  description: This can probably pass for a slice of bacon if you squint.
  components:
  - type: Tag
    tags:
    - Cooked
    - Cutlet
    - Meat
  - type: Sprite
    sprite: _Funkystation/Objects/Consumable/Food/meat.rsi
    layers:
    - state: mysterycutlet-cooked
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: Protein
        Quantity: 2
  - type: FoodSequenceElement
    entries:
      Burger: CookedMysteryCutlet
      Taco: CookedMysteryCutlet
  - type: Construction
    graph: MysteryCutlet
    node: cooked mystery cutlet
  - type: Item
    sprite: Objects/Consumable/Food/meat.rsi
    size: Tiny
    shape:
    inhandVisuals:
      left:
      - state: generic-pink-inhand-left
        color: brown
      right:
      - state: generic-pink-inhand-right
        color: brown
