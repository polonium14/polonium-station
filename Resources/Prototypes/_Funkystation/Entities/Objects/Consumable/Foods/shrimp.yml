#Shrimp Time
#2/27/25 today I have learned I am not to be trusted with terminals
- type: entity
  name: Shreersh
  parent: FoodMeatCookedBase
  id: FoodShrimpFried
  description: A shrimple meal that's easy to make by aspiring and expert chefs alike!
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Sprite
    sprite: _Funkystation/Objects/Consumable/Food/meat.rsi
    state: shrimpfried
  - type: FlavorProfile
    flavors:
    - shrimp
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Protein
        Quantity: 5
  - type: Item
    sprite: Objects/Consumable/Food/meat.rsi
    size: Tiny
    shape:
    inhandVisuals:
      left:
      - state: generic-pink-inhand-left
        color: orange
      right:
      - state: generic-pink-inhand-right
        color: orange

- type: entity
  name: Raw Shrimp
  parent: FoodMeatRawBase
  id: FoodShrimpRaw
  description: A Shmall piece of Shrimp that has yet to reach its true potential. Sauté it with some butter!
  components:
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: Sprite
    sprite: _Funkystation/Objects/Consumable/Food/meat.rsi
    state: shrimpraw
  - type: FlavorProfile
    flavors:
    - chewy
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
      - ReagentId: Protein
        Quantity: 5
  - type: Item
    sprite: Objects/Consumable/Food/meat.rsi
    size: Tiny
    shape:
    inhandVisuals:
      left:
      - state: generic-pink-inhand-left
        color: "#FFFFFF"
      right:
      - state: generic-pink-inhand-right
        color: "#FFFFFF"
