- type: entity
  parent: [BasePDA, BaseCommandContraband]
  id: InternalAffairsAgentPDA
  name: internal affairs agent PDA
  description: For spying on the innocent and guilty alike.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Devices/pda.rsi
  - type: Pda
    id: InternalAffairsAgentIDCard
    penSlot:
      startingItem: LuxuryPen
      priority: -1
      whitelist:
        tags:
        - Write
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-iaa
  - type: PdaBorderColor
    borderColor: "#6f6192"
  - type: Icon
    sprite: _Funkystation/Objects/Devices/pda.rsi
    state: pda-iaa

