# Helldiver - salvage vendor kit
- type: entity
  parent: ClothingOuterHardsuitGoliath
  id: ClothingOuterArmorHelldiver
  name: diving hardsuit
  description: A unique variant of the classic mining hardsuit, given to only the most dedicated of salvagers.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Armor/helldiver.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Armor/helldiver.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Radiation: 0.3
        Caustic: 0.85
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHelldiver
