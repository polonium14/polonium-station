- type: entity
  id: MusicTechFab
  parent: [BaseLatheLube] # Goob edit
  name: music techfab
  description: Prints equipment for use by the musician.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: music
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - MusicTechFabStatic
  - type: Machine
    board: MusicTechFabCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: OreSiloClient

- type: entity
  id: CargoTechFab
  parent: [BaseLatheLube] # Goob edit
  name: cargo techfab
  description: Prints equipment for use by cargo personnel.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: cargo
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - CargoTechFabStatic
    dynamicPacks:
    - CargoTechFabDynamic
  - type: EmagLatheRecipes
    emagStaticPacks:
    - CargoTechFabEmagStatic
  - type: Machine
    board: CargoTechFabCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: RequireProjectileTarget
  - type: OreSiloClient
