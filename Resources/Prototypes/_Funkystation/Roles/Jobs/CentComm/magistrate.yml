- type: job
  id: Magistrate
  name: Magistrate
  description: "Serve directly under CentComm. As the stations central legal authority, you authorize executions, extended detentions, warrants, etc."
  playTimeTracker: JobMagistrate
  setPreference: false
  requirements:
  - !type:RoleTimeRequirement
    role: JobHeadOfSecurity
    time: 7.5h # 7.5 hours
  - !type:DepartmentTimeRequirement
    department: CentralCommand
    time: 10h # 10 hours
  - !type:DepartmentTimeRequirement
    department: Security
    time: 37.5h # 37.5 hours
  weight: 0
  startingGear: MagistrateGear
  icon: "JobIconMagistrate"
  requireAdminNotify: true
  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  access:
  - Command
  - CentralCommand
  - Brig
  - External
  - Maintenance
  - Lawyer
  - Security
  - GenpopEnter
  - GenpopLeave
  - Cryogenics
  - Engineering
  - Medical
  - Research
  - Cargo
  - Service
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]

- type: startingGear
  id: MagistrateGear
  equipment:
    id: MagistratePDA
    eyes: ClothingEyesGlassesSecurity
    ears: ClothingHeadsetAltCentCom
    pocket2: RubberStampMagistrate
    belt: ClothingBeltStorageWaistbag
  inhand:
  - BriefcaseBrownFilled
  storage:
    back:
    - Flash
    - BookSpaceLaw
    - BluespaceLifelineImplanter
    - BoxFolderCentComClipboard

